<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none" className="w-full h-full">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#007BFF" />
      <stop offset="100%" stopColor="#00C6FF" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00C6FF" />
      <stop offset="100%" stopColor="#38BDF8" />
    </linearGradient>
    <linearGradient id="textPathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0088FF" />
      <stop offset="100%" stopColor="#00C6FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Outer -->
  <g transform="translate(10, 8) scale(0.95)">
    <!-- Shield Outer Contour -->
    <path d="M50 8 L90 24 C90 70 50 96 50 96 C50 96 10 70 10 24 Z" 
          stroke="url(#shieldGrad)" stroke-width="8" stroke-linejoin="round" fill="#0b172a" fill-opacity="0.9" />
    
    <!-- Letter A inside Shield -->
    <path d="M36 72 L50 32 L64 72 M41 58 L59 58" 
          stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Dashed Navigation Path -->
    <path d="M22 84 C38 80 50 62 68 44 C76 36 84 30 96 22" 
          stroke="url(#arrowGrad)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="4 4" />
    
    <!-- Navigation Arrow Head -->
    <polygon points="96,14 104,26 88,26" 
             fill="url(#arrowGrad)" transform="rotate(35 96 22)" filter="url(#glow)" />
  </g>

  <!-- Typography: AegisPath -->
  <g transform="translate(125, 74)">
    <text font-family="'Outfit', system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Aegis</tspan>
      <tspan fill="url(#textPathGrad)">Path</tspan>
    </text>
    <text y="24" font-family="'Outfit', system-ui, sans-serif" font-weight="700" font-size="11.5" letter-spacing="3.5" fill="#94A3B8">
      SMART NAVIGATION. SAFE JOURNEY.
    </text>
  </g>
</svg>
