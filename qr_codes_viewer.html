<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeWay V3 — Official QR Waypoints & Signage Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Outfit', sans-serif; background: #020617; color: #f8fafc; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center justify-start space-y-6">

  <!-- Header Banner -->
  <header class="max-w-7xl w-full flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl">
    <div>
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-blue-600/20 border border-blue-500/30 text-blue-400 flex items-center justify-center">
          <i data-lucide="qr-code" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-black text-white flex items-center gap-2">
            SafeWay V3 / AegisPath — QR Waypoint &amp; PDF Signage Portal
          </h1>
          <p class="text-xs md:text-sm text-slate-400 mt-0.5">
            Physical Checkpoints &bull; Multi-Floor Indoor Navigation &bull; Instant Emergency Evacuation
          </p>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="flex flex-wrap items-center gap-2.5">
      <a href="/SafeWay_QR_Codes/SafeWay_Master_All_Campus_QR_Handbook.pdf" target="_blank" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-lg shadow-blue-600/30">
        <i data-lucide="file-text" class="w-4 h-4"></i>
        Download Master Handbook PDF
      </a>
      <a href="/mobile.html" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-lg shadow-emerald-600/30">
        <i data-lucide="smartphone" class="w-4 h-4"></i>
        Mobile Scanner App
      </a>
      <a href="/index.html" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold border border-slate-700 transition flex items-center gap-2">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
        Command Center
      </a>
    </div>
  </header>

  <!-- Filter & Search Controls -->
  <section class="max-w-7xl w-full bg-slate-900/80 border border-slate-800 p-5 rounded-3xl backdrop-blur-md shadow-xl flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
    <!-- Search Box -->
    <div class="relative flex-1">
      <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
      <input
        type="text"
        id="search-input"
        placeholder="Search checkpoint by name, code (e.g. SW-RAM-G-R1), or category..."
        class="w-full bg-slate-950 border border-slate-700/80 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
      />
    </div>

    <!-- Block Filter Pills -->
    <div class="flex flex-wrap items-center gap-1.5 overflow-x-auto pb-1 md:pb-0" id="block-filters">
      <button onclick="setFilter('all')" class="filter-pill active px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white transition">
        All Blocks
      </button>
      <button onclick="setFilter('Campus Outdoor')" class="filter-pill px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
        🌳 Campus Outdoor
      </button>
      <button onclick="setFilter('Ramanujan Block')" class="filter-pill px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
        📐 Ramanujan
      </button>
      <button onclick="setFilter('Bhabha Block')" class="filter-pill px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
        🏫 Bhabha
      </button>
      <button onclick="setFilter('Kalpana Chawla Block')" class="filter-pill px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
        🚀 Kalpana Chawla
      </button>
      <button onclick="setFilter('Raman Block')" class="filter-pill px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
        🎭 Raman
      </button>
      <button onclick="setFilter('Aryabhatta Block')" class="filter-pill px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
        🔬 Aryabhatta
      </button>
      <button onclick="setFilter('Virtual Facility Nodes')" class="filter-pill px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
        🏢 Facility Nodes
      </button>
    </div>
  </section>

  <!-- Checkpoints Grid Container -->
  <main class="max-w-7xl w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="qr-cards-grid">
    <!-- Populated dynamically via JavaScript -->
  </main>

  <!-- Modal for QR Enlarged View -->
  <div id="qr-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl text-center">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-white truncate" id="modal-title">QR Checkpoint</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="bg-white p-4 rounded-2xl inline-block shadow-inner">
        <img id="modal-img" src="" alt="QR" class="w-56 h-56 object-contain" />
      </div>
      <div>
        <div class="font-mono text-xs font-bold text-blue-400 bg-blue-950/60 border border-blue-800/40 py-1.5 px-3 rounded-xl inline-block" id="modal-code">
          SW-CODE
        </div>
        <p class="text-[11px] text-slate-400 mt-2" id="modal-desc">
          Scan with SafeWay Mobile Camera
        </p>
      </div>
      <div class="flex items-center gap-2 pt-2 border-t border-slate-800">
        <button onclick="simulateScan()" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
          <i data-lucide="play" class="w-3.5 h-3.5"></i>
          Test Scan in App
        </button>
        <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition">
          Close
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { QR_LOCATION_DICTIONARY } from './services/qrLocation.js';

    let currentSelectedCode = "";
    let activeFilter = "all";
    let searchQuery = "";

    const folderMap = {
      "SW-CAMPUS": { folder: "00_Campus_Outdoor", block: "Campus Outdoor" },
      "SW-RAM-B": { folder: "01_Ramanujan_Block", block: "Ramanujan Block" },
      "SW-RAM-G": { folder: "01_Ramanujan_Block", block: "Ramanujan Block" },
      "SW-RAM-1": { folder: "01_Ramanujan_Block", block: "Ramanujan Block" },
      "SW-BHAB-B": { folder: "02_Bhabha_Block", block: "Bhabha Block" },
      "SW-BHAB-G": { folder: "02_Bhabha_Block", block: "Bhabha Block" },
      "SW-BHAB-1": { folder: "02_Bhabha_Block", block: "Bhabha Block" },
      "SW-KAL-B": { folder: "03_Kalpana_Block", block: "Kalpana Chawla Block" },
      "SW-KAL-G": { folder: "03_Kalpana_Block", block: "Kalpana Chawla Block" },
      "SW-KAL-1": { folder: "03_Kalpana_Block", block: "Kalpana Chawla Block" },
      "SW-RAMAN-G": { folder: "04_Raman_Block", block: "Raman Block" },
      "SW-RAMAN-1": { folder: "04_Raman_Block", block: "Raman Block" },
      "SW-ARYA-B": { folder: "05_Aryabhatta_Block", block: "Aryabhatta Block" },
      "SW-ARYA-G": { folder: "05_Aryabhatta_Block", block: "Aryabhatta Block" },
      "SW-ENT": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" },
      "SW-LOBBY": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" },
      "SW-RECEPTION": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" },
      "SW-ADMIN": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" },
      "SW-CAFE": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" },
      "SW-AUDITORIUM": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" },
      "SW-LAB101": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" },
      "SW-LAB102": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" },
      "SW-LIFT": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" },
      "SW-STAIR": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" },
      "SW-RESTROOM": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" },
      "SW-ROOM": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" },
      "SW-LIBRARY": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" },
      "SW-BOARDROOM": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" },
      "SW-STUDY": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" },
      "SW-REFUGE": { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" }
    };

    function getMeta(code) {
      for (const [prefix, meta] of Object.entries(folderMap)) {
        if (code.startsWith(prefix)) return meta;
      }
      return { folder: "06_BuildingGraph_Facility_Checkpoints", block: "Virtual Facility Nodes" };
    }

    function renderGrid() {
      const grid = document.getElementById("qr-cards-grid");
      grid.innerHTML = "";

      const entries = Object.entries(QR_LOCATION_DICTIONARY);
      let matches = 0;

      entries.forEach(([code, data]) => {
        const meta = getMeta(code);
        
        if (activeFilter !== "all" && meta.block !== activeFilter) {
          return;
        }

        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchesCode = code.toLowerCase().includes(q);
          const matchesName = data.name.toLowerCase().includes(q);
          const matchesZone = (data.zone || "").toLowerCase().includes(q);
          const matchesBlock = meta.block.toLowerCase().includes(q);
          if (!matchesCode && !matchesName && !matchesZone && !matchesBlock) return;
        }

        matches++;

        const card = document.createElement("div");
        card.className = "bg-slate-900/90 border border-slate-800 hover:border-blue-500/50 rounded-3xl p-5 shadow-lg flex flex-col justify-between space-y-4 transition duration-200 group";

        const floorBadge = data.floor === 0 ? "Basement" : data.floor === 1 ? "Ground Floor" : data.floor === 2 ? "First Floor" : "Outdoor";

        card.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-start justify-between gap-2">
              <span class="text-[10px] uppercase tracking-wider font-bold px-2.5 py-1 rounded-full bg-blue-950/70 border border-blue-800/50 text-blue-300">
                ${meta.block}
              </span>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-slate-800 text-slate-400">
                ${floorBadge}
              </span>
            </div>

            <div class="flex items-center gap-4">
              <!-- QR Thumbnail Preview -->
              <div class="w-20 h-20 bg-white p-1.5 rounded-2xl flex items-center justify-center cursor-pointer shadow-md group-hover:scale-105 transition" onclick="window.openQrModal('${code}', '${data.name}', '${meta.folder}')">
                <img src="/SafeWay_QR_Codes/${meta.folder}/qr_images/${code}_${encodeURIComponent(data.name.replace(/[^a-zA-Z0-9_-]/g, '_'))}.png" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(code)}'" alt="${code}" class="w-full h-full object-contain" />
              </div>

              <div class="flex-1 min-w-0">
                <h3 class="text-sm font-bold text-white truncate group-hover:text-blue-400 transition">
                  ${data.name}
                </h3>
                <div class="font-mono text-[11px] text-slate-400 mt-1 font-semibold">
                  <code>${code}</code>
                </div>
                <div class="text-[10px] text-slate-500 mt-0.5">
                  Zone: <span class="text-slate-400 font-medium">${(data.zone || "Main").toUpperCase()}</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Card Actions -->
          <div class="pt-3 border-t border-slate-800/80 flex items-center gap-2">
            <button onclick="window.openQrModal('${code}', '${data.name}', '${meta.folder}')" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1">
              <i data-lucide="maximize" class="w-3.5 h-3.5"></i> View QR
            </button>
            <a href="/mobile.html?qr=${encodeURIComponent(code)}" class="px-3 py-2 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/30 rounded-xl text-xs font-semibold transition flex items-center gap-1" title="Simulate Immediate Position Verification">
              <i data-lucide="navigation" class="w-3.5 h-3.5"></i> Test
            </a>
          </div>
        `;

        grid.appendChild(card);
      });

      if (matches === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-500 space-y-2">
            <i data-lucide="search-x" class="w-10 h-10 mx-auto text-slate-600"></i>
            <p class="text-sm font-semibold">No QR Checkpoints found matching your search.</p>
            <p class="text-xs text-slate-600">Try clearing filters or searching another keyword.</p>
          </div>
        `;
      }

      lucide.createIcons();
    }

    window.setFilter = function(filter) {
      activeFilter = filter;
      document.querySelectorAll(".filter-pill").forEach(btn => {
        btn.classList.remove("active", "bg-blue-600", "text-white");
        btn.classList.add("bg-slate-800", "text-slate-300");
      });
      event.target.classList.add("active", "bg-blue-600", "text-white");
      event.target.classList.remove("bg-slate-800", "text-slate-300");
      renderGrid();
    };

    document.getElementById("search-input").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      renderGrid();
    });

    window.openQrModal = function(code, name, folder) {
      currentSelectedCode = code;
      document.getElementById("modal-title").innerText = name;
      document.getElementById("modal-code").innerText = code;
      const safeName = name.replace(/[^a-zA-Z0-9_-]/g, '_');
      const imgPath = `/SafeWay_QR_Codes/${folder}/qr_images/${code}_${encodeURIComponent(safeName)}.png`;
      document.getElementById("modal-img").src = imgPath;
      document.getElementById("modal-desc").innerText = `Official AegisPath Waypoint Code for ${name}`;
      document.getElementById("qr-modal").classList.remove("hidden");
      document.getElementById("qr-modal").classList.add("flex");
    };

    window.closeModal = function() {
      document.getElementById("qr-modal").classList.add("hidden");
      document.getElementById("qr-modal").classList.remove("flex");
    };

    window.simulateScan = function() {
      if (!currentSelectedCode) return;
      window.location.href = `/mobile.html?qr=${encodeURIComponent(currentSelectedCode)}`;
    };

    // Initial render
    renderGrid();
    lucide.createIcons();
  </script>
</body>
</html>
