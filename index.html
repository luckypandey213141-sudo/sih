    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playEmergencySirenPulse() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(960, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(560, ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    function playAllClearChime() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
          gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.12);
          osc.stop(ctx.currentTime + idx * 0.12 + 0.3);
        });
      } catch (e) {}
    }

    function speakVoiceAlert(text) {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 1.0;
          utterance.pitch = 1.05;
          window.speechSynthesis.speak(utterance);
        }
      } catch (e) {}
    }

            { title: `Go to ${selectedMapPlan.label}`, description: floorInstruction, isFloorChange: true, targetMapId: groundMapId },
            { title: `Reached ${selectedMapPlan.label} — Change Map`, description: `After completing the floor change, open the ${selectedMapPlan.label} plan.`, targetMapId: selectedMapId, isMapChange: true, mapButtonLabel: `Change to ${selectedMapPlan.group} ${selectedMapPlan.label} Map` }
          );
        }
        steps.push(
          { title: "Start on the shortest guided route", description: `From the recognized entry, follow the moving blue dot on the shortest connected red-pathway route on ${selectedMapPlan.label}.`, targetMapId: selectedMapId },
          { title: "Follow each highlighted turn", description: "The blue line is calculated only through connected guided-path cells. Follow it straight and turn wherever the highlighted line changes direction.", targetMapId: selectedMapId },
          { title: `Turn toward ${internalDestination}`, description: `Follow the blue arrow through the final mapped corridor, then take the doorway branch for ${internalDestination}.`, targetMapId: selectedMapId },
          { title: `Arrive at ${internalDestination}`, description: `You have reached ${internalDestination} in ${selectedMapPlan.group}, ${selectedMapPlan.label}.`, targetMapId: selectedMapId }
        );
        return steps;
      }, [selectedMapId, selectedMapPlan, internalDestination, accessibilityMode, bData, userLocationNodeId, activeQuickCheckpoint, chosenFloorConnection, plannedGroundEntry]);

      // Subscribe to Realtime Data & load graph
      useEffect(() => {
        let unsub = null;
        const initializeSafeWay = () => {
          if (window.SafeWayData && !bData) {
            setBData(window.SafeWayData.INITIAL_BUILDING_DATA);
            unsub = window.SafeWayData.subscribeToRealtimeData(state => setLiveState(state));
          }
        };

        initializeSafeWay();
        window.addEventListener('safeway-ready', initializeSafeWay);
        const interval = setInterval(initializeSafeWay, 60);

        return () => {
          clearInterval(interval);
          window.removeEventListener('safeway-ready', initializeSafeWay);
          if (unsub) unsub();
        };
      }, [bData]);

      // Keep the visible plan synchronized with the detected current position.
      // Outdoor/campus nodes use the overview; recognized block nodes open the
      // corresponding internal floor plan. Manual browsing can pause this mode.
      useEffect(() => {
        if (!followPositionMap) return;
        const detectedMapId = activeQuickCheckpoint?.mapId || POSITION_TO_MAP[userLocationNodeId] || "campus";
        setGuidanceMapOverride(null);
        setSelectedMapId(detectedMapId);
        setCurrentFloor(detectedMapId === "campus" ? 1 : (detectedMapId.endsWith("first") ? 2 : 1));
      }, [userLocationNodeId, activeQuickCheckpoint, followPositionMap]);

      // Sound Siren & Vocalization during Emergency
      useEffect(() => {
        let intervalId = null;
        if (liveState?.emergencyActive && soundEnabled) {
          speakVoiceAlert("Attention! Emergency evacuation active. Please follow the illuminated green route.");
          playEmergencySirenPulse();
          intervalId = setInterval(() => playEmergencySirenPulse(), 850);
        }
        return () => {
          if (intervalId) clearInterval(intervalId);
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        };
      }, [liveState?.emergencyActive, soundEnabled]);

      if (!bData || !liveState) {
        return (
          <div className="flex h-screen items-center justify-center text-indigo-400 font-bold">
            Loading SafeWay V3 System...
          </div>
        );
      }

      const isEmergency = liveState.emergencyActive;

      const effectiveEdges = bData.edges.map(e => ({
        ...e,
        blocked: liveState.blockedEdges[e.id] !== undefined ? liveState.blockedEdges[e.id] : e.blocked
      }));

      const effectiveExits = bData.exits.map(ex => ({
        ...ex,
        isOpen: liveState.exits[ex.id]?.isOpen !== false,
        crowdLevel: liveState.crowds[ex.id] || ex.crowdLevel
      }));

      const crowdInput = {
        exits: liveState.crowds,
        edges: liveState.corridorCrowds,
        zones: liveState.crowds
      };

      // Normal Navigation Route
      const normalRoute = !isEmergency ? window.SafeWayData.findShortestPath(
        userLocationNodeId,
        destinationNodeId,
        bData.nodes,
        effectiveEdges,
        { isEmergency: false, accessibilityMode },
        crowdInput,
        liveState.hazards,
        liveState.emergencyPolicies
      ) : null;

      // Emergency Evacuation Route
      const evacuationResult = isEmergency ? window.SafeWayData.findSafestEvacuationPath(
        userLocationNodeId,
        bData.nodes,
        effectiveEdges,
        effectiveExits,
        bData.assemblyAreas,
        { isEmergency: true, accessibilityMode, nearestEmergencyDestination: true },
        crowdInput,
        liveState.hazards,
        liveState.emergencyPolicies
      ) : null;

      const activeRoute = isEmergency ? evacuationResult?.bestRoute : normalRoute;
      const emergencyGuidanceSteps = [];
      if (isEmergency && evacuationResult) {
        const currentMapId = currentLocationMapId;
        const currentPlan = currentLocationMapPlan;
        const currentGroundMapId = currentMapId === "campus" ? "campus" : `${currentMapId.split("-")[0]}-ground`;
        const emergencyDestination = evacuationResult.isRefugeRoute
          ? (evacuationResult.refugeNode?.name || "designated Area of Refuge")
          : (evacuationResult.recommendedExit?.name || evacuationResult.recommendedAssembly?.name || "the selected emergency destination");
        emergencyGuidanceSteps.push({
          title: `Current Position: ${activeQuickCheckpoint?.name || currentPositionNode?.name || "Locating…"}`,
          description: "Open the current-location map and begin on the highlighted shortest available guided path.",
          targetMapId: currentMapId,
          isCurrentPosition: true,
          isMapChange: true,
          mapButtonLabel: currentMapId === "campus" ? "Open Current Position — Main College Campus Map" : `Open Current Position — ${currentPlan.group} ${currentPlan.label} Map`
        });
        if (currentMapId !== "campus") {
          if (currentMapId !== currentGroundMapId) {
            emergencyGuidanceSteps.push(
              { title: `Move to ${currentPlan.group} Ground Floor`, description: `Follow the highlighted shortest clear path to the nearest permitted ${accessibilityMode ? "lift or designated refuge route" : "stairs or lift"}.`, targetMapId: currentMapId },
              { title: "Reached Ground Floor — Change Map", description: `Open ${currentPlan.group} Ground Floor to continue toward an available exit.`, targetMapId: currentGroundMapId, isMapChange: true, mapButtonLabel: `Change to ${currentPlan.group} Ground Floor Map` }
            );
          }
          emergencyGuidanceSteps.push(
            { title: "Follow the Ground Floor path to an available exit", description: "The highlighted route uses the shortest mapped path compatible with the existing hazard, closure and crowd decision.", targetMapId: currentGroundMapId },
            { title: "Reached Campus — Change Map", description: "After passing through the selected available exit, open the Campus Map.", targetMapId: "campus", isMapChange: true, mapButtonLabel: "Change to Main College Campus Map" }
          );
        }
        emergencyGuidanceSteps.push(
          { title: `Continue to ${emergencyDestination}`, description: evacuationResult.safetyGuidance || "Follow the highlighted emergency route and on-site instructions.", targetMapId: "campus" },
          { title: `Arrive at ${emergencyDestination}`, description: "Remain alert and follow instructions from authorized campus responders.", targetMapId: "campus" }
        );
      }

      const handleLocationChange = (nodeId) => {
        setActiveQuickCheckpoint(null);
        setFollowPositionMap(true);
        setUserLocationNodeId(nodeId);
        if (tracker) tracker.resetToOrigin();
        const node = bData.nodes.find(n => n.id === nodeId);
        if (node && node.floor && node.floor !== currentFloor) {
          setCurrentFloor(node.floor);
        }
      };

      const handleQuickCheckpoint = () => {
        const checkpoint = quickCheckpoints.find(item => item.key === quickCheckpointKey);
        if (!checkpoint) return;
        setActiveQuickCheckpoint(checkpoint);
        setUserLocationNodeId(checkpoint.nodeId);
        setCurrentFloor(checkpoint.floor);
        setSelectedMapId(checkpoint.mapId);
        setGuidanceMapOverride(checkpoint.mapId);
        setFollowPositionMap(true);
        if (tracker) tracker.resetToOrigin();
        if (checkpoint.room) setInternalDestination(checkpoint.room);
        setActiveGuidanceStep(0);
        setZoomLevel(1);
        setPan({ x: 0, y: 0 });
        setIsQrModalOpen(false);
      };

      const handleQrSubmit = (e) => {
        if (e) e.preventDefault();
        const res = window.SafeWayData.resolveQrCode(qrInputText);
        if (res && res.nodeId) {
          handleLocationChange(res.nodeId);
          if (tracker) tracker.resetToOrigin();
          setIsQrModalOpen(false);
          setQrInputText("");
        }
      };

      const currentNodes = bData.nodes.filter(n => n.floor === currentFloor || n.type === "assembly");
      const currentEdges = bData.edges.filter(e => {
        const u = bData.nodes.find(n => n.id === e.from);
        const v = bData.nodes.find(n => n.id === e.to);
        return (u?.floor === currentFloor && v?.floor === currentFloor) ||
               (u?.floor === currentFloor && v?.type === "assembly") ||
               (v?.floor === currentFloor && u?.type === "assembly");
      });

      const routeSegmentsOnFloor = [];
      if (activeRoute && activeRoute.pathNodes && activeRoute.pathNodes.length > 1) {
        const pNodes = activeRoute.pathNodes;
        for (let i = 0; i < pNodes.length - 1; i++) {
          const u = pNodes[i];
          const v = pNodes[i + 1];
          if ((u.floor === currentFloor && v.floor === currentFloor) ||
              (u.floor === currentFloor && v.type === "assembly") ||
              (u.type === "assembly" && v.floor === currentFloor)) {
            routeSegmentsOnFloor.push({ from: u, to: v, isVertical: false });
          } else if (u.floor === currentFloor && v.floor !== currentFloor) {
            routeSegmentsOnFloor.push({ from: u, to: u, isVertical: true, targetFloor: v.floor });
          }
        }
      }

      // Predictive Crowd Load Balancing: Register active evacuation route to server bus
      useEffect(() => {
        if (isEmergency && evacuationResult?.recommendedExit?.id) {
          window.SafeWayData?.registerActiveRoute('device-session-1', evacuationResult.recommendedExit.id, userNode?.zone);
        }
      }, [isEmergency, evacuationResult?.recommendedExit?.id, userNode?.zone]);

      // Calculate smooth live motion coordinates along active path
      const activePathPoints = shortestIndoorPath?.points || indoorRoute?.points || null;
      const liveMotionPoint = useMemo(() => {
        if (!activePathPoints || activePathPoints.length === 0) return null;
        if (traveledDistance <= 0) return activePathPoints[0];
        // 1m ≈ 18 canvas units
        return window.SafeWayData?.interpolatePositionOnRoute?.(activePathPoints, traveledDistance * 18) || activePathPoints[0];
      }, [activePathPoints, traveledDistance]);

      const userNodeBase = bData.nodes.find(n => n.id === userLocationNodeId);
      const userNode = activeQuickCheckpoint
        ? { ...userNodeBase, name: activeQuickCheckpoint.name, floor: activeQuickCheckpoint.floor, zone: activeQuickCheckpoint.mapId.replaceAll("-", " ") }
        : userNodeBase;
      const destNode = bData.nodes.find(n => n.id === destinationNodeId);
      const displayedGuidanceSteps = isEmergency ? emergencyGuidanceSteps : internalGuidanceSteps;
      const showMapGuidance = isEmergency
        ? emergencyGuidanceSteps.length > 0
        : selectedMapId !== "campus" && internalGuidanceSteps.length > 0;

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* Header */}
          <header className="bg-slate-900/90 backdrop-blur-2xl border-b border-slate-800 sticky top-0 z-40 px-4 sm:px-6 py-3">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 to-blue-500 flex items-center justify-center shadow-lg shadow-indigo-500/25">
                  <Icon name="navigation-2" className="w-5 h-5 text-white" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl font-black text-white">SafeWay V3</h1>
                    <span className="text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                      Indoor Navigation & Evacuation
                    </span>
                    <span className="text-[9px] font-mono px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                      Demo Mode (Local RTDB Sync)
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 font-medium">Smart India Hackathon (SIH 2026 Prototype)</p>
                </div>
              </div>

              <div className="flex items-center gap-2 sm:gap-3">
                <a
                  href="/mobile.html"
                  className="px-3.5 py-2 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-200 text-xs font-bold rounded-2xl border border-indigo-500/40 transition flex items-center gap-1.5 shadow-md"
                  title="Switch to dedicated Mobile Phone PWA Interface"
                >
                  <span>📱 Mobile App</span>
                </a>

                <a
                  href="/admin/login.html"
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-2xl border border-slate-700 transition flex items-center gap-1.5"
                >
                  <Icon name="settings" className="w-3.5 h-3.5 text-indigo-400" />
                  <span>Admin Security Console</span>
                </a>

                <button
                  onClick={() => setSoundEnabled(!soundEnabled)}
                  className={`px-3 py-2 rounded-2xl border text-xs font-bold transition flex items-center gap-2 ${
                    soundEnabled
                      ? isEmergency ? "bg-red-600/30 text-red-300 border-red-500/60 shadow-lg" : "bg-indigo-600/20 text-indigo-300 border-indigo-500/40"
                      : "bg-slate-800/80 text-slate-400 border-slate-700 hover:text-white"
                  }`}
                >
                  <Icon name={soundEnabled ? "volume-2" : "volume-x"} className="w-4 h-4" />
                  <span className="hidden sm:inline">{soundEnabled ? "Sound: ON" : "Sound: MUTE"}</span>
                </button>

                <button
                  onClick={() => setAccessibilityMode(!accessibilityMode)}
                  className={`px-4 py-2 rounded-2xl border text-xs font-bold transition flex items-center gap-2 ${
                    accessibilityMode ? "bg-emerald-600 text-white border-emerald-400 shadow-lg" : "bg-slate-800/80 text-slate-300 border-slate-700 hover:border-slate-600"
                  }`}
                >
                  <Icon name="accessibility" className="w-4 h-4" />
                  <span>♿ Step-Free</span>
                </button>
              </div>
            </div>
          </header>

          {/* Mobile & Presentation Motion Tracking Toolbar */}
          <div className="bg-slate-900/95 border-b border-slate-800 px-4 py-2.5 backdrop-blur-xl">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3 text-xs">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                  <Icon name="navigation" className="w-3.5 h-3.5 text-indigo-400" />
                  Live Motion Tracking:
                </span>

                <button
                  onClick={toggleMotionTracking}
                  className={`px-3 py-1.5 rounded-xl font-bold transition flex items-center gap-1.5 border ${
                    isMotionTracking
                      ? "bg-emerald-600/30 text-emerald-300 border-emerald-500/50 shadow-lg shadow-emerald-900/30"
                      : "bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white"
                  }`}
                  title="Uses phone accelerometer & compass to track walking"
                >
                  <span>{isMotionTracking ? "🟢 Phone Sensors Active" : "📱 Enable Phone Sensors"}</span>
                </button>

                <button
                  onClick={() => tracker?.simulateStep(1.0)}
                  className="px-3 py-1.5 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-200 border border-indigo-500/40 rounded-xl font-bold transition flex items-center gap-1"
                  title="Simulate 1 step forward along the path"
                >
                  <span>🚶 Walk +1 Step</span>
                </button>

                <button
                  onClick={() => setAutoWalkActive(!autoWalkActive)}
                  className={`px-3 py-1.5 rounded-xl font-bold transition border ${
                    autoWalkActive
                      ? "bg-amber-600/30 text-amber-300 border-amber-500/50 animate-pulse"
                      : "bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white"
                  }`}
                  title="Simulates continuous walking for live presentation demos"
                >
                  <span>{autoWalkActive ? "⏸ Pause Auto-Walk" : "▶ Auto-Walk Demo"}</span>
                </button>

                <button
                  onClick={() => tracker?.resetToOrigin()}
                  className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white border border-slate-700 rounded-xl font-semibold transition"
                  title="Reset step counter to zero"
                >
                  ↺ Reset Steps
                </button>
              </div>

              <div className="flex items-center gap-3 font-mono text-[11px] bg-slate-950/80 border border-slate-800 px-3 py-1.5 rounded-xl text-slate-300">
                <span>👣 <b>{stepCount}</b> steps</span>
                <span className="text-slate-600">|</span>
                <span>📏 <b>{traveledDistance.toFixed(1)}</b>m</span>
                <span className="text-slate-600">|</span>
                <span>🧭 <b>{compassHeading}°</b></span>
              </div>
            </div>
          </div>

          {/* Emergency Alert Banner */}
          {isEmergency && evacuationResult && (
            <div className="w-full bg-red-950 border-b-4 border-red-600 shadow-2xl p-4 sm:p-6 text-white">
              <div className="max-w-7xl mx-auto space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-4 pb-3 border-b border-red-800/80">
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 rounded-2xl bg-red-600 flex items-center justify-center shadow-2xl shadow-red-600/60 animate-bounce">
                      <Icon name="siren" className="w-7 h-7 text-white" />
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="bg-red-600 text-white text-[11px] font-black uppercase px-2.5 py-0.5 rounded tracking-widest animate-pulse">
                          🚨 CRITICAL EVACUATION ACTIVE
                        </span>
                        <span className="text-red-300 text-xs font-mono">DYNAMIC SEQUENTIAL ROUTING</span>
                      </div>
                      <h2 className="text-xl sm:text-2xl font-black tracking-tight text-white mt-0.5">
                        Follow Illuminated Safe Green Evacuation Route
                      </h2>
                    </div>
                  </div>

                  <button
                    onClick={() => window.SafeWayData.resetAllToNormal()}
                    className="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-slate-200 hover:text-white rounded-2xl text-xs font-bold uppercase tracking-wider border border-slate-700 transition"
                  >
                    Clear Emergency / Stand Down
                  </button>
                </div>

                {evacuationResult.isRefugeRoute ? (
                  <div className="bg-slate-950 rounded-3xl p-6 border-2 border-emerald-400 shadow-2xl flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                    <div className="space-y-2 flex-1">
                      <div className="flex items-center gap-2 text-emerald-400 font-bold text-xs uppercase tracking-wider">
                        <Icon name="shield-check" className="w-4 h-4 text-emerald-400" />
                        Fire Policy: Elevators Locked Down &bull; Safe Refuge Assigned
                      </div>
                      <div className="text-2xl sm:text-3xl font-black text-emerald-300 tracking-tight leading-tight">
                        Proceed to {evacuationResult.refugeNode?.name || "Floor 2 Area of Refuge"}
                      </div>
                      <p className="text-slate-300 text-sm font-medium">
                        {evacuationResult.safetyGuidance}
                      </p>
                    </div>
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl px-5 py-3.5 text-center min-w-[110px]">
                      <div className="text-[10px] uppercase font-mono text-slate-400">Refuge Distance</div>
                      <div className="text-2xl font-black text-emerald-400">{evacuationResult.bestRoute?.totalDistance}m</div>
                    </div>
                  </div>
                ) : evacuationResult.bestRoute ? (
                  <div className="bg-slate-950 rounded-3xl p-6 border-2 border-emerald-500 shadow-2xl flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                    <div className="space-y-2 flex-1">
                      <div className="flex items-center gap-2 text-emerald-400 font-bold text-xs uppercase tracking-wider">
                        <Icon name="shield-alert" className="w-4 h-4 text-emerald-400" />
                        Nearest Safe Destination via Marked Pathway
                      </div>
                      <div className="text-2xl sm:text-3xl lg:text-4xl font-black text-emerald-300 tracking-tight leading-tight">
                        Proceed to {evacuationResult.recommendedExit?.name || evacuationResult.recommendedAssembly?.name}
                      </div>
                      <p className="text-slate-300 text-sm sm:text-base font-medium flex items-center gap-2 pt-1">
                        <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                        Next Step: <strong className="text-white">{evacuationResult.bestRoute.steps[1]?.title || evacuationResult.bestRoute.steps[0]?.title}</strong>
                      </p>
                    </div>

                    <div className="flex flex-wrap items-center gap-3">
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl px-5 py-3.5 text-center min-w-[110px]">
                        <div className="text-[10px] uppercase font-mono text-slate-400">Total Distance</div>
                        <div className="text-2xl font-black text-emerald-400">{evacuationResult.bestRoute.totalDistance}m</div>
                      </div>
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl px-5 py-3.5 text-center min-w-[110px]">
                        <div className="text-[10px] uppercase font-mono text-slate-400">Est. Evac Time</div>
                        <div className="text-2xl font-black text-white">~{Math.ceil(evacuationResult.bestRoute.totalDistance / 1.2)}s</div>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="bg-red-900/80 border-2 border-red-500 rounded-3xl p-6 text-center space-y-2">
                    <h3 className="text-2xl font-black text-white">⚠️ NO SAFE EXIT PATH FOUND</h3>
                    <p className="text-red-100 max-w-xl mx-auto text-sm">
                      All exit paths are blocked by hazards. <strong>Shelter in place and await emergency responders.</strong>
                    </p>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Main Workspace */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              {/* Left Panel */}
              <div className="lg:col-span-4 space-y-4">
                {/* Navigation Card */}
                <div className="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-5 backdrop-blur-xl">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                    <h3 className="font-black text-base text-white flex items-center gap-2">
                      <Icon name="compass" className="w-5 h-5 text-indigo-400" />
                      {isEmergency ? "🚨 Emergency Evacuation" : "🧭 Navigation Assistant"}
                    </h3>
                    <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">
                      Dijkstra / A*
                    </span>
                  </div>

                  <div className="space-y-2">
                    <label className="text-[11px] font-black text-slate-400 uppercase tracking-wider flex items-center justify-between">
                      <span>🟢 1. Current Position</span>
                      <button onClick={() => setIsQrModalOpen(true)} className="text-indigo-400 text-[11px] font-bold hover:underline">[QR Scan]</button>
                    </label>
                    <div onClick={() => setIsQrModalOpen(true)} className="w-full bg-slate-950/80 border border-slate-800 hover:border-slate-700 rounded-2xl p-4 flex items-center justify-between cursor-pointer group transition">
                      <div className="flex items-center gap-3">
                        <div className="w-9 h-9 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center font-black text-xs">{userNode?.floor}F</div>
                        <div>
                          <div className="text-sm font-black text-white group-hover:text-indigo-400 transition">{userNode?.name}</div>
                          <div className="text-[10px] text-slate-400 font-medium">Zone: {userNode?.zone?.toUpperCase() || 'Lobby'}</div>
                        </div>
                      </div>
                      <Icon name="qr-code" className="w-4 h-4 text-slate-500 group-hover:text-white transition" />
                    </div>
                  </div>

                  {!isEmergency && (
                    <div className="space-y-2">
                      <label className="text-[11px] font-black text-slate-400 uppercase tracking-wider block">🏫 2. Select Campus Map / Block Floor</label>
                      <select value={selectedMapId} onChange={(event) => {
                        const campusDestination = campusDestinationForMap(event.target.value);

              <div className="lg:col-span-8 min-h-[560px] h-[700px] relative rounded-3xl overflow-hidden border border-slate-800 bg-slate-900/90 shadow-2xl">

                      setSelectedMapId(event.target.value);

                      {[...new Set(MAP_PLANS.map(plan => plan.group))].map(group => (

                        </optgroup>

                    <button onClick={() => setFollowPositionMap(true)} className={`px-3 py-2 rounded-xl text-[10px] font-black transition ${followPositionMap ? "bg-blue-600 text-white" : "bg-slate-800 text-slate-300 hover:text-white"}`}>

                      <Icon name="zoom-in" className="w-4 h-4" />
                    </button>
                    <button onClick={() => setZoomLevel(prev => Math.max(prev - 0.2, 0.6))} className="p-2 text-slate-300 hover:text-white hover:bg-slate-800 rounded-xl transition">
                      <Icon name="zoom-out" className="w-4 h-4" />
                    </button>
                    <button onClick={() => { setZoomLevel(1); setPan({ x: 0, y: 0 }); }} className="px-3 py-1 text-slate-300 hover:text-white hover:bg-slate-800 rounded-xl transition text-xs font-mono font-bold">
                      Reset
                    </button>
                  </div>
                </div>

                {/* Map SVG */}
                <div
                  className="w-full h-full cursor-grab active:cursor-grabbing relative overflow-hidden"
                  onMouseDown={(e) => {
                    if (e.target.tagName === 'svg' || e.target.tagName === 'rect' || e.target.id === 'map-background') {
                      setIsDragging(true);
                      setDragStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
                    }
                  }}
                  onMouseMove={(e) => { if (isDragging) setPan({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y }); }}
                  onMouseUp={() => setIsDragging(false)}
                >
                  <svg
                    viewBox="0 0 1000 650"
                    className="w-full h-full transition-transform duration-75"
                    style={{ transform: `scale(${zoomLevel}) translate(${pan.x}px, ${pan.y}px)`, transformOrigin: "center center" }}
                  >
                    <defs>
                      <radialGradient id="userPulseGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.9" />
                        <stop offset="100%" stopColor="#0284c7" stopOpacity="0" />
                      </radialGradient>
                      <radialGradient id="emergencyPulseGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stopColor="#34d399" stopOpacity="0.9" />
                        <stop offset="100%" stopColor="#059669" stopOpacity="0" />
                      </radialGradient>
                      <radialGradient id="hazardFireGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stopColor="#ef4444" stopOpacity="0.6" />
                        <stop offset="70%" stopColor="#dc2626" stopOpacity="0.35" />
                        <stop offset="100%" stopColor="#991b1b" stopOpacity="0.05" />
                      </radialGradient>
                      <radialGradient id="hazardSmokeGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stopColor="#f59e0b" stopOpacity="0.45" />
                        <stop offset="100%" stopColor="#b45309" stopOpacity="0.05" />
                      </radialGradient>
                      <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
                        <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" strokeWidth="0.6" strokeOpacity="0.6" />
                      </pattern>
                      <marker id="indoorRouteArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
                      </marker>
                    </defs>

                    <rect id="map-background" width="1000" height="650" fill="#070b14" />
                    <rect width="1000" height="650" fill="url(#grid)" />

                    {/* Building Shell */}
                    <g id="envelope">
                      <rect x="20" y="20" width="960" height="610" rx="24" fill="#0d1424" stroke="#1e293b" strokeWidth="2.5" />
                      
                      {/* Assembly Area A */}
                      <g transform="translate(940, 570)" className="cursor-pointer" onClick={() => setDestinationNodeId("assembly-a")}>
                        <circle r="46" fill="#065f46" fillOpacity="0.4" stroke="#10b981" strokeWidth="3" strokeDasharray="6 3" />
                        <circle r="26" fill="#059669" fillOpacity="0.9" />
                        <text y="-5" textAnchor="middle" fill="#ffffff" fontSize="11" fontWeight="900">ASSEMBLY A</text>
                        <text y="9" textAnchor="middle" fill="#a7f3d0" fontSize="9" fontWeight="bold">(East Lawn)</text>
                      </g>

                      {/* Assembly Area B */}
                      <g transform="translate(60, 70)" className="cursor-pointer" onClick={() => setDestinationNodeId("assembly-b")}>
                        <circle r="46" fill="#065f46" fillOpacity="0.4" stroke="#10b981" strokeWidth="3" strokeDasharray="6 3" />
                        <circle r="26" fill="#059669" fillOpacity="0.9" />
                        <text y="-5" textAnchor="middle" fill="#ffffff" fontSize="11" fontWeight="900">ASSEMBLY B</text>
                        <text y="9" textAnchor="middle" fill="#a7f3d0" fontSize="9" fontWeight="bold">(West Court)</text>
                      </g>

                      <rect x="130" y="70" width="760" height="460" rx="20" fill="#0a101d" stroke="#334155" strokeWidth="4.5" />
                      <text x="500" y="112" textAnchor="middle" fill="#1e293b" fontSize="36" fontWeight="900" letterSpacing="8">
                        {currentFloor === 1 ? "GROUND FLOOR (1F)" : "UPPER LEVEL (2F)"}
                      </text>
                    </g>

                    {/* User-provided college campus plan. Route nodes and edges are
                        aligned to its blue and red circulation paths. */}
                    {currentFloor === 1 && (
                      <g>
                        <image href="/assets/college-campus-layout.jpeg" x="0" y="0" width="1000" height="650" preserveAspectRatio="xMidYMid meet" />
                        <g transform="translate(535,65)">
                          <circle r="30" fill="#059669" fillOpacity="0.9" stroke="#ffffff" strokeWidth="3" />
                          <text y="-3" textAnchor="middle" fill="#ffffff" fontSize="10" fontWeight="900">SAFE PLACE</text>
                          <text y="11" textAnchor="middle" fill="#d1fae5" fontSize="8" fontWeight="800">PLAYGROUND</text>
                        </g>
                        <g transform="translate(90,145)">
                          <circle r="30" fill="#059669" fillOpacity="0.9" stroke="#ffffff" strokeWidth="3" />
                          <text y="-3" textAnchor="middle" fill="#ffffff" fontSize="10" fontWeight="900">SAFE PLACE</text>
                          <text y="11" textAnchor="middle" fill="#d1fae5" fontSize="8" fontWeight="800">BACK YARD</text>
                        </g>
                      </g>
                    )}

                    {/* Hazard Zones */}
                    <g id="hazards">
                      {bData.zones.filter(z => z.floor === currentFloor).map(zone => {
                        const h = liveState.hazards[zone.id] || "none";
                        if (h === "none") return null;

                        const zNodes = bData.nodes.filter(n => zone.nodeIds.includes(n.id));
                        if (zNodes.length === 0) return null;

                        const minX = Math.min(...zNodes.map(n => n.x - (n.roomWidth ? n.roomWidth / 2 : 30))) - 20;
                        const maxX = Math.max(...zNodes.map(n => n.x + (n.roomWidth ? n.roomWidth / 2 : 30))) + 20;
                        const minY = Math.min(...zNodes.map(n => n.y - (n.roomHeight ? n.roomHeight / 2 : 30))) - 20;
                        const maxY = Math.max(...zNodes.map(n => n.y + (n.roomHeight ? n.roomHeight / 2 : 30))) + 20;

                        const isHigh = h === "high";

                        return (
                          <g key={zone.id} className="animate-pulse">
                            <rect
                              x={minX}
                              y={minY}
                              width={maxX - minX}
                              height={maxY - minY}
                              rx="20"
                              fill={isHigh ? "url(#hazardFireGrad)" : "url(#hazardSmokeGrad)"}
                              stroke={isHigh ? "#ef4444" : "#f59e0b"}
                              strokeWidth={4}
                              strokeDasharray={isHigh ? "8 4" : "4 2"}
                            />
                            <g transform={`translate(${(minX + maxX) / 2}, ${minY + 24})`}>
                              <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#7f1d1d" stroke="#ef4444" strokeWidth="2" />
                              <text y="5" textAnchor="middle" fill="#ffffff" fontSize="11" fontWeight="900">
                                {isHigh ? "🔥 ACTIVE FIRE" : "⚠️ SMOKE WARNING"}
                              </text>
                            </g>
                          </g>
                        );
                      })}
                    </g>

                    {/* Corridors */}
                    <g id="edges">
                      {currentEdges.map(edge => {
                        const u = bData.nodes.find(n => n.id === edge.from);
                        const v = bData.nodes.find(n => n.id === edge.to);
                        if (!u || !v) return null;

                        const isBlocked = liveState.blockedEdges[edge.id] || edge.blocked;
                        const edgeCrowd = liveState.corridorCrowds[edge.id] || "Low";

                        return (
                          <g key={edge.id}>
                            <line x1={u.x} y1={u.y} x2={v.x} y2={v.y} stroke={currentFloor === 1 ? "transparent" : "#1e293b"} strokeWidth="18" strokeLinecap="round" />
                            <line
                              x1={u.x}
                              y1={u.y}
                              x2={v.x}
                              y2={v.y}
                              stroke={currentFloor === 1 ? "transparent" : (isBlocked ? "#7f1d1d" : edgeCrowd === "High" ? "#ea580c" : edgeCrowd === "Medium" ? "#d97706" : "#334155")}
                              strokeWidth="6"
                              strokeDasharray={isBlocked ? "4 4" : "none"}
                              strokeLinecap="round"
                            />
                            {isBlocked && (
                              <g transform={`translate(${(u.x + v.x) / 2}, ${(u.y + v.y) / 2})`}>
                                <circle r="14" fill="#450a0a" stroke="#ef4444" strokeWidth="2.5" />
                                <line x1="-8" y1="-8" x2="8" y2="8" stroke="#f87171" strokeWidth="3" />
                                <line x1="-8" y1="8" x2="8" y2="-8" stroke="#f87171" strokeWidth="3" />
                              </g>
                            )}
                          </g>
                        );
                      })}
                    </g>

                    <g id="active-route">
                      {routeSegmentsOnFloor.map((seg, idx) => {
                        if (seg.isVertical) {
                          return (
                            <g key={`vert-${idx}`} transform={`translate(${seg.from.x}, ${seg.from.y})`}>
                              <circle r="30" fill="none" stroke={isEmergency ? "#10b981" : "#818cf8"} strokeWidth="4" className="animate-ping" />
                              <circle r="20" fill="#1e1b4b" stroke="#818cf8" strokeWidth="3" />
                              <text y="5" textAnchor="middle" fill="#ffffff" fontSize="11" fontWeight="900">
                                {seg.targetFloor === 1 ? "↓ 1F" : "↑ 2F"}
                              </text>
                            </g>
                          );
                        }

                        const strokeColor = isEmergency ? "#10b981" : "#6366f1";

                        return (
                          <g key={`route-${idx}`}>
                            <line x1={seg.from.x} y1={seg.from.y} x2={seg.to.x} y2={seg.to.y} stroke={strokeColor} strokeWidth="9" strokeLinecap="round" opacity="0.9" />
                            <line x1={seg.from.x} y1={seg.from.y} x2={seg.to.x} y2={seg.to.y} stroke="#ffffff" strokeWidth="3.5" strokeDasharray="8 6" strokeLinecap="round" className="route-glow-dash" />
                          </g>
                        );
                      })}
                    </g>

                    {/* Rooms */}
                    <g id="rooms">
                      {(currentFloor === 1 ? [] : currentNodes.filter(n => n.type === "room")).map(room => {
                        const w = room.roomWidth || 100;
                        const h = room.roomHeight || 80;
                        const isUserHere = userLocationNodeId === room.id;
                        const isDestination = destinationNodeId === room.id;

                        return (
                          <g key={room.id} transform={`translate(${room.x - w / 2}, ${room.y - h / 2})`} className="cursor-pointer" onClick={() => setSelectedNode(room)}>
                            <rect
                              width={w}
                              height={h}
                              rx="12"
                              fill={isUserHere ? "#1e3a8a" : isDestination ? "#064e3b" : "#0d1424"}
                              stroke={isUserHere ? "#60a5fa" : isDestination ? "#34d399" : "#2d3748"}
                              strokeWidth={isUserHere || isDestination ? 3.5 : 2}
                            />
                            <rect width={w} height="20" rx="10" fill="#1e293b" fillOpacity="0.9" />
                            <text x={w / 2} y="14" textAnchor="middle" fill="#94a3b8" fontSize="9" fontWeight="900">{room.name.toUpperCase()}</text>
                            <text x={w / 2} y={h / 2 + 3} textAnchor="middle" fontSize="20">{room.icon || "🚪"}</text>
                            <text x={w / 2} y={h / 2 + 24} textAnchor="middle" fill={isUserHere ? "#93c5fd" : isDestination ? "#a7f3d0" : "#f1f5f9"} fontSize="11" fontWeight="800">
                              {room.name.split('(')[0].trim()}
                            </text>
                          </g>
                        );
                      })}
                    </g>

                    {/* Special Nodes & Areas of Refuge */}
                    <g id="facilities">
                      {(currentFloor === 1 ? [] : currentNodes.filter(n => ['stair', 'lift', 'entrance', 'exit', 'refuge'].includes(n.type))).map(node => {
                        const crowd = liveState.crowds[node.id] || "Low";
                        const isClosed = liveState.exits[node.id]?.isOpen === false;

                        let bgColor = "#1e293b";
                        let strokeColor = "#475569";
                        if (node.type === "lift") { bgColor = "#312e81"; strokeColor = "#818cf8"; }
                        else if (node.type === "stair") { bgColor = "#4a044e"; strokeColor = "#c084fc"; }
                        else if (node.type === "entrance") { bgColor = "#064e3b"; strokeColor = "#34d399"; }
                        else if (node.type === "refuge") { bgColor = "#065f46"; strokeColor = "#10b981"; }
                        else if (node.type === "exit") {
                          if (isClosed) { bgColor = "#450a0a"; strokeColor = "#ef4444"; }
                          else if (crowd === "High") { bgColor = "#78350f"; strokeColor = "#f59e0b"; }
                          else { bgColor = "#064e3b"; strokeColor = "#10b981"; }
                        }

                        return (
                          <g key={node.id} transform={`translate(${node.x}, ${node.y})`} className="cursor-pointer" onClick={() => setSelectedNode(node)}>
                            <circle r="22" fill={bgColor} stroke={strokeColor} strokeWidth="3" />
                            <text y="6" textAnchor="middle" fontSize="15">
                              {node.type === "lift" ? "🛗" : node.type === "stair" ? "🪜" : node.type === "exit" ? "🚪" : node.type === "refuge" ? "🛡️" : "🏢"}
                            </text>

                            <g transform="translate(0, 32)">
                              <rect x="-50" y="-10" width="100" height="22" rx="9" fill="#020617" fillOpacity="0.92" stroke={strokeColor} strokeWidth="1.5" />
                              <text y="5" textAnchor="middle" fill="#f8fafc" fontSize="9" fontWeight="800">
                                {node.name.length > 15 ? node.name.slice(0, 14) + '…' : node.name}
                              </text>
                            </g>

                            {node.type === "exit" && (
                              <g transform="translate(0, -28)">
                                <rect x="-34" y="-9" width="68" height="18" rx="6" fill={isClosed ? "#ef4444" : crowd === "High" ? "#ea580c" : crowd === "Medium" ? "#d97706" : "#059669"} />
                                <text y="4" textAnchor="middle" fill="#ffffff" fontSize="8" fontWeight="900">{isClosed ? "CLOSED" : `${crowd.toUpperCase()} CROWD`}</text>
                              </g>
                            )}

                            {node.type === "refuge" && (
                              <g transform="translate(0, -28)">
                                <rect x="-38" y="-9" width="76" height="18" rx="6" fill="#059669" />
                                <text y="4" textAnchor="middle" fill="#ffffff" fontSize="8" fontWeight="900">SAFE REFUGE</text>
                              </g>
                            )}
                          </g>
                        );
                      })}
                    </g>

                    {/* User Radar Pulse */}
                    {userNode && userNode.floor === currentFloor && (
                      <g transform={`translate(${userNode.x}, ${userNode.y})`} className="pointer-events-none">
                        <circle r="42" fill="url(#userPulseGrad)" className="radar-pulse" />
                        <circle r="16" fill="#0284c7" stroke="#ffffff" strokeWidth="4" />
                        <circle r="6" fill="#ffffff" />
                        <g transform="translate(0, -26)">
                          <rect x="-46" y="-13" width="92" height="22" rx="10" fill="#0284c7" stroke="#ffffff" strokeWidth="2" />
                          <text y="3" textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="900">🟢 START HERE</text>
                        </g>
                      </g>
                    )}

                    {/* Destination Star */}
                    {destNode && destNode.floor === currentFloor && !isEmergency && (
                      <g transform={`translate(${destNode.x}, ${destNode.y})`} className="pointer-events-none">
                        <circle r="38" fill="url(#emergencyPulseGrad)" className="radar-pulse" />
                        <circle r="15" fill="#10b981" stroke="#ffffff" strokeWidth="3.5" />
                        <text y="5" textAnchor="middle" fill="#ffffff" fontSize="11" fontWeight="900">★</text>
                        <g transform="translate(0, -26)">
                          <rect x="-48" y="-13" width="96" height="22" rx="10" fill="#059669" stroke="#ffffff" strokeWidth="2" />
                          <text y="3" textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="900">🏁 DESTINATION</text>
                        </g>
                      </g>
                    )}
                    {displayedMapId !== "campus" && (
                      <g>
                        <rect width="1000" height="650" fill="#f8fafc" />
                        {displayedMapPlan.src ? (
                          <image href={displayedMapPlan.src} x="20" y="55" width="960" height="575" preserveAspectRatio="xMidYMid meet" />
                        ) : (
                          <g>
                            <rect x="170" y="190" width="660" height="250" rx="28" fill="#0f172a" stroke="#6366f1" strokeWidth="3" />
                            <text x="500" y="275" textAnchor="middle" fill="#a5b4fc" fontSize="28" fontWeight="900">{displayedMapPlan.group.toUpperCase()}</text>
                            <text x="500" y="325" textAnchor="middle" fill="#ffffff" fontSize="22" fontWeight="800">{displayedMapPlan.label}</text>
                            <text x="500" y="375" textAnchor="middle" fill="#94a3b8" fontSize="15">Add this floor-plan image to complete the map.</text>
                          </g>
                        )}
                        {displayedMapPlan.src && guidedPathOverlaySrc && (
                          <image href={guidedPathOverlaySrc} x="20" y="55" width="960" height="575" preserveAspectRatio="xMidYMid meet" className="pointer-events-none">
                            <animate attributeName="opacity" values="0.18;0.35;0.18" dur="2.2s" repeatCount="indefinite" />
                          </image>
                        )}
                        {selectedGuidedPath && (
                          <g className="pointer-events-none">
                            <path d={selectedGuidedPath} fill="none" stroke="#ffffff" strokeWidth="11" strokeOpacity="0.94" strokeLinecap="round" strokeLinejoin="round" />
                            <path d={selectedGuidedPath} data-route-source={shortestIndoorPath ? "shortest-network" : "fallback"} data-route-distance={shortestIndoorPath?.distance || 0} fill="none" stroke={isEmergency ? "#10b981" : "#2563eb"} strokeWidth="6" strokeDasharray="13 8" strokeLinecap="round" strokeLinejoin="round" markerEnd="url(#indoorRouteArrow)" className="route-glow-dash" />
                            <circle r="9" fill={isEmergency ? "#10b981" : "#38bdf8"} stroke="#ffffff" strokeWidth="3">
                              <animateMotion dur="6s" repeatCount="indefinite" path={selectedGuidedPath} />
                            </circle>
                          </g>
                        )}
                        {recognizedEntryExit && (
                          <g transform={`translate(${recognizedEntryExit.point[0]},${recognizedEntryExit.point[1]})`}>
                            <circle r="18" fill="#f59e0b" fillOpacity="0.95" stroke="#ffffff" strokeWidth="3" />
                            <text y="4" textAnchor="middle" fill="#111827" fontSize="10" fontWeight="900">GATE</text>
                            <rect x="-90" y="22" width="180" height="28" rx="9" fill="#78350f" fillOpacity="0.96" />
                            <text y="41" textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="900">{recognizedEntryExit.name.toUpperCase()}</text>
                          </g>
                        )}
                        <rect x="20" y="12" width="960" height="42" rx="14" fill="#0f172a" />
                        <text x="500" y="39" textAnchor="middle" fill="#ffffff" fontSize="18" fontWeight="900">{displayedMapPlan.group} — {displayedMapPlan.label}</text>
                        {displayedGuidanceSteps[activeGuidanceStep] && (
                          <g>
                            <rect x="695" y="64" width="275" height="48" rx="14" fill="#1e3a8a" fillOpacity="0.94" stroke="#7dd3fc" strokeWidth="2" />
                            <text x="832" y="84" textAnchor="middle" fill="#7dd3fc" fontSize="9" fontWeight="900">ACTIVE GUIDANCE STEP {activeGuidanceStep + 1}</text>
                            <text x="832" y="101" textAnchor="middle" fill="#ffffff" fontSize="10" fontWeight="800">{displayedGuidanceSteps[activeGuidanceStep].title}</text>
                          </g>
                        )}
                        {/* Live Motion Tracking User Pin on Indoor Map */}
                        {liveMotionPoint ? (
                          <g transform={`translate(${liveMotionPoint[0]},${liveMotionPoint[1]})`}>
                            <circle r="36" fill="#0ea5e9" fillOpacity="0.3" className="radar-pulse" />
                            <circle r="14" fill="#0284c7" stroke="#ffffff" strokeWidth="4" />
                            {/* Directional Heading Needle */}
                            <g transform={`rotate(${compassHeading || liveMotionPoint[2] || 0})`}>
                              <polygon points="0,-24 -7,-10 7,-10" fill="#ef4444" stroke="#ffffff" strokeWidth="1.5" />
                            </g>
                            <circle r="4" fill="#ffffff" />
                            <g transform="translate(0, 26)">
                              <rect x="-50" y="-10" width="100" height="22" rx="9" fill="#0284c7" stroke="#ffffff" strokeWidth="1.5" />
                              <text y="5" textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="900">
                                {stepCount > 0 ? `👣 ${stepCount} STEPS` : "🟢 YOU ARE HERE"}
                              </text>
                            </g>
                          </g>
                        ) : (
                          <g transform="translate(82,104)">
                            <circle r="28" fill="#0ea5e9" fillOpacity="0.25" className="radar-pulse" />
                            <circle r="11" fill="#2563eb" stroke="#ffffff" strokeWidth="4" />
                            <rect x="20" y="-19" width="230" height="38" rx="12" fill="#0f172a" fillOpacity="0.94" stroke="#38bdf8" strokeWidth="2" />
                            <text x="135" y="-3" textAnchor="middle" fill="#7dd3fc" fontSize="10" fontWeight="900">CURRENT POSITION</text>
                            <text x="135" y="11" textAnchor="middle" fill="#ffffff" fontSize="11" fontWeight="800">{userNode?.name || "Locating…"}</text>
                          </g>
                        )}
                        {internalDestination && (
                          <g>
                            <rect x="300" y="592" width="400" height="42" rx="14" fill="#047857" fillOpacity="0.96" stroke="#a7f3d0" strokeWidth="2" />
                            <text x="500" y="618" textAnchor="middle" fill="#ffffff" fontSize="16" fontWeight="900">DESTINATION: {internalDestination.toUpperCase()}</text>
                          </g>
                        )}
                      </g>
                    )}
                  </svg>
                </div>
              </div>
            </div>
          </main>

          {/* QR Scanner Modal with Live Camera & Manual Fallback */}
          {isQrModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-2xl">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 shadow-2xl max-w-lg w-full space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <Icon name="qr-code" className="w-5 h-5 text-indigo-400" />
                    <h3 className="text-base font-bold text-white">Indoor QR Waypoint Scanner</h3>
                  </div>
                  <button onClick={() => { setIsQrModalOpen(false); setScannerActive(false); }} className="p-1.5 text-slate-400 hover:text-white rounded-xl hover:bg-slate-800">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                {/* Live Camera Scanner View */}
                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-slate-300">📷 Real-Time Camera Scanner:</span>
                    <button
                      type="button"
                      onClick={() => setScannerActive(!scannerActive)}
                      className={`px-3 py-1.5 text-xs font-bold rounded-xl border transition ${
                        scannerActive
                          ? "bg-red-600/30 text-red-300 border-red-500/50"
                          : "bg-indigo-600 text-white border-indigo-500 hover:bg-indigo-500"
                      }`}
                    >
                      {scannerActive ? "Stop Camera" : "Open Camera"}
                    </button>
                  </div>

                  {scannerActive && (
                    <div className="bg-black rounded-2xl overflow-hidden border border-indigo-500/50 p-2 text-center">
                      <div id="qr-reader-video" className="w-full rounded-xl overflow-hidden"></div>
                      <p className="text-[11px] text-slate-400 mt-2">Point your camera at any SafeWay waypoint code sticker.</p>
                    </div>
                  )}
                </div>

                <form onSubmit={handleQrSubmit} className="space-y-2 pt-2 border-t border-slate-800">
                  <label className="text-[11px] font-bold text-slate-400 block">Or Enter Scanned Code manually:</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="e.g. SW-ROOM204 or SW-LAB101"
                      value={qrInputText}
                      onChange={(e) => setQrInputText(e.target.value)}
                      className="flex-1 bg-slate-950 border border-slate-700 rounded-2xl p-3 text-xs text-white font-mono uppercase"
                    />
                    <button type="submit" className="px-5 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl text-xs font-bold transition">
                      Set Location
                    </button>
                  </div>
                </form>

                <div className="space-y-2 pt-2 border-t border-slate-800">
                  <div className="text-xs font-bold text-slate-400">Quick Checkpoints — Campus, Block, Floor, Room / Facility:</div>
                  <div className="flex gap-2">
                    <select
                      value={quickCheckpointKey}
                      onChange={(event) => setQuickCheckpointKey(event.target.value)}
                      className="flex-1 min-w-0 bg-slate-950 border border-slate-700 rounded-2xl p-3 text-xs text-white font-bold outline-none focus:border-indigo-500"
                      aria-label="Select any campus checkpoint"
                    >
                      <option value="">Select current position…</option>
                      {[...new Set(quickCheckpoints.map(item => item.group))].map(group => (
                        <optgroup key={group} label={group}>
                          {quickCheckpoints.filter(item => item.group === group).map(item => (
                            <option key={item.key} value={item.key}>{item.name}</option>
                          ))}
                        </optgroup>
                      ))}
                    </select>
                    <button
                      type="button"
                      disabled={!quickCheckpointKey}
                      onClick={handleQuickCheckpoint}
                      className="px-4 py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 text-white rounded-2xl text-xs font-black transition"
                    >
                      Set Here
                    </button>
                  </div>
                  <div className="text-[10px] text-slate-500">Choose any mapped campus place or room to snap position and reset sensor drift.</div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
