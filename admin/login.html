<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AegisPath — Security Console Sign In</title>
  <link rel="icon" type="image/svg+xml" href="/assets/aegispath-icon.svg">
  <link rel="apple-touch-icon" href="/assets/aegispath-icon-192.png">

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    @keyframes beam-top {
      0% { left: -50%; opacity: 0.3; filter: blur(1px); }
      50% { opacity: 0.85; filter: blur(2.5px); }
      100% { left: 100%; opacity: 0.3; filter: blur(1px); }
    }
    @keyframes beam-right {
      0% { top: -50%; opacity: 0.3; filter: blur(1px); }
      50% { opacity: 0.85; filter: blur(2.5px); }
      100% { top: 100%; opacity: 0.3; filter: blur(1px); }
    }
    @keyframes beam-bottom {
      0% { right: -50%; opacity: 0.3; filter: blur(1px); }
      50% { opacity: 0.85; filter: blur(2.5px); }
      100% { right: 100%; opacity: 0.3; filter: blur(1px); }
    }
    @keyframes beam-left {
      0% { bottom: -50%; opacity: 0.3; filter: blur(1px); }
      50% { opacity: 0.85; filter: blur(2.5px); }
      100% { bottom: 100%; opacity: 0.3; filter: blur(1px); }
    }
    @keyframes corner-pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.9); }
      50% { opacity: 0.6; transform: scale(1.15); }
    }
    @keyframes card-glow-pulse {
      0%, 100% { box-shadow: 0 0 12px 2px rgba(99,102,241,0.06); opacity: 0.25; }
      50% { box-shadow: 0 0 26px 8px rgba(99,102,241,0.22); opacity: 0.55; }
    }
    @keyframes button-sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .animate-beam-top {
      animation: beam-top 2.5s ease-in-out infinite;
    }
    .animate-beam-right {
      animation: beam-right 2.5s ease-in-out 0.6s infinite;
    }
    .animate-beam-bottom {
      animation: beam-bottom 2.5s ease-in-out 1.2s infinite;
    }
    .animate-beam-left {
      animation: beam-left 2.5s ease-in-out 1.8s infinite;
    }
    .animate-corner-1 { animation: corner-pulse 2s ease-in-out infinite; }
    .animate-corner-2 { animation: corner-pulse 2.4s ease-in-out 0.5s infinite; }
    .animate-corner-3 { animation: corner-pulse 2.2s ease-in-out 1s infinite; }
    .animate-corner-4 { animation: corner-pulse 2.3s ease-in-out 1.5s infinite; }
    .animate-card-glow { animation: card-glow-pulse 4s ease-in-out infinite; }
    .animate-btn-sweep { animation: button-sweep 2s ease-in-out infinite; }
    .card-3d-wrapper {
      perspective: 1500px;
    }
    .card-3d-inner {
      transform-style: preserve-3d;
      will-change: transform;
    }
  </style>
</head>
<body id="login-body" class="min-h-screen bg-[#12181a] text-slate-100 flex items-center justify-center p-3 sm:p-6 relative overflow-x-hidden overflow-y-auto font-sans select-none transition-colors duration-300">
  <!-- Interactive Kinetic Grid Background Canvas (Turtle Theme) -->
  <canvas id="kinetic-grid-canvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none"></canvas>

  <!-- Top-Right Theme Toggle Button -->
  <div class="fixed top-3 right-3 sm:top-5 sm:right-5 z-30">
    <button id="theme-toggle-btn" class="px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl sm:rounded-2xl border text-xs font-bold flex items-center gap-1.5 sm:gap-2 transition-all shadow-md active:scale-95 bg-[#162022]/90 border-[#557B83]/40 text-[#E5EFC1] hover:bg-[#1e2a2e]" title="Switch Theme (Turtle Dark / Turtle Light)">
      <span id="theme-icon">🌙</span>
      <span id="theme-label" class="capitalize hidden xs:inline sm:inline">Turtle Dark</span>
    </button>
  </div>

  <!-- 3D Perspective Card Wrapper (sign-in-card-2) -->
  <div id="card-3d-wrapper" class="card-3d-wrapper relative z-10 w-full max-w-md my-auto">
    <div id="card-3d-inner" class="card-3d-inner relative group">
      
      <!-- Outer Card Glow on Hover -->
      <div id="card-glow" class="absolute -inset-[1px] rounded-3xl opacity-0 group-hover:opacity-80 transition-opacity duration-700 animate-card-glow pointer-events-none"></div>

      <!-- Traveling Light Beam Effect along Borders (Turtle Theme) -->
      <div class="absolute -inset-[1px] rounded-3xl overflow-hidden pointer-events-none z-20">
        <!-- Top Light Beam -->
        <div id="beam-top" class="absolute top-0 left-0 h-[3px] w-[50%] bg-gradient-to-r from-transparent via-[#39AEA9] to-transparent opacity-80 animate-beam-top"></div>
        <!-- Right Light Beam -->
        <div id="beam-right" class="absolute top-0 right-0 h-[50%] w-[3px] bg-gradient-to-b from-transparent via-[#A2D5AB] to-transparent opacity-80 animate-beam-right"></div>
        <!-- Bottom Light Beam -->
        <div id="beam-bottom" class="absolute bottom-0 right-0 h-[3px] w-[50%] bg-gradient-to-r from-transparent via-[#39AEA9] to-transparent opacity-80 animate-beam-bottom"></div>
        <!-- Left Light Beam -->
        <div id="beam-left" class="absolute bottom-0 left-0 h-[50%] w-[3px] bg-gradient-to-b from-transparent via-[#A2D5AB] to-transparent opacity-80 animate-beam-left"></div>

        <!-- Subtle Corner Glow Spots -->
        <div class="absolute top-0 left-0 h-2 w-2 rounded-full bg-[#E5EFC1] blur-[1px] animate-corner-1"></div>
        <div class="absolute top-0 right-0 h-2.5 w-2.5 rounded-full bg-[#39AEA9] blur-[2px] animate-corner-2"></div>
        <div class="absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full bg-[#A2D5AB] blur-[2px] animate-corner-3"></div>
        <div class="absolute bottom-0 left-0 h-2 w-2 rounded-full bg-[#E5EFC1] blur-[1px] animate-corner-4"></div>
      </div>

      <!-- Card Border Glow -->
      <div class="absolute -inset-[0.5px] rounded-3xl bg-gradient-to-r from-[#39AEA9]/20 via-[#A2D5AB]/25 to-[#39AEA9]/20 opacity-0 group-hover:opacity-75 transition-opacity duration-500 pointer-events-none"></div>

      <!-- Glass Card Background Panel -->
      <main id="card-panel" class="relative z-10 w-full rounded-3xl border border-[#557B83]/40 bg-[#162022]/90 backdrop-blur-2xl p-5 sm:p-8 shadow-2xl shadow-black/90 overflow-hidden transition-colors duration-300">
        <!-- Subtle Inner Grid Pattern Overlay -->
        <div class="absolute inset-0 opacity-[0.04] pointer-events-none" style="background-image: linear-gradient(135deg, white 0.5px, transparent 0.5px), linear-gradient(45deg, white 0.5px, transparent 0.5px); background-size: 30px 30px;"></div>

        <!-- Logo and Header -->
        <div class="relative z-10 mb-7 flex items-center gap-3.5">
          <div class="relative group/logo">
            <div class="absolute -inset-1 rounded-2xl bg-[#39AEA9]/30 blur-md group-hover/logo:bg-[#39AEA9]/50 transition-colors"></div>
            <img src="/assets/aegispath-icon.svg" alt="AegisPath Logo" class="relative h-12 w-12 rounded-2xl shadow-xl shadow-[#39AEA9]/25 ring-1 ring-white/10">
          </div>
          <div>
            <h1 id="brand-title" class="text-xl font-black tracking-tight text-[#E5EFC1] flex items-center gap-2">
              <span>AegisPath</span>
              <span id="brand-badge" class="text-[9px] font-black uppercase px-2 py-0.5 rounded-full bg-[#39AEA9]/20 text-[#E5EFC1] border border-[#39AEA9]/40">V3</span>
            </h1>
            <p id="brand-sub" class="text-xs text-[#A2D5AB] font-bold uppercase tracking-wider">Security Operations Command Access</p>
          </div>
        </div>

        <h2 id="card-title" class="relative z-10 text-2xl font-black text-white">Admin verification required</h2>
        <p id="card-desc" class="relative z-10 mt-1.5 text-sm text-[#A2D5AB]/90 font-medium">Enter the authorized username and passcode to open the Security Console.</p>

        <!-- Login Form -->
        <form id="login-form" class="relative z-10 mt-6 space-y-4">
          <!-- Username Input -->
          <div class="space-y-1.5">
            <label for="username" id="label-user" class="block text-xs font-bold uppercase tracking-wider text-[#A2D5AB]">Username</label>
            <div id="wrap-user" class="relative flex items-center rounded-xl overflow-hidden border border-[#557B83]/40 bg-[#12181a]/80 focus-within:border-[#39AEA9] focus-within:ring-2 focus-within:ring-[#39AEA9]/30 focus-within:bg-[#12181a] transition-all">
              <svg class="absolute left-3.5 w-4 h-4 text-[#A2D5AB]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
              <input id="username" autocomplete="username" required autofocus placeholder="Enter admin username" class="w-full bg-transparent px-4 py-3 pl-10 text-sm text-white placeholder:text-slate-500 outline-none">
            </div>
          </div>

          <!-- Passcode Input with Eye Toggle -->
          <div class="space-y-1.5">
            <label for="password" id="label-pass" class="block text-xs font-bold uppercase tracking-wider text-[#A2D5AB]">Passcode</label>
            <div id="wrap-pass" class="relative flex items-center rounded-xl overflow-hidden border border-[#557B83]/40 bg-[#12181a]/80 focus-within:border-[#39AEA9] focus-within:ring-2 focus-within:ring-[#39AEA9]/30 focus-within:bg-[#12181a] transition-all">
              <svg class="absolute left-3.5 w-4 h-4 text-[#A2D5AB]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
              <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••••••" class="w-full bg-transparent px-4 py-3 pl-10 pr-11 text-sm text-white placeholder:text-slate-500 outline-none font-mono">
              <button type="button" id="toggle-password" class="absolute right-3 p-1 text-[#A2D5AB] hover:text-[#E5EFC1] transition-colors" title="Toggle passcode visibility">
                <!-- Eye Open -->
                <svg id="eye-open-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
                <!-- Eye Closed -->
                <svg id="eye-closed-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Error Alert Banner -->
          <p id="error" role="alert" class="min-h-5 text-xs font-semibold text-red-400"></p>

          <!-- Animated Submit Button with Turtle Teal / High Contrast Text -->
          <button id="submit-btn" type="submit" class="w-full relative group/btn rounded-xl overflow-hidden bg-[#39AEA9] hover:bg-[#2E9994] px-4 py-3.5 font-bold text-[#12181a] shadow-xl shadow-[#39AEA9]/30 transition-all duration-300 active:scale-[0.98]">
            <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/30 to-transparent animate-btn-sweep pointer-events-none"></div>
            <div class="relative flex items-center justify-center gap-2">
              <span id="btn-text" class="flex items-center justify-center gap-2 text-sm font-black uppercase tracking-wider">
                <span>Unlock Security Console</span>
                <svg class="w-4 h-4 group-hover/btn:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
              </span>
              <span id="btn-spinner" class="hidden flex items-center gap-2 text-sm font-bold">
                <div class="w-4 h-4 border-2 border-[#12181a] border-t-transparent rounded-full animate-spin"></div>
                <span>Verifying Authorization...</span>
              </span>
            </div>
          </button>
        </form>

        <a id="return-link" href="/mobile.html" class="relative z-10 mt-6 block text-center text-xs font-bold text-[#A2D5AB] hover:text-[#E5EFC1] transition-colors">
          ← Return to User Application
        </a>
      </main>
    </div>
  </div>

<script>
    // Kinetic Grid Interactive Canvas Animation
    (function initKineticGrid() {
      const canvas = document.getElementById('kinetic-grid-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const CELL_SIZE = 55;
      const INFLUENCE_RADIUS = 260;
      const MAX_WARP = 24;
      const DOT_SPACING = 28;
      const LERP_SPEED = 0.26; // Low latency snappier tracking
      const NODE_BASE_RADIUS = 1.8;
      const NODE_ACTIVE_RADIUS = 3.2;

      const THEMES = {
        dark: {
          name: 'dark',
          label: 'Turtle Dark',
          icon: '🌙',
          bg: '#12181a',
          cardBg: 'rgba(22, 32, 34, 0.92)',
          cardBorder: 'rgba(85, 123, 131, 0.4)',
          textColor: '#ffffff',
          titleColor: '#E5EFC1',
          subColor: '#A2D5AB',
          btnBg: '#39AEA9',
          btnHover: '#2E9994',
          btnText: '#12181a',
          inputBg: 'rgba(18, 24, 26, 0.8)',
          inputBorder: 'rgba(85, 123, 131, 0.4)',
          inputText: '#ffffff',
          returnLink: '#A2D5AB',
          lineBase: { r: 85, g: 123, b: 131, a: 0.22 },
          lineActive: { r: 57, g: 174, b: 169, a: 0.95 },
          nodeBase: { r: 162, g: 213, b: 171, a: 0.35 },
          nodeActive: { r: 229, g: 239, b: 193, a: 1.0 },
          glow: '57,174,169',
          ripple: '162,213,171',
          dots: 'rgba(162,213,171,0.06)',
          beamTop: 'linear-gradient(to right, transparent, #39AEA9, transparent)',
          beamRight: 'linear-gradient(to bottom, transparent, #A2D5AB, transparent)',
          beamBottom: 'linear-gradient(to right, transparent, #39AEA9, transparent)',
          beamLeft: 'linear-gradient(to bottom, transparent, #A2D5AB, transparent)'
        },
        light: {
          name: 'light',
          label: 'Turtle Light',
          icon: '☀️',
          bg: '#f6f9f5',
          cardBg: 'rgba(255, 255, 255, 0.96)',
          cardBorder: 'rgba(85, 123, 131, 0.3)',
          textColor: '#12181a',
          titleColor: '#12181a',
          subColor: '#206D69',
          btnBg: '#206D69',
          btnHover: '#185350',
          btnText: '#ffffff',
          inputBg: 'rgba(240, 245, 241, 0.9)',
          inputBorder: 'rgba(85, 123, 131, 0.35)',
          inputText: '#12181a',
          returnLink: '#206D69',
          lineBase: { r: 85, g: 123, b: 131, a: 0.25 },
          lineActive: { r: 32, g: 109, b: 105, a: 0.95 },
          nodeBase: { r: 85, g: 123, b: 131, a: 0.35 },
          nodeActive: { r: 32, g: 109, b: 105, a: 1.0 },
          glow: '32,109,105',
          ripple: '57,174,169',
          dots: 'rgba(32,109,105,0.08)',
          beamTop: 'linear-gradient(to right, transparent, #206D69, transparent)',
          beamRight: 'linear-gradient(to bottom, transparent, #39AEA9, transparent)',
          beamBottom: 'linear-gradient(to right, transparent, #206D69, transparent)',
          beamLeft: 'linear-gradient(to bottom, transparent, #39AEA9, transparent)'
        }
      };

      let currentThemeKey = localStorage.getItem('aegispath_admin_theme') === 'light' ? 'light' : 'dark';
      let theme = THEMES[currentThemeKey];

      function applyThemeUI(tKey) {
        currentThemeKey = tKey;
        theme = THEMES[tKey] || THEMES.dark;
        localStorage.setItem('aegispath_admin_theme', tKey);

        const body = document.getElementById('login-body');
        if (body) body.style.backgroundColor = theme.bg;

        const themeIcon = document.getElementById('theme-icon');
        const themeLabel = document.getElementById('theme-label');
        if (themeIcon) themeIcon.textContent = theme.icon;
        if (themeLabel) themeLabel.textContent = theme.label;

        const cardPanel = document.getElementById('card-panel');
        if (cardPanel) {
          cardPanel.style.backgroundColor = theme.cardBg;
          cardPanel.style.borderColor = theme.cardBorder;
        }

        const brandTitle = document.getElementById('brand-title');
        if (brandTitle) brandTitle.style.color = theme.titleColor;

        const brandSub = document.getElementById('brand-sub');
        if (brandSub) brandSub.style.color = theme.subColor;

        const cardTitle = document.getElementById('card-title');
        if (cardTitle) cardTitle.style.color = theme.titleColor;

        const cardDesc = document.getElementById('card-desc');
        if (cardDesc) cardDesc.style.color = theme.subColor;

        const labelUser = document.getElementById('label-user');
        if (labelUser) labelUser.style.color = theme.subColor;

        const labelPass = document.getElementById('label-pass');
        if (labelPass) labelPass.style.color = theme.subColor;

        const wrapUser = document.getElementById('wrap-user');
        if (wrapUser) {
          wrapUser.style.backgroundColor = theme.inputBg;
          wrapUser.style.borderColor = theme.inputBorder;
        }

        const wrapPass = document.getElementById('wrap-pass');
        if (wrapPass) {
          wrapPass.style.backgroundColor = theme.inputBg;
          wrapPass.style.borderColor = theme.inputBorder;
        }

        const userInput = document.getElementById('username');
        if (userInput) userInput.style.color = theme.inputText;

        const passInput = document.getElementById('password');
        if (passInput) passInput.style.color = theme.inputText;

        const submitBtn = document.getElementById('submit-btn');
        if (submitBtn) {
          submitBtn.style.backgroundColor = theme.btnBg;
          submitBtn.style.color = theme.btnText;
        }

        const returnLink = document.getElementById('return-link');
        if (returnLink) returnLink.style.color = theme.returnLink;

        const beamTop = document.getElementById('beam-top');
        if (beamTop) beamTop.style.background = theme.beamTop;

        const beamRight = document.getElementById('beam-right');
        if (beamRight) beamRight.style.background = theme.beamRight;

        const beamBottom = document.getElementById('beam-bottom');
        if (beamBottom) beamBottom.style.background = theme.beamBottom;

        const beamLeft = document.getElementById('beam-left');
        if (beamLeft) beamLeft.style.background = theme.beamLeft;
      }

      applyThemeUI(currentThemeKey);

      const themeToggleBtn = document.getElementById('theme-toggle-btn');
      if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', () => {
          const next = currentThemeKey === 'dark' ? 'light' : 'dark';
          applyThemeUI(next);
        });
      }

      let W = 0, H = 0;
      let mouse = { x: -9999, y: -9999 };
      let targetMouse = { x: -9999, y: -9999 };
      let ripples = [];

      function lerpN(a, b, t) { return a + (b - a) * t; }
      function lerpColor(base, active, t) {
        const r = Math.round(lerpN(base.r, active.r, t));
        const g = Math.round(lerpN(base.g, active.g, t));
        const b = Math.round(lerpN(base.b, active.b, t));
        const a = lerpN(base.a, active.a, t);
        return `rgba(${r},${g},${b},${a.toFixed(3)})`;
      }

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
      }
      resize();
      window.addEventListener('resize', resize);

      window.addEventListener('pointermove', e => {
        targetMouse.x = e.clientX;
        targetMouse.y = e.clientY;
      }, { passive: true });

      window.addEventListener('pointerdown', e => {
        ripples.push({
          x: e.clientX,
          y: e.clientY,
          radius: 0,
          opacity: 1,
          born: performance.now()
        });
      }, { passive: true });

      function getWarpedPoint(gx, gy, col, row, cols, rows) {
        const edgeMargin = 1.5;
        const colPin = Math.min(col / edgeMargin, (cols - 1 - col) / edgeMargin, 1);
        const rowPin = Math.min(row / edgeMargin, (rows - 1 - row) / edgeMargin, 1);
        const pinFactor = colPin * colPin * rowPin * rowPin;

        const dx = gx - mouse.x;
        const dy = gy - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const proximity = Math.max(0, 1 - dist / INFLUENCE_RADIUS) * pinFactor;

        let rx = 0, ry = 0;
        for (const r of ripples) {
          const rdx = gx - r.x;
          const rdy = gy - r.y;
          const rdist = Math.sqrt(rdx * rdx + rdy * rdy);
          const waveWidth = 55;
          const diff = rdist - r.radius;
          if (Math.abs(diff) < waveWidth) {
            const strength = (1 - Math.abs(diff) / waveWidth) * r.opacity * 18 * pinFactor;
            const angle = Math.atan2(rdy, rdx);
            const sign = diff < 0 ? -1 : 1;
            rx += Math.cos(angle) * strength * sign * -1;
            ry += Math.sin(angle) * strength * sign * -1;
          }
        }

        if (proximity > 0) {
          const angle = Math.atan2(dy, dx);
          const warpAmt = proximity * MAX_WARP;
          return {
            pt: {
              x: gx - Math.cos(angle) * warpAmt + rx,
              y: gy - Math.sin(angle) * warpAmt + ry
            },
            proximity
          };
        }

        return { pt: { x: gx + rx, y: gy + ry }, proximity };
      }

      function draw(now) {
        ctx.clearRect(0, 0, W, H);

        ctx.fillStyle = theme.bg;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = theme.dots;
        for (let x = DOT_SPACING / 2; x < W; x += DOT_SPACING) {
          for (let y = DOT_SPACING / 2; y < H; y += DOT_SPACING) {
            ctx.fillRect(x - 0.5, y - 0.5, 1, 1);
          }
        }

        mouse.x += (targetMouse.x - mouse.x) * LERP_SPEED;
        mouse.y += (targetMouse.y - mouse.y) * LERP_SPEED;

        const maxRippleRadius = Math.max(W, H) * 0.9;
        for (let i = ripples.length - 1; i >= 0; i--) {
          const r = ripples[i];
          const age = now - r.born;
          r.radius = age * 0.32;
          r.opacity = Math.max(0, 1 - r.radius / maxRippleRadius);
          if (r.opacity <= 0.01) {
            ripples.splice(i, 1);
          }
        }

        const cols = Math.ceil(W / CELL_SIZE) + 1;
        const rows = Math.ceil(H / CELL_SIZE) + 1;
        const pts = [];
        const prox = [];

        for (let row = 0; row < rows; row++) {
          pts[row] = [];
          prox[row] = [];
          for (let col = 0; col < cols; col++) {
            const gx = col * CELL_SIZE;
            const gy = row * CELL_SIZE;
            const { pt, proximity } = getWarpedPoint(gx, gy, col, row, cols, rows);
            pts[row][col] = pt;
            prox[row][col] = proximity;
          }
        }

        const drawSeg = (p1, p2, pr1, pr2) => {
          const avg = (pr1 + pr2) * 0.5;
          const t = avg * avg * (3 - 2 * avg);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = lerpColor(theme.lineBase, theme.lineActive, t);
          ctx.lineWidth = lerpN(0.8, 1.5, t);
          ctx.stroke();
        };

        ctx.lineCap = 'butt';
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols - 1; col++) {
            drawSeg(pts[row][col], pts[row][col + 1], prox[row][col], prox[row][col + 1]);
          }
        }
        for (let col = 0; col < cols; col++) {
          for (let row = 0; row < rows - 1; row++) {
            drawSeg(pts[row][col], pts[row + 1][col], prox[row][col], prox[row + 1][col]);
          }
        }

        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const p = pts[row][col];
            const pr = prox[row][col];
            const t = pr * pr * (3 - 2 * pr);
            const r = lerpN(NODE_BASE_RADIUS, NODE_ACTIVE_RADIUS, t);

            if (t > 0.3) {
              const glowR = r + lerpN(0, 6, (t - 0.3) / 0.7);
              const grd = ctx.createRadialGradient(p.x, p.y, r * 0.5, p.x, p.y, glowR);
              grd.addColorStop(0, `rgba(${theme.glow},${(t * 0.3).toFixed(3)})`);
              grd.addColorStop(1, `rgba(${theme.glow},0)`);
              ctx.beginPath();
              ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
              ctx.fillStyle = grd;
              ctx.fill();
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fillStyle = lerpColor(theme.nodeBase, theme.nodeActive, t);
            ctx.fill();
          }
        }

        for (const r of ripples) {
          const safeRadius = Math.max(0, r.radius);
          ctx.beginPath();
          ctx.arc(r.x, r.y, safeRadius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(${theme.ripple},${(r.opacity * 0.28).toFixed(3)})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();

    // 3D Card Interactive Tilt Effect (sign-in-card-2)
    (function init3DCardTilt() {
      const cardWrapper = document.getElementById('card-3d-wrapper');
      const cardInner = document.getElementById('card-3d-inner');
      if (!cardWrapper || !cardInner) return;

      let currentX = 0, currentY = 0;
      let targetX = 0, targetY = 0;
      let isHovering = false;

      cardWrapper.addEventListener('pointermove', e => {
        isHovering = true;
        const rect = cardWrapper.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        targetX = -(y / (rect.height / 2)) * 10;
        targetY = (x / (rect.width / 2)) * 10;
      });

      cardWrapper.addEventListener('pointerleave', () => {
        isHovering = false;
        targetX = 0;
        targetY = 0;
      });

      function render3D() {
        currentX += (targetX - currentX) * 0.12;
        currentY += (targetY - currentY) * 0.12;
        const z = isHovering ? 10 : 0;
        cardInner.style.transform = `rotateX(${currentX.toFixed(2)}deg) rotateY(${currentY.toFixed(2)}deg) translateZ(${z}px)`;
        requestAnimationFrame(render3D);
      }
      requestAnimationFrame(render3D);
    })();

    // Toggle Password Visibility
    (function initPasswordToggle() {
      const toggleBtn = document.getElementById('toggle-password');
      const passInput = document.getElementById('password');
      const eyeOpen = document.getElementById('eye-open-icon');
      const eyeClosed = document.getElementById('eye-closed-icon');
      if (!toggleBtn || !passInput) return;

      toggleBtn.addEventListener('click', () => {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        if (eyeOpen && eyeClosed) {
          eyeOpen.classList.toggle('hidden', isPass);
          eyeClosed.classList.toggle('hidden', !isPass);
        }
      });
    })();

    // Sign-in Form Submit Handler with Loading State
    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const error = document.getElementById('error');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const submitBtn = document.getElementById('submit-btn');

      error.textContent = '';
      if (btnText && btnSpinner) {
        btnText.classList.add('hidden');
        btnSpinner.classList.remove('hidden');
      }
      if (submitBtn) submitBtn.disabled = true;

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        if (response.ok) {
          location.replace('/admin/index.html');
        } else {
          const data = await response.json().catch(() => ({}));
          error.textContent = data.error || 'Sign-in failed. Please verify credentials.';
          if (btnText && btnSpinner) {
            btnText.classList.remove('hidden');
            btnSpinner.classList.add('hidden');
          }
          if (submitBtn) submitBtn.disabled = false;
        }
      } catch (err) {
        error.textContent = 'Unable to reach server, please try again';
        if (btnText && btnSpinner) {
          btnText.classList.remove('hidden');
          btnSpinner.classList.add('hidden');
        }
        if (submitBtn) submitBtn.disabled = false;
      }
    });
  </script>
