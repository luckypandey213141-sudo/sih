<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AegisPath — Security Console Sign In</title>
  <link rel="icon" type="image/svg+xml" href="/assets/aegispath-icon.svg">
  <link rel="apple-touch-icon" href="/assets/aegispath-icon-192.png">

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-[#0b0f19] text-slate-100 flex items-center justify-center p-6 relative overflow-hidden font-sans select-none">
  <!-- Interactive Kinetic Grid Background Canvas -->
  <canvas id="kinetic-grid-canvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none"></canvas>

  <!-- Login Card Container -->
  <main class="relative z-10 w-full max-w-md rounded-3xl border border-slate-800/80 bg-slate-900/85 backdrop-blur-2xl p-8 shadow-2xl shadow-black/80 transition-all duration-300 hover:border-indigo-500/40">
    <div class="mb-8 flex items-center gap-3.5">
      <img src="/assets/aegispath-icon.svg" alt="AegisPath Logo" class="h-12 w-12 rounded-2xl shadow-lg shadow-indigo-600/30">
      <div>
        <h1 class="text-xl font-black tracking-tight text-white">AegisPath</h1>
        <p class="text-xs text-indigo-400 font-bold uppercase tracking-wider">Security Operations Command Access</p>
      </div>
    </div>
    <h2 class="text-2xl font-black text-white">Admin verification required</h2>
    <p class="mt-2 text-sm text-slate-400">Enter the authorized username and passcode to open the Security Console.</p>
    
    <form id="login-form" class="mt-7 space-y-5">
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-400">
        Username
        <input id="username" autocomplete="username" required autofocus class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950/90 px-4 py-3 text-base text-white outline-none focus:border-indigo-500 transition-colors shadow-inner">
      </label>
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-400">
        Passcode
        <input id="password" type="password" autocomplete="current-password" required class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950/90 px-4 py-3 text-base text-white outline-none focus:border-indigo-500 transition-colors shadow-inner">
      </label>
      <p id="error" role="alert" class="min-h-5 text-sm font-semibold text-red-400"></p>
      <button class="w-full rounded-xl bg-indigo-600 px-4 py-3.5 font-black text-white hover:bg-indigo-500 shadow-xl shadow-indigo-600/30 transition-all active:scale-[0.98]" type="submit">Unlock Security Console</button>
    </form>
    
    <a href="/mobile.html" class="mt-6 block text-center text-sm text-slate-400 hover:text-white transition-colors">← Return to User Application</a>
  </main>

  <script>
    // Kinetic Grid Interactive Canvas Animation
    (function initKineticGrid() {
      const canvas = document.getElementById('kinetic-grid-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const CELL_SIZE = 55;
      const INFLUENCE_RADIUS = 260;
      const MAX_WARP = 24;
      const DOT_SPACING = 28;
      const LERP_SPEED = 0.26; // Low latency snappier tracking
      const LINE_BASE = { r: 255, g: 255, b: 255, a: 0.13 };
      const NODE_BASE_RADIUS = 1.8;
      const NODE_ACTIVE_RADIUS = 3.2;

      const theme = {
        bg: '#0b0f19',
        lineActive: { r: 99, g: 102, b: 241, a: 0.9 },
        nodeActive: { r: 129, g: 140, b: 248, a: 1.0 },
        glow: '99,102,241',
        ripple: '129,140,248'
      };

      let W = 0, H = 0;
      let mouse = { x: -9999, y: -9999 };
      let targetMouse = { x: -9999, y: -9999 };
      let ripples = [];

      function lerpN(a, b, t) { return a + (b - a) * t; }
      function lerpColor(base, active, t) {
        const r = Math.round(lerpN(base.r, active.r, t));
        const g = Math.round(lerpN(base.g, active.g, t));
        const b = Math.round(lerpN(base.b, active.b, t));
        const a = lerpN(base.a, active.a, t);
        return `rgba(${r},${g},${b},${a.toFixed(3)})`;
      }

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
      }
      resize();
      window.addEventListener('resize', resize);

      window.addEventListener('pointermove', e => {
        targetMouse.x = e.clientX;
        targetMouse.y = e.clientY;
      }, { passive: true });

      window.addEventListener('pointerdown', e => {
        ripples.push({
          x: e.clientX,
          y: e.clientY,
          radius: 0,
          opacity: 1,
          born: performance.now()
        });
      }, { passive: true });

      function getWarpedPoint(gx, gy, col, row, cols, rows) {
        const edgeMargin = 1.5;
        const colPin = Math.min(col / edgeMargin, (cols - 1 - col) / edgeMargin, 1);
        const rowPin = Math.min(row / edgeMargin, (rows - 1 - row) / edgeMargin, 1);
        const pinFactor = colPin * colPin * rowPin * rowPin;

        const dx = gx - mouse.x;
        const dy = gy - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const proximity = Math.max(0, 1 - dist / INFLUENCE_RADIUS) * pinFactor;

        let rx = 0, ry = 0;
        for (const r of ripples) {
          const rdx = gx - r.x;
          const rdy = gy - r.y;
          const rdist = Math.sqrt(rdx * rdx + rdy * rdy);
          const waveWidth = 55;
          const diff = rdist - r.radius;
          if (Math.abs(diff) < waveWidth) {
            const strength = (1 - Math.abs(diff) / waveWidth) * r.opacity * 18 * pinFactor;
            const angle = Math.atan2(rdy, rdx);
            const sign = diff < 0 ? -1 : 1;
            rx += Math.cos(angle) * strength * sign * -1;
            ry += Math.sin(angle) * strength * sign * -1;
          }
        }

        if (dist < INFLUENCE_RADIUS && dist > 0 && pinFactor > 0) {
          const t = dist / INFLUENCE_RADIUS;
          const eased = t < 0.01 ? 0 : (1 - t) * (1 - t) * Math.min(1, dist / 60);
          const warpAmt = eased * MAX_WARP * pinFactor;
          const angle = Math.atan2(dy, dx);
          return {
            pt: { x: gx - Math.cos(angle) * warpAmt + rx, y: gy - Math.sin(angle) * warpAmt + ry },
            proximity
          };
        }
        return { pt: { x: gx + rx, y: gy + ry }, proximity };
      }

      function draw(now) {
        mouse.x = lerpN(mouse.x, targetMouse.x, LERP_SPEED);
        mouse.y = lerpN(mouse.y, targetMouse.y, LERP_SPEED);

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = theme.bg;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        for (let x = DOT_SPACING / 2; x < W; x += DOT_SPACING) {
          for (let y = DOT_SPACING / 2; y < H; y += DOT_SPACING) {
            ctx.beginPath();
            ctx.arc(x, y, 0.7, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        for (let i = ripples.length - 1; i >= 0; i--) {
          const r = ripples[i];
          const age = (now - r.born) / 1000;
          r.radius = Math.max(0, age * 560);
          r.opacity = Math.max(0, 1 - age * 1.5);
          if (r.opacity <= 0) ripples.splice(i, 1);
        }

        const cols = Math.max(2, Math.ceil(W / CELL_SIZE)) + 1;
        const rows = Math.max(2, Math.ceil(H / CELL_SIZE)) + 1;
        const cellW = W / (cols - 1);
        const cellH = H / (rows - 1);

        const pts = [];
        const prox = [];
        for (let row = 0; row < rows; row++) {
          pts[row] = [];
          prox[row] = [];
          for (let col = 0; col < cols; col++) {
            const { pt, proximity } = getWarpedPoint(col * cellW, row * cellH, col, row, cols, rows);
            pts[row][col] = pt;
            prox[row][col] = proximity;
          }
        }

        const drawSeg = (p1, p2, pr1, pr2) => {
          const avg = (pr1 + pr2) / 2;
          const t = avg * avg * (3 - 2 * avg);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = lerpColor(LINE_BASE, theme.lineActive, t);
          ctx.lineWidth = lerpN(0.8, 1.5, t);
          ctx.stroke();
        };

        ctx.lineCap = 'butt';
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols - 1; col++) {
            drawSeg(pts[row][col], pts[row][col + 1], prox[row][col], prox[row][col + 1]);
          }
        }
        for (let col = 0; col < cols; col++) {
          for (let row = 0; row < rows - 1; row++) {
            drawSeg(pts[row][col], pts[row + 1][col], prox[row][col], prox[row + 1][col]);
          }
        }

        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const p = pts[row][col];
            const pr = prox[row][col];
            const t = pr * pr * (3 - 2 * pr);
            const r = lerpN(NODE_BASE_RADIUS, NODE_ACTIVE_RADIUS, t);

            if (t > 0.3) {
              const glowR = r + lerpN(0, 6, (t - 0.3) / 0.7);
              const grd = ctx.createRadialGradient(p.x, p.y, r * 0.5, p.x, p.y, glowR);
              grd.addColorStop(0, `rgba(${theme.glow},${(t * 0.3).toFixed(3)})`);
              grd.addColorStop(1, `rgba(${theme.glow},0)`);
              ctx.beginPath();
              ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
              ctx.fillStyle = grd;
              ctx.fill();
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fillStyle = lerpColor({ r: 255, g: 255, b: 255, a: 0.2 }, theme.nodeActive, t);
            ctx.fill();
          }
        }

        for (const r of ripples) {
          const safeRadius = Math.max(0, r.radius);
          ctx.beginPath();
          ctx.arc(r.x, r.y, safeRadius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(${theme.ripple},${(r.opacity * 0.28).toFixed(3)})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();

    // Sign-in Form Submit Handler
    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        if (response.ok) {
          location.replace('/admin/index.html');
        } else {
          const data = await response.json().catch(() => ({}));
          error.textContent = data.error || 'Sign-in failed';
        }
      } catch (err) {
        error.textContent = 'Unable to reach server, please try again';
      }
    });
  </script>
</body>
</html>
