  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ─── KineticGrid Interactive Background Component ─────────────────────────────
    function KineticGrid({ children, className = "", globalColor = "default" }) {
      const canvasRef = useRef(null);
      const mouseRef = useRef({ x: -9999, y: -9999 });
      const targetMouseRef = useRef({ x: -9999, y: -9999 });
      const ripplesRef = useRef([]);
      const rafRef = useRef(0);
      const sizeRef = useRef({ w: 0, h: 0 });

      const CELL_SIZE = 55;
      const INFLUENCE_RADIUS = 260;
      const MAX_WARP = 24;
      const DOT_SPACING = 28;
      const LERP_SPEED = 0.26; // Low latency snappier tracking
      const LINE_BASE = { r: 255, g: 255, b: 255, a: 0.13 };
      const NODE_BASE_RADIUS = 1.8;
      const NODE_ACTIVE_RADIUS = 3.2;

      function lerpN(a, b, t) {
        return a + (b - a) * t;
      }

      function lerpColor(base, active, t) {
        const r = Math.round(lerpN(base.r, active.r, t));
        const g = Math.round(lerpN(base.g, active.g, t));
        const b = Math.round(lerpN(base.b, active.b, t));
        const a = lerpN(base.a, active.a, t);
        return `rgba(${r},${g},${b},${a.toFixed(3)})`;
      }

      const getWarpedPoint = useCallback((gx, gy, col, row, mouse, ripples, cols, rows) => {
        const edgeMargin = 1.5;
        const colPin = Math.min(col / edgeMargin, (cols - 1 - col) / edgeMargin, 1);
        const rowPin = Math.min(row / edgeMargin, (rows - 1 - row) / edgeMargin, 1);
        const pinFactor = colPin * colPin * rowPin * rowPin;

        const dx = gx - mouse.x;
        const dy = gy - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const proximity = Math.max(0, 1 - dist / INFLUENCE_RADIUS) * pinFactor;

        let rx = 0, ry = 0;
        for (const r of ripples) {
          const rdx = gx - r.x;
          const rdy = gy - r.y;
          const rdist = Math.sqrt(rdx * rdx + rdy * rdy);
          const waveWidth = 55;
          const diff = rdist - r.radius;
          if (Math.abs(diff) < waveWidth) {
            const strength = (1 - Math.abs(diff) / waveWidth) * r.opacity * 18 * pinFactor;
            const angle = Math.atan2(rdy, rdx);
            const sign = diff < 0 ? -1 : 1;
            rx += Math.cos(angle) * strength * sign * -1;
            ry += Math.sin(angle) * strength * sign * -1;
          }
        }

        if (dist < INFLUENCE_RADIUS && dist > 0 && pinFactor > 0) {
          const t = dist / INFLUENCE_RADIUS;
          const eased = t < 0.01 ? 0 : (1 - t) * (1 - t) * Math.min(1, dist / 60);
          const warpAmt = eased * MAX_WARP * pinFactor;
          const angle = Math.atan2(dy, dx);
          return {
            pt: { x: gx - Math.cos(angle) * warpAmt + rx, y: gy - Math.sin(angle) * warpAmt + ry },
            proximity
          };
        }

        return { pt: { x: gx + rx, y: gy + ry }, proximity };
      }, []);

      const draw = useCallback((now) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        const { w: W, h: H } = sizeRef.current;
        const mouse = mouseRef.current;
        const ripples = ripplesRef.current;

        const themeConfig = {
          default: {
            bg: "#12181a",
            lineBase: { r: 85, g: 123, b: 131, a: 0.22 }, // #557B83 Turtle Slate
            lineActive: { r: 57, g: 174, b: 169, a: 0.95 }, // #39AEA9 Turtle Teal
            nodeBase: { r: 162, g: 213, b: 171, a: 0.35 }, // #A2D5AB Turtle Mint
            nodeActive: { r: 229, g: 239, b: 193, a: 1.0 }, // #E5EFC1 Turtle Cream
            glow: "57,174,169",
            ripple: "162,213,171",
            dots: "rgba(162,213,171,0.06)"
          },
          dark: {
            bg: "#12181a",
            lineBase: { r: 85, g: 123, b: 131, a: 0.22 },
            lineActive: { r: 57, g: 174, b: 169, a: 0.95 },
            nodeBase: { r: 162, g: 213, b: 171, a: 0.35 },
            nodeActive: { r: 229, g: 239, b: 193, a: 1.0 },
            glow: "57,174,169",
            ripple: "162,213,171",
            dots: "rgba(162,213,171,0.06)"
          },
          light: {
            bg: "#f6f9f5",
            lineBase: { r: 85, g: 123, b: 131, a: 0.25 },
            lineActive: { r: 32, g: 109, b: 105, a: 0.95 }, // #206D69 (Deep Teal for strong contrast)
            nodeBase: { r: 85, g: 123, b: 131, a: 0.35 },
            nodeActive: { r: 32, g: 109, b: 105, a: 1.0 },
            glow: "32,109,105",
            ripple: "57,174,169",
            dots: "rgba(32,109,105,0.08)"
          },
          monochrome: {
            bg: "#000000",
            lineBase: LINE_BASE,
            lineActive: { r: 255, g: 255, b: 255, a: 0.9 },
            nodeBase: { r: 255, g: 255, b: 255, a: 0.2 },
            nodeActive: { r: 255, g: 255, b: 255, a: 1.0 },
            glow: "255,255,255",
            ripple: "255,255,255",
            dots: "rgba(255,255,255,0.06)"
          }
        }[globalColor || "default"] || {
          bg: "#12181a",
          lineBase: { r: 85, g: 123, b: 131, a: 0.22 },
          lineActive: { r: 57, g: 174, b: 169, a: 0.95 },
          nodeBase: { r: 162, g: 213, b: 171, a: 0.35 },
          nodeActive: { r: 229, g: 239, b: 193, a: 1.0 },
          glow: "57,174,169",
          ripple: "162,213,171",
          dots: "rgba(162,213,171,0.06)"
        };

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = themeConfig.bg;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = themeConfig.dots;
        for (let x = DOT_SPACING / 2; x < W; x += DOT_SPACING) {
          for (let y = DOT_SPACING / 2; y < H; y += DOT_SPACING) {
            ctx.beginPath();
            ctx.arc(x, y, 0.7, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        for (let i = ripples.length - 1; i >= 0; i--) {
          const r = ripples[i];
          const age = (now - r.born) / 1000;
          r.radius = Math.max(0, age * 560);
          r.opacity = Math.max(0, 1 - age * 1.5);
          if (r.opacity <= 0) ripples.splice(i, 1);
        }

        const cols = Math.max(2, Math.ceil(W / CELL_SIZE)) + 1;
        const rows = Math.max(2, Math.ceil(H / CELL_SIZE)) + 1;
        const cellW = W / (cols - 1);
        const cellH = H / (rows - 1);

        const pts = [];
        const prox = [];

        for (let row = 0; row < rows; row++) {
          pts[row] = [];
          prox[row] = [];
          for (let col = 0; col < cols; col++) {
            const { pt, proximity } = getWarpedPoint(col * cellW, row * cellH, col, row, mouse, ripples, cols, rows);
            pts[row][col] = pt;
            prox[row][col] = proximity;
          }
        }

        const drawSeg = (p1, p2, pr1, pr2) => {
          const avg = (pr1 + pr2) / 2;
          const t = avg * avg * (3 - 2 * avg);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = lerpColor(themeConfig.lineBase, themeConfig.lineActive, t);
          ctx.lineWidth = lerpN(0.8, 1.5, t);
          ctx.stroke();
        };

        ctx.lineCap = "butt";

        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols - 1; col++) {
            drawSeg(pts[row][col], pts[row][col + 1], prox[row][col], prox[row][col + 1]);
          }
        }

        for (let col = 0; col < cols; col++) {
          for (let row = 0; row < rows - 1; row++) {
            drawSeg(pts[row][col], pts[row + 1][col], prox[row][col], prox[row + 1][col]);
          }
        }

        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const p = pts[row][col];
            const pr = prox[row][col];
            const t = pr * pr * (3 - 2 * pr);
            const r = lerpN(NODE_BASE_RADIUS, NODE_ACTIVE_RADIUS, t);

            if (t > 0.3) {
              const glowR = r + lerpN(0, 6, (t - 0.3) / 0.7);
              const grd = ctx.createRadialGradient(p.x, p.y, r * 0.5, p.x, p.y, glowR);
              grd.addColorStop(0, `rgba(${themeConfig.glow},${(t * 0.3).toFixed(3)})`);
              grd.addColorStop(1, `rgba(${themeConfig.glow},0)`);
              ctx.beginPath();
              ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
              ctx.fillStyle = grd;
              ctx.fill();
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fillStyle = lerpColor(themeConfig.nodeBase, themeConfig.nodeActive, t);
            ctx.fill();
          }
        }

        for (const r of ripples) {
          const safeRadius = Math.max(0, r.radius);
          ctx.beginPath();
          ctx.arc(r.x, r.y, safeRadius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(${themeConfig.ripple},${(r.opacity * 0.28).toFixed(3)})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }, [getWarpedPoint, globalColor]);

      const animate = useCallback((now) => {
        const m = mouseRef.current;
        const t = targetMouseRef.current;

        m.x = lerpN(m.x, t.x, LERP_SPEED);
        m.y = lerpN(m.y, t.y, LERP_SPEED);

        draw(now);
        rafRef.current = requestAnimationFrame(animate);
      }, [draw]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const setSize = () => {
          const w = window.innerWidth;
          const h = window.innerHeight;
          canvas.width = w;
          canvas.height = h;
          sizeRef.current = { w, h };
          if (mouseRef.current.x === -9999) {
            mouseRef.current = { x: -9999, y: -9999 };
            targetMouseRef.current = { x: -9999, y: -9999 };
          }
        };

        setSize();
        window.addEventListener("resize", setSize);

        const onPointerMove = (e) => {
          targetMouseRef.current = { x: e.clientX, y: e.clientY };
        };

        const onPointerDown = (e) => {
          ripplesRef.current.push({
            x: e.clientX,
            y: e.clientY,
            radius: 0,
            opacity: 1,
            born: performance.now()
          });
        };

        window.addEventListener("pointermove", onPointerMove, { passive: true });
        window.addEventListener("pointerdown", onPointerDown, { passive: true });
        rafRef.current = requestAnimationFrame(animate);

        return () => {
          window.removeEventListener("resize", setSize);
          window.removeEventListener("pointermove", onPointerMove);
          window.removeEventListener("pointerdown", onPointerDown);
          if (rafRef.current) {
            cancelAnimationFrame(rafRef.current);
          }
        };
      }, [animate]);

      const bgClass = globalColor === "monochrome" ? "bg-[#000000]" : (globalColor === "light" ? "bg-[#f6f9f5]" : "bg-[#12181a]");
      return (
        <div className={`relative w-full h-full overflow-hidden flex flex-col ${bgClass} ${className}`}>
          <canvas ref={canvasRef} className="fixed inset-0 w-full h-full z-0 pointer-events-none" />
          <div className="relative z-10 w-full h-full flex flex-col min-h-0 overflow-hidden">{children}</div>
        </div>
      );
    }

    function AdminApp() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);

      const [activeTab, setActiveTab] = useState("overview");
      const [bData, setBData] = useState(() => window.INITIAL_BUILDING_DATA || null);
      const [selectedAdminMapId, setSelectedAdminMapId] = useState("campus");
      const [showSosArchive, setShowSosArchive] = useState(false);
      const [isMapModalOpen, setIsMapModalOpen] = useState(false);
      const [mapZoomScale, setMapZoomScale] = useState(1);
      const [theme, setTheme] = useState(() => localStorage.getItem('aegispath_admin_theme') || 'dark');

      const toggleTheme = () => {
        const themes = ['dark', 'monochrome', 'light'];
        const nextTheme = themes[(themes.indexOf(theme) + 1) % themes.length];
        setTheme(nextTheme);
        localStorage.setItem('aegispath_admin_theme', nextTheme);
      };

      // Close map modal on Escape key
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            setIsMapModalOpen(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Route Guard: verify signed admin session cookie
      useEffect(() => {
        let mounted = true;
        async function verifySession() {
          try {
            const res = await fetch('/api/admin/verify');
            if (res.ok) {
              const data = await res.json();
              if (data.authenticated && mounted) {
                setIsAuthenticated(true);
                setIsAuthChecking(false);
                return;
              }
            }
          } catch (e) {}
          if (mounted) {
            window.location.replace('/admin/login.html');
          }
        }
        verifySession();
        return () => { mounted = false; };
      }, []);

      useEffect(() => {
        let unsub = null;
        const checkReady = () => {
          if (window.INITIAL_BUILDING_DATA) {
            setBData(window.INITIAL_BUILDING_DATA);
          }
          if (window.SafeWayAPI?.subscribeToRealtimeData && !unsub) {
            unsub = window.SafeWayAPI.subscribeToRealtimeData(state => setLiveState(state));
          }
        };

        checkReady();
        const interval = setInterval(checkReady, 50);
        return () => {
          clearInterval(interval);
          if (unsub) unsub();
        };
      }, []);

      if (isAuthChecking || !isAuthenticated) {
        return (
          <KineticGrid globalColor={theme} className="w-full h-full flex flex-col items-center justify-center gap-3 text-indigo-400 font-bold">
            <div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <span>Verifying Security Console Authorization...</span>

      const selectedBlockIndex = Math.max(0, ["ramanujan", "kalpana", "raman", "aryabhatta", "bhabha"].findIndex(key => selectedAdminMapId.startsWith(key)));

                      <thead className="bg-slate-950 text-slate-400 font-mono text-[10px] uppercase border-b border-slate-800">
                        <tr>
                          <th className="p-3">Node ID</th>
                          <th className="p-3">Block / Floor / Location</th>
                          <th className="p-3">Smoke (MQ-2)</th>
                          <th className="p-3">Flame Sensor</th>
                          <th className="p-3">Occupancy</th>
                          <th className="p-3">Crowd</th>
                          <th className="p-3">Hazard Level</th>
                          <th className="p-3">Last Sync</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {campusSensorNodes.map(s => (
                          <tr key={s.sensorId} className="hover:bg-slate-800/40">
                            <td className="p-3 font-mono font-bold text-indigo-300">{s.sensorId}</td>
                            <td className="p-3 font-bold text-white">
                              <div>{s.location} {s.isDoorSensor && <span className="text-[9px] text-emerald-300">· IR DOORWAY</span>}</div>
                              <div className="text-[10px] text-slate-500 font-medium">{s.block} · {s.floor}</div>
                            </td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded font-bold ${s.smokeDetected ? "bg-red-600 text-white" : "bg-slate-800 text-slate-400"}`}>
                                {s.smokeDetected ? "SMOKE DETECTED" : "Normal"}
                              </span>
                            </td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded font-bold ${s.flameDetected ? "bg-red-600 text-white" : "bg-slate-800 text-slate-400"}`}>
                                {s.flameDetected ? "FLAME ACTIVE" : "None"}
                              </span>
                            </td>
                            <td className="p-3 font-mono font-bold text-slate-200">{s.occupancy} people</td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded font-bold ${s.crowdLevel === 'High' ? "bg-amber-600 text-white" : s.crowdLevel === 'Medium' ? "bg-indigo-600 text-white" : "bg-slate-800 text-slate-400"}`}>
                                {s.crowdLevel}
                              </span>
                            </td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded font-black uppercase ${s.hazardLevel === 'high' ? "bg-red-600 text-white" : "bg-emerald-600/20 text-emerald-400"}`}>
                                {s.hazardLevel}
                              </span>
                            </td>
                            <td className="p-3 font-mono text-[10px] text-slate-400">{new Date(s.lastUpdate).toLocaleTimeString()}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {/* Hardware injection simulator for judges */}
                  <div className="pt-4 border-t border-slate-800 space-y-2">
                    <div className="text-xs font-bold text-slate-300">ESP32 Hardware Simulation Triggers — {selectedAdminMap.group}, {selectedAdminMap.label}:</div>
                    <div className="flex flex-wrap gap-2">
                      <button
                        disabled={!selectedSensorNodes[0]}
                        onClick={() => selectedSensorNodes[0] && window.SafeWayAPI.recordSensorReading(selectedSensorNodes[0].sensorId, { location: selectedSensorNodes[0].location, zone: selectedAdminMapId, smokeDetected: true, flameDetected: true, hazardLevel: "high", occupancy: 12, crowdLevel: "Medium" })}
                        className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-bold rounded-2xl transition"
                      >
                        🔥 Trigger Smoke & Flame — {selectedSensorNodes[0]?.location || "No mapped sensor"}
                      </button>
                      <button
                        disabled={!selectedSensorNodes[1]}
                        onClick={() => selectedSensorNodes[1] && window.SafeWayAPI.recordSensorReading(selectedSensorNodes[1].sensorId, { location: selectedSensorNodes[1].location, zone: selectedAdminMapId, occupancy: 24, crowdLevel: "High" })}
                        className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-2xl transition"
                      >
                        👥 Trigger High Crowd — {selectedSensorNodes[1]?.location || "No mapped sensor"}
                      </button>
                      <button
                        disabled={!selectedSensorNodes[0]}
                        onClick={() => selectedSensorNodes[0] && window.SafeWayAPI.recordSensorReading(selectedSensorNodes[0].sensorId, { location: selectedSensorNodes[0].location, zone: selectedAdminMapId, smokeDetected: false, flameDetected: false, hazardLevel: "none", occupancy: 4, crowdLevel: "Low" })}
                        className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-2xl transition"
                      >
                        ✅ Reset Selected Demo Sensor
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: SIH DEMO SCRIPT */}
            {activeTab === "sih" && (
              <div className="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-6">
                <div>
                  <h3 className="text-lg font-black text-white">Smart India Hackathon (SIH) 6-Stage Demo Flow</h3>
                  <p className="text-xs text-slate-400">Step through the 6 stages of the presentation live in front of the evaluation panel.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {[
                    {
                      step: "Stage 1",
                      title: "Normal Navigation",
                      desc: "User scans QR SW-ROOM204 and requests shortest path to Main Entrance.",
                      action: () => {
                        window.SafeWayAPI.resetAllToNormal();
                      }
                    },
                    {
                      step: "Stage 2",
                      title: "Emergency Trigger",
                      desc: "Admin activates emergency. User app immediately transitions to evacuation mode.",
                      action: () => {
                        window.SafeWayAPI.setEmergencyActive(true);
                      }
                    },
                    {
                      step: "Stage 3",
                      title: "ESP32 Smoke Trigger",
                      desc: "ESP32 detects smoke in Zone B. SafeWay dynamically removes Zone B paths & Exit 1.",
                      action: () => {
                        window.SafeWayAPI.setZoneHazardLevel("zone-b", "high");
                        window.SafeWayAPI.setEmergencyActive(true);
                      }
                    },
                    {
                      step: "Stage 4",
                      title: "Crowd Surge at Exit 2",
                      desc: "Exit 2 crowd level surges to HIGH (+60 penalty).",
                      action: () => {
                        window.SafeWayAPI.setExitCrowdLevel("exit-2", "High");
                      }
                    },
                    {
                      step: "Stage 5",
                      title: "Optimal Safe Route to Exit 3",
                      desc: "SafeWay rejects Exit 1 (fire) and Exit 2 (high crowd), routing to Exit 3 & Assembly B.",
                      action: () => {
                        window.SafeWayAPI.setExitCrowdLevel("exit-3", "Low");
                      }
                    },
                    {
                      step: "Stage 6",
                      title: "Evacuation Complete",
                      desc: "Clear emergency state and return to normal standby operations.",
                      action: () => {
                        window.SafeWayAPI.resetAllToNormal();
                      }
                    }
                  ].map((s, idx) => (
                    <div key={idx} className="bg-slate-950 border border-slate-800 rounded-2xl p-5 space-y-3 flex flex-col justify-between">
                      <div>
                        <span className="text-[10px] uppercase font-mono px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 font-bold">
                          {s.step}
                        </span>
                        <h4 className="text-sm font-black text-white mt-1">{s.title}</h4>
                        <p className="text-xs text-slate-400 mt-1">{s.desc}</p>
                      </div>
                      <button
                        onClick={s.action}
                        className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-2"
                      >
                        <Icon name="play" className="w-3.5 h-3.5" />
                        Execute {s.step}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}
            </div>
          </main>

          {/* Fullscreen Interactive Map Pop-up / Zoom Modal */}
          {isMapModalOpen && (
            <div 
              className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-slate-950/85 backdrop-blur-md"
              onClick={(e) => { if (e.target === e.currentTarget) setIsMapModalOpen(false); }}
            >
              <div className="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-5xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                {/* Modal Header */}
                <div className="flex flex-wrap items-center justify-between gap-3 p-4 sm:p-5 border-b border-slate-800 bg-slate-950/80">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                      <Icon name="maximize-2" className="w-5 h-5" />
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <h3 className="text-base font-black text-white">{selectedAdminMap.group} — {selectedAdminMap.label}</h3>
                        <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                          HIGH-RES BLUEPRINT
                        </span>
                      </div>
                      <p className="text-xs text-slate-400">Interactive Floor Plan & Emergency Zone Inspector</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 sm:gap-3">
                    {/* Floor Map Switcher */}
                    <select
                      value={selectedAdminMapId}
                      onChange={e => setSelectedAdminMapId(e.target.value)}
                      className="bg-slate-950 border border-slate-700 text-white text-xs font-bold rounded-xl px-3 py-2 outline-none focus:border-indigo-500"
                    >
                      {[...new Set(ADMIN_MAPS.map(map => map.group))].map(group => (
                        <optgroup key={group} label={group}>
                          {ADMIN_MAPS.filter(map => map.group === group).map(map => (
                            <option key={map.id} value={map.id}>{map.label}</option>
                          ))}
                        </optgroup>
                      ))}
                    </select>

                    {/* Zoom Controls */}
                    <div className="flex items-center bg-slate-950 border border-slate-800 rounded-xl p-0.5">
                      <button
                        onClick={() => setMapZoomScale(prev => Math.max(0.5, +(prev - 0.25).toFixed(2)))}
                        className="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition"
                        title="Zoom Out"
                      >
                        <Icon name="zoom-out" className="w-4 h-4" />
                      </button>
                      <span className="px-2.5 text-xs font-mono font-bold text-indigo-400 min-w-[50px] text-center">
                        {Math.round(mapZoomScale * 100)}%
                      </span>
                      <button
                        onClick={() => setMapZoomScale(prev => Math.min(3, +(prev + 0.25).toFixed(2)))}
                        className="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition"
                        title="Zoom In"
                      >
                        <Icon name="zoom-in" className="w-4 h-4" />
                      </button>
                      <button
                        onClick={() => setMapZoomScale(1)}
                        className="px-2.5 py-1 text-[11px] font-bold text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition border-l border-slate-800 ml-0.5"
                        title="Reset to 100%"
                      >
                        100%
                      </button>
                    </div>

                    {/* Close Button */}
                    <button
                      onClick={() => setIsMapModalOpen(false)}
                      className="p-2 bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white rounded-xl border border-slate-700 hover:border-red-500 transition shadow"
                      title="Close Pop-up (ESC)"
                    >
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </div>
                </div>

                {/* Modal Image Viewport */}
                <div className="flex-1 p-6 bg-slate-950 overflow-auto flex items-center justify-center relative select-none min-h-[400px]">
                  {selectedAdminMap.src ? (
                    <div
                      className="transition-transform duration-150 ease-out origin-center flex items-center justify-center max-w-full max-h-full"
                      style={{ transform: `scale(${mapZoomScale})` }}
                    >
                      <img
                        src={selectedAdminMap.src}
                        alt={`${selectedAdminMap.group} ${selectedAdminMap.label} full plan`}
                        className="max-h-[65vh] w-auto object-contain rounded-xl shadow-2xl border border-slate-800"
                      />
                    </div>
                  ) : (
                    <div className="text-center p-12 text-slate-500 space-y-2">
                      <Icon name="split" className="w-12 h-12 mx-auto text-slate-700" />
                      <p className="text-sm font-bold">Floor plan preview image not available for this map scope.</p>
                      <p className="text-xs text-slate-600">Hardware sensor nodes & controls remain fully functional.</p>
                    </div>
                  )}
                </div>

                {/* Modal Footer Info */}
                <div className="px-5 py-3 border-t border-slate-800 bg-slate-950/90 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400 font-medium">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span className="text-slate-300 font-bold">{selectedAdminMap.group} — {selectedAdminMap.label}</span>
                    <span>&bull;</span>
                    <span>{selectedFacilities.length} Monitored Facilities</span>
                    <span>&bull;</span>
                    <span>{selectedDoors.length} Monitored Exits</span>
                  </div>
                  <div className="text-[11px] text-slate-500 font-mono">
                    Press <kbd className="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-300">ESC</kbd> to exit full view
                  </div>
                </div>
              </div>
            </div>
          )}
        </KineticGrid>
      );
    }

    

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<AdminApp />);
  </script>
</body>
</html>
