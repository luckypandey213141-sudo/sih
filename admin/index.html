    function AdminApp() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [isAuthChecking, setIsAuthChecking] = useState(true);
      const [liveState, setLiveState] = useState(null);
      const [activeTab, setActiveTab] = useState("overview");
      const [bData, setBData] = useState(() => window.INITIAL_BUILDING_DATA || null);
      const [selectedAdminMapId, setSelectedAdminMapId] = useState("campus");
      const [showSosArchive, setShowSosArchive] = useState(false);

      // Route Guard: verify signed admin session cookie
      useEffect(() => {
        let mounted = true;
        async function verifySession() {
          try {
            const res = await fetch('/api/admin/verify');
            if (res.ok) {
              const data = await res.json();
              if (data.authenticated && mounted) {
                setIsAuthenticated(true);
                setIsAuthChecking(false);
                return;
              }
            }
          } catch (e) {}
          if (mounted) {
            window.location.replace('/admin/login.html');
          }
        }
        verifySession();
        return () => { mounted = false; };
      }, []);

      useEffect(() => {
        let unsub = null;
        const checkReady = () => {
          if (window.INITIAL_BUILDING_DATA) {
            setBData(window.INITIAL_BUILDING_DATA);
          }
          if (window.SafeWayAPI?.subscribeToRealtimeData && !unsub) {
            unsub = window.SafeWayAPI.subscribeToRealtimeData(state => setLiveState(state));
          }
        };

        checkReady();
        const interval = setInterval(checkReady, 50);
        return () => {
          clearInterval(interval);
          if (unsub) unsub();
        };
      }, []);

      if (isAuthChecking || !isAuthenticated) {
        return (
          <div className="flex h-screen flex-col items-center justify-center gap-3 text-indigo-400 font-bold">
            <div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <span>Verifying Security Console Authorization...</span>
          </div>
        );
      }

      if (!liveState || !bData) {
        return (
          <div className="flex h-screen items-center justify-center text-indigo-400 font-bold">
            Loading SafeWay Security Operations Console...
          </div>
        );
      }

      const isEmergency = liveState.emergencyActive;
      const selectedAdminMap = ADMIN_MAPS.find(map => map.id === selectedAdminMapId) || ADMIN_MAPS[0];
      const selectedBlockIndex = Math.max(0, ["ramanujan", "kalpana", "raman", "aryabhatta", "bhabha"].findIndex(key => selectedAdminMapId.startsWith(key)));
      const scopedZones = selectedAdminMapId === "campus" ? bData.zones : bData.zones.filter(zone => selectedAdminMap.zoneIds.includes(zone.id));
      const scopedExits = selectedAdminMapId === "campus" ? bData.exits : bData.exits.filter((exit, index) => index === selectedBlockIndex % bData.exits.length);
      const availableEdges = bData.edges.filter(edge => !edge.id.startsWith("evac-"));
      const scopedEdges = selectedAdminMapId === "campus" ? availableEdges : availableEdges.filter((edge, index) => index % 5 === selectedBlockIndex);
      const selectedFacilities = (ADMIN_FACILITIES[selectedAdminMapId] || []).map((name, index) => ({ name, id: controlId("area", selectedAdminMapId, name), proxyZoneId: scopedZones[index % Math.max(scopedZones.length, 1)]?.id }));

                              key={lvl}
                              onClick={() => { window.SafeWayAPI.setExitCrowdLevel(door.id, lvl); if (door.proxyExitId) window.SafeWayAPI.setExitCrowdLevel(door.proxyExitId, lvl); }}
                              className={`py-2 rounded-xl text-xs font-bold transition ${crowd === lvl ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                            >
                              {lvl}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* TAB 3: CORRIDORS */}
            {activeTab === "corridors" && (
              <div className="space-y-4">
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                  {selectedCorridors.map(path => {
                    const isBlocked = liveState.blockedEdges[path.id] || false;
                    const cLevel = liveState.corridorCrowds[path.id] || "Low";

                    return (
                      <div key={path.id} className={`p-4 rounded-2xl border ${isBlocked ? "bg-red-950/40 border-red-500" : "bg-slate-900/80 border-slate-800"} space-y-3`}>
                        <div className="flex items-center justify-between">
                          <div className="text-xs font-black text-white">{path.from} ↔ {path.to}</div>
                          <button
                            onClick={() => { window.SafeWayAPI.setCorridorBlockedStatus(path.id, !isBlocked); if (path.proxyEdgeId) window.SafeWayAPI.setCorridorBlockedStatus(path.proxyEdgeId, !isBlocked); }}
                            className={`text-[10px] font-black px-2.5 py-1 rounded transition ${isBlocked ? "bg-red-600 text-white" : "bg-slate-800 text-slate-300"}`}
                          >
                            {isBlocked ? "BLOCKED" : "CLEAR"}
                          </button>
                        </div>
                        <div className="flex items-center justify-between text-[11px] text-slate-400">
                          <span>Crowd:</span>
                          <div className="flex gap-1">
                            {["Low", "Medium", "High"].map(lvl => (
                              <button
                                key={lvl}
                                onClick={() => { window.SafeWayAPI.setCorridorCrowdLevel(path.id, lvl); if (path.proxyEdgeId) window.SafeWayAPI.setCorridorCrowdLevel(path.proxyEdgeId, lvl); }}
                                className={`px-2 py-0.5 rounded text-[10px] font-bold ${cLevel === lvl ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}
                              >
                                {lvl}
                              </button>
                            ))}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 4: IOT SENSORS */}
            {activeTab === "iot" && (
              <div className="space-y-6">
                <div className="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-base font-black text-white">All-Campus ESP32 Multi-Sensor IoT Network</h3>
                      <p className="text-xs text-slate-400">{campusSensorNodes.length} simulated nodes across every mapped campus area, block, floor, lab, classroom, facility and doorway.</p>
                    </div>
                    <span className="text-[10px] font-mono font-black uppercase px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                      HTTP / RTDB Gateway Ready
                    </span>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-950 text-slate-400 font-mono text-[10px] uppercase border-b border-slate-800">
                        <tr>
                          <th className="p-3">Node ID</th>
                          <th className="p-3">Block / Floor / Location</th>
                          <th className="p-3">Smoke (MQ-2)</th>
                          <th className="p-3">Flame Sensor</th>
                          <th className="p-3">Occupancy</th>
                          <th className="p-3">Crowd</th>
                          <th className="p-3">Hazard Level</th>
                          <th className="p-3">Last Sync</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {campusSensorNodes.map(s => (
                          <tr key={s.sensorId} className="hover:bg-slate-800/40">
                            <td className="p-3 font-mono font-bold text-indigo-300">{s.sensorId}</td>
                            <td className="p-3 font-bold text-white">
                              <div>{s.location} {s.isDoorSensor && <span className="text-[9px] text-emerald-300">· IR DOORWAY</span>}</div>
                              <div className="text-[10px] text-slate-500 font-medium">{s.block} · {s.floor}</div>
                            </td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded font-bold ${s.smokeDetected ? "bg-red-600 text-white" : "bg-slate-800 text-slate-400"}`}>
                                {s.smokeDetected ? "SMOKE DETECTED" : "Normal"}
                              </span>
                            </td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded font-bold ${s.flameDetected ? "bg-red-600 text-white" : "bg-slate-800 text-slate-400"}`}>
                                {s.flameDetected ? "FLAME ACTIVE" : "None"}
                              </span>
                            </td>
                            <td className="p-3 font-mono font-bold text-slate-200">{s.occupancy} people</td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded font-bold ${s.crowdLevel === 'High' ? "bg-amber-600 text-white" : s.crowdLevel === 'Medium' ? "bg-indigo-600 text-white" : "bg-slate-800 text-slate-400"}`}>
                                {s.crowdLevel}
                              </span>
                            </td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded font-black uppercase ${s.hazardLevel === 'high' ? "bg-red-600 text-white" : "bg-emerald-600/20 text-emerald-400"}`}>
                                {s.hazardLevel}
                              </span>
                            </td>
                            <td className="p-3 font-mono text-[10px] text-slate-400">{new Date(s.lastUpdate).toLocaleTimeString()}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {/* Hardware injection simulator for judges */}
                  <div className="pt-4 border-t border-slate-800 space-y-2">
                    <div className="text-xs font-bold text-slate-300">ESP32 Hardware Simulation Triggers — {selectedAdminMap.group}, {selectedAdminMap.label}:</div>
                    <div className="flex flex-wrap gap-2">
                      <button
                        disabled={!selectedSensorNodes[0]}
                        onClick={() => selectedSensorNodes[0] && window.SafeWayAPI.recordSensorReading(selectedSensorNodes[0].sensorId, { location: selectedSensorNodes[0].location, zone: selectedAdminMapId, smokeDetected: true, flameDetected: true, hazardLevel: "high", occupancy: 12, crowdLevel: "Medium" })}
                        className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-bold rounded-2xl transition"
                      >
                        🔥 Trigger Smoke & Flame — {selectedSensorNodes[0]?.location || "No mapped sensor"}
                      </button>
                      <button
                        disabled={!selectedSensorNodes[1]}
                        onClick={() => selectedSensorNodes[1] && window.SafeWayAPI.recordSensorReading(selectedSensorNodes[1].sensorId, { location: selectedSensorNodes[1].location, zone: selectedAdminMapId, occupancy: 24, crowdLevel: "High" })}
                        className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-2xl transition"
                      >
                        👥 Trigger High Crowd — {selectedSensorNodes[1]?.location || "No mapped sensor"}
                      </button>
                      <button
                        disabled={!selectedSensorNodes[0]}
                        onClick={() => selectedSensorNodes[0] && window.SafeWayAPI.recordSensorReading(selectedSensorNodes[0].sensorId, { location: selectedSensorNodes[0].location, zone: selectedAdminMapId, smokeDetected: false, flameDetected: false, hazardLevel: "none", occupancy: 4, crowdLevel: "Low" })}
                        className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-2xl transition"
                      >
                        ✅ Reset Selected Demo Sensor
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: SIH DEMO SCRIPT */}
            {activeTab === "sih" && (
              <div className="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-6">
                <div>
                  <h3 className="text-lg font-black text-white">Smart India Hackathon (SIH) 6-Stage Demo Flow</h3>
                  <p className="text-xs text-slate-400">Step through the 6 stages of the presentation live in front of the evaluation panel.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {[
                    {
                      step: "Stage 1",
                      title: "Normal Navigation",
                      desc: "User scans QR SW-ROOM204 and requests shortest path to Main Entrance.",
                      action: () => {
                        window.SafeWayAPI.resetAllToNormal();
                      }
                    },
                    {
                      step: "Stage 2",
                      title: "Emergency Trigger",
                      desc: "Admin activates emergency. User app immediately transitions to evacuation mode.",
                      action: () => {
                        window.SafeWayAPI.setEmergencyActive(true);
                      }
                    },
                    {
                      step: "Stage 3",
                      title: "ESP32 Smoke Trigger",
                      desc: "ESP32 detects smoke in Zone B. SafeWay dynamically removes Zone B paths & Exit 1.",
                      action: () => {
                        window.SafeWayAPI.setZoneHazardLevel("zone-b", "high");
                        window.SafeWayAPI.setEmergencyActive(true);
                      }
                    },
                    {
                      step: "Stage 4",
                      title: "Crowd Surge at Exit 2",
                      desc: "Exit 2 crowd level surges to HIGH (+60 penalty).",
                      action: () => {
                        window.SafeWayAPI.setExitCrowdLevel("exit-2", "High");
                      }
                    },
                    {
                      step: "Stage 5",
                      title: "Optimal Safe Route to Exit 3",
                      desc: "SafeWay rejects Exit 1 (fire) and Exit 2 (high crowd), routing to Exit 3 & Assembly B.",
                      action: () => {
                        window.SafeWayAPI.setExitCrowdLevel("exit-3", "Low");
                      }
                    },
                    {
                      step: "Stage 6",
                      title: "Evacuation Complete",
                      desc: "Clear emergency state and return to normal standby operations.",
                      action: () => {
                        window.SafeWayAPI.resetAllToNormal();
                      }
                    }
                  ].map((s, idx) => (
                    <div key={idx} className="bg-slate-950 border border-slate-800 rounded-2xl p-5 space-y-3 flex flex-col justify-between">
                      <div>
                        <span className="text-[10px] uppercase font-mono px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 font-bold">
                          {s.step}
                        </span>
                        <h4 className="text-sm font-black text-white mt-1">{s.title}</h4>
                        <p className="text-xs text-slate-400 mt-1">{s.desc}</p>
                      </div>
                      <button
                        onClick={s.action}
                        className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-2"
                      >
                        <Icon name="play" className="w-3.5 h-3.5" />
                        Execute {s.step}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}
            </div>
          </main>
        </div>
      );
    }

    

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<AdminApp />);
  </script>
</body>
</html>
