<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SafeWay V3 Mobile — Indoor Evacuation & Motion Guidance</title>

  <!-- PWA & Mobile Phone Metadata -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- HTML5 QR Code Scanner CDN -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background: #020617;
      color: #f8fafc;
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes pulseRadar {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    .mobile-radar-pulse { animation: pulseRadar 1.8s infinite; }
    
    @keyframes dashMove {
      to { stroke-dashoffset: -32; }
    }
    .route-glow-dash {
      animation: dashMove 0.8s linear infinite;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between select-none">
  <div id="root"></div>

  <script type="module">
    import { INITIAL_BUILDING_DATA } from './data/buildingGraph.js?v=campus-layout-5';
    import { findShortestPath, findSafestEvacuationPath } from './utils/pathfinder.js?v=campus-layout-7';
    import { INDOOR_ROUTE_NETWORKS } from './data/indoorRouteNetworks.js?v=guided-shortest-1';
    import { resolveQrCode, getQrPresets } from './services/qrLocation.js';
    import {
      subscribeToRealtimeData,
      setEmergencyActive,
      resetAllToNormal,
      registerActiveRoute,
      sendDistressSignal,
      clearDistressSignal
    } from './services/realtime.js';
    import { MotionTracker, interpolatePositionOnRoute } from './utils/motionTracker.js';

    window.SafeWayData = {
      INITIAL_BUILDING_DATA,
      findShortestPath,
      findSafestEvacuationPath,
      resolveQrCode,
      getQrPresets,
      subscribeToRealtimeData,
      setEmergencyActive,
      resetAllToNormal,
      registerActiveRoute,
      sendDistressSignal,
      clearDistressSignal,
      INDOOR_ROUTE_NETWORKS,
      MotionTracker,
      interpolatePositionOnRoute
    };
    window.dispatchEvent(new CustomEvent('safeway-ready'));
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Web Audio Sound Generator
    let audioCtx = null;
    function playSiren() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {}
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 1.05;
          utterance.pitch = 1.0;
          window.speechSynthesis.speak(utterance);
        } catch (e) {}
      }
    }

    function Icon({ name, className = "w-4 h-4" }) {
      const icons = {
        navigation: <polygon points="3 11 22 2 13 21 11 13 3 11" />,
        siren: <><path d="M7 18v-6a5 5 0 1 1 10 0v6"/><path d="M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z"/><path d="M21 12h1"/><path d="M18.5 4.5 20 3"/><path d="M2 12h1"/><path d="M5.5 4.5 4 3"/><path d="M12 2v1"/></>,
        "qr-code": <><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></>,
        accessibility: <><circle cx="16" cy="4" r="1"/><path d="m18 19 1-7-6 1"/><path d="m5 8 3-3 5.5 3-2.36 3.5"/><path d="M4.24 14.5a5 5 0 0 0 6.88 6"/><path d="M13.76 17.5a5 5 0 0 0-6.88-6"/></>,
        sos: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>,
        compass: <><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></>,
        shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
        "volume-2": <><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></>,
        "volume-x": <><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></>,
        check: <polyline points="20 6 9 17 4 12" />
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {icons[name] || <circle cx="12" cy="12" r="10" />}
        </svg>
      );
    }

    function MobileApp() {
      const [bData, setBData] = useState(null);
      const [liveState, setLiveState] = useState(null);
      const [userLocationNodeId, setUserLocationNodeId] = useState("ent-main");
      const [destinationNodeId, setDestinationNodeId] = useState("lobby");
      const [accessibilityMode, setAccessibilityMode] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);

      // Pedestrian Dead Reckoning & Motion States
      const [tracker, setTracker] = useState(() => (window.SafeWayData?.MotionTracker ? new window.SafeWayData.MotionTracker() : null));
      const [stepCount, setStepCount] = useState(0);
      const [traveledDistance, setTraveledDistance] = useState(0);
      const [compassHeading, setCompassHeading] = useState(0);
      const [isMotionTracking, setIsMotionTracking] = useState(false);
      const [autoWalkActive, setAutoWalkActive] = useState(false);

      // Modal & Action States
      const [isQrModalOpen, setIsQrModalOpen] = useState(false);
      const [scannerActive, setScannerActive] = useState(false);
      const [qrInputText, setQrInputText] = useState("");
      const [quickCheckpointKey, setQuickCheckpointKey] = useState("");
      const [isSosModalOpen, setIsSosModalOpen] = useState(false);
      const [sosSent, setSosSent] = useState(false);
      const [activeStepIdx, setActiveStepIdx] = useState(0);

      // Connect to SafeWay Backend Data
      useEffect(() => {
        let unsub = null;
        const initialize = () => {
          if (window.SafeWayData && !bData) {
            setBData(window.SafeWayData.INITIAL_BUILDING_DATA);
            unsub = window.SafeWayData.subscribeToRealtimeData(state => setLiveState(state));
          }
        };
        initialize();
        window.addEventListener('safeway-ready', initialize);
        const interval = setInterval(initialize, 60);
        return () => {
          clearInterval(interval);
          window.removeEventListener('safeway-ready', initialize);
          if (unsub) unsub();
        };
      }, [bData]);

      // Connect Motion Tracker
      useEffect(() => {
        if (!tracker && window.SafeWayData?.MotionTracker) {
          setTracker(new window.SafeWayData.MotionTracker());
        }
      }, [tracker]);

      useEffect(() => {
        if (!tracker) return;
        const unsub = tracker.subscribe(e => {
          if (e.type === 'STEP') {
            setStepCount(e.stepCount);
            setTraveledDistance(e.distance);
          } else if (e.type === 'ORIENTATION') {
            setCompassHeading(e.heading);
          } else if (e.type === 'RESET') {
            setStepCount(0);
            setTraveledDistance(0);
          }
        });
        return () => unsub();
      }, [tracker]);

      // Presentation Auto-Walk Simulator
      useEffect(() => {
        let timer = null;
        if (autoWalkActive && tracker) {
          timer = setInterval(() => {
            tracker.simulateStep(0.85);
          }, 850);
        }
        return () => {
          if (timer) clearInterval(timer);
        };
      }, [autoWalkActive, tracker]);

      // Sound & Speech Cues on Emergency
      useEffect(() => {
        let sirenTimer = null;
        if (liveState?.emergencyActive && soundEnabled) {
          speakText("Emergency Evacuation Active. Please follow the illuminated green route to safety.");
          playSiren();
          sirenTimer = setInterval(playSiren, 900);
        }
        return () => {
          if (sirenTimer) clearInterval(sirenTimer);
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        };
      }, [liveState?.emergencyActive, soundEnabled]);

      // HTML5 Camera QR Code Scanner lifecycle
      useEffect(() => {
        let html5QrCode = null;
        let timeoutId = null;
        if (isQrModalOpen && scannerActive && typeof window.Html5Qrcode !== 'undefined') {
          timeoutId = setTimeout(() => {
            const el = document.getElementById('mobile-qr-reader-video');
            if (el) {
              html5QrCode = new window.Html5Qrcode('mobile-qr-reader-video');
              html5QrCode.start(
                { facingMode: 'environment' },
                { fps: 10, qrbox: { width: 220, height: 220 } },
                (decodedText) => {
                  const res = window.SafeWayData?.resolveQrCode(decodedText);
                  if (res && res.nodeId) {
                    setUserLocationNodeId(res.nodeId);
                    if (tracker) tracker.resetToOrigin();
                    setIsQrModalOpen(false);
                    setScannerActive(false);
                    speakText(`Location updated to ${res.name || res.nodeId}`);
                  }
                },
                () => {}
              ).catch(err => {
                console.warn('[Html5Qrcode] Camera error:', err);
              });
            }
          }, 150);
        }
        return () => {
          if (timeoutId) clearTimeout(timeoutId);
          if (html5QrCode) {
            html5QrCode.stop().catch(() => {}).then(() => {
              try { html5QrCode.clear(); } catch(e) {}
            });
          }
        };
      }, [isQrModalOpen, scannerActive, tracker]);

      if (!bData || !liveState) {
        return (
          <div className="flex h-screen items-center justify-center text-indigo-400 font-black text-sm flex-col gap-3">
            <div className="w-10 h-10 border-4 border-slate-800 border-t-indigo-500 rounded-full animate-spin"></div>
            <span>Loading SafeWay Mobile...</span>
          </div>
        );
      }

      const isEmergency = liveState.emergencyActive;
      const userNode = bData.nodes.find(n => n.id === userLocationNodeId) || bData.nodes[0];

      // Route computation
      const effectiveEdges = bData.edges.map(e => ({
        ...e,
        blocked: liveState.blockedEdges[e.id] !== undefined ? liveState.blockedEdges[e.id] : e.blocked
      }));

      const effectiveExits = bData.exits.map(ex => ({
        ...ex,
        isOpen: liveState.exits[ex.id]?.isOpen !== false,
        crowdLevel: liveState.crowds[ex.id] || ex.crowdLevel
      }));

      const crowdInput = {
        exits: liveState.crowds,
        edges: liveState.corridorCrowds,
        zones: liveState.crowds
      };

      const normalRoute = !isEmergency ? window.SafeWayData.findShortestPath(
        userLocationNodeId,
        destinationNodeId,
        bData.nodes,
        effectiveEdges,
        { isEmergency: false, accessibilityMode },
        crowdInput,
        liveState.hazards,
        liveState.emergencyPolicies
      ) : null;

      const evacuationResult = isEmergency ? window.SafeWayData.findSafestEvacuationPath(
        userLocationNodeId,
        bData.nodes,
        effectiveEdges,
        effectiveExits,
        bData.assemblyAreas,
        { isEmergency: true, accessibilityMode, nearestEmergencyDestination: true },
        crowdInput,
        liveState.hazards,
        liveState.emergencyPolicies
      ) : null;

      const activeRoute = isEmergency ? evacuationResult?.bestRoute : normalRoute;

      // Register software-defined route for crowd balancing
      useEffect(() => {
        if (isEmergency && evacuationResult?.recommendedExit?.id) {
          window.SafeWayData?.registerActiveRoute('mobile-user-1', evacuationResult.recommendedExit.id, userNode?.zone);
        }
      }, [isEmergency, evacuationResult?.recommendedExit?.id, userNode?.zone]);

      // Calculate path points for SVG & motion interpolation
      const routePoints = activeRoute?.pathNodes?.map(n => [n.x, n.y]) || [[userNode.x, userNode.y]];
      const liveUserCoords = useMemo(() => {
        if (routePoints.length > 1 && traveledDistance > 0) {
          return window.SafeWayData?.interpolatePositionOnRoute?.(routePoints, traveledDistance * 6) || routePoints[0];
        }
        return routePoints[0];
      }, [routePoints, traveledDistance]);

      const stepsList = activeRoute?.steps || [];
      const currentStep = stepsList[activeStepIdx] || stepsList[0] || { title: "Follow Guidance Path", description: "Proceed straight along the marked green line." };

      const handleQrSubmit = (e) => {
        if (e) e.preventDefault();
        const res = window.SafeWayData?.resolveQrCode(qrInputText);
        if (res && res.nodeId) {
          setUserLocationNodeId(res.nodeId);
          if (tracker) tracker.resetToOrigin();
          setIsQrModalOpen(false);
          setQrInputText("");
          speakText(`Location updated to ${res.name || res.nodeId}`);
        }
      };

      const handleQuickCheckin = (nodeId, name) => {
        setUserLocationNodeId(nodeId);
        if (tracker) tracker.resetToOrigin();
        setIsQrModalOpen(false);
        speakText(`Position set to ${name}`);
      };

      const toggleSensors = async () => {
        if (!tracker) return;
        if (isMotionTracking) {
          tracker.stop();
          setIsMotionTracking(false);
        } else {
          const granted = await tracker.requestPermission();
          if (granted) {
            tracker.start();
            setIsMotionTracking(true);
            speakText("Sensors connected.");
          }
        }
      };

      const triggerSosDistress = () => {
        window.SafeWayData.sendDistressSignal({
          userId: "mobile-user-1",
          locationName: userNode.name,
          nodeId: userNode.id,
          floor: userNode.floor || 1,
          zone: userNode.zone || "Campus"
        });
        setSosSent(true);
        speakText("Distress beacon transmitted to emergency operations console.");
      };

      return (
        <div className="min-h-screen flex flex-col justify-between bg-slate-950 max-w-md mx-auto relative shadow-2xl">
          {/* Top Mobile Header */}
          <header className="p-3.5 bg-slate-900/95 border-b border-slate-800 flex items-center justify-between sticky top-0 z-30 backdrop-blur-xl">
            <div className="flex items-center gap-2.5">
              <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-black text-white shadow-lg ${isEmergency ? "bg-red-600 animate-pulse" : "bg-indigo-600"}`}>
                <Icon name={isEmergency ? "siren" : "navigation"} className="w-4 h-4 text-white" />
              </div>
              <div>
                <h1 className="text-xs font-black text-white flex items-center gap-1.5">
                  SafeWay V3
                  <span className={`text-[9px] font-black px-2 py-0.5 rounded-full ${isEmergency ? "bg-red-500/30 text-red-300 border border-red-500/40" : "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30"}`}>
                    {isEmergency ? "🚨 EVACUATION" : "🟢 ACTIVE"}
                  </span>
                </h1>
                <p className="text-[10px] text-slate-400 font-medium truncate max-w-[140px]">
                  At: <b className="text-indigo-300">{userNode.name}</b>
                </p>
              </div>
            </div>

            <div className="flex items-center gap-1.5">
              <button
                onClick={() => setSoundEnabled(!soundEnabled)}
                className={`p-2 rounded-xl border text-xs transition ${soundEnabled ? "bg-indigo-600/30 text-indigo-300 border-indigo-500/40" : "bg-slate-800 text-slate-500 border-slate-700"}`}
                title="Toggle Voice Alerts"
              >
                <Icon name={soundEnabled ? "volume-2" : "volume-x"} className="w-4 h-4" />
              </button>

              <button
                onClick={() => setAccessibilityMode(!accessibilityMode)}
                className={`px-2.5 py-1.5 rounded-xl border text-[11px] font-black transition flex items-center gap-1 ${accessibilityMode ? "bg-emerald-600 text-white border-emerald-400" : "bg-slate-800 text-slate-300 border-slate-700"}`}
                title="Step-Free Wheelchair Mode"
              >
                <span>♿</span>
              </button>

              <a
                href="/index.html"
                className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-bold rounded-xl border border-slate-700 transition"
              >
                🖥️ PC
              </a>
            </div>
          </header>

          {/* Emergency Alert or Destination Selector */}
          <div className="px-3.5 pt-3">
            {isEmergency && evacuationResult ? (
              <div className="bg-gradient-to-r from-red-950 via-red-900 to-slate-900 border border-red-500/60 p-3.5 rounded-2xl shadow-xl space-y-2">
                <div className="flex items-center justify-between text-xs font-black text-red-300">
                  <span className="flex items-center gap-1.5">
                    <Icon name="siren" className="w-4 h-4 text-red-400 animate-bounce" />
                    EMERGENCY EVACUATION
                  </span>
                  <span className="text-[10px] font-mono bg-red-950 px-2 py-0.5 rounded-full border border-red-500/40">
                    {activeRoute?.totalDistance}m (~{Math.ceil((activeRoute?.totalDistance || 30) / 1.2)}s)
                  </span>
                </div>
                <div className="text-sm font-black text-white leading-tight">
                  {evacuationResult.isRefugeRoute
                    ? `Proceed to ${evacuationResult.refugeNode?.name || "Floor 2 Safe Refuge"}`
                    : `Evacuate to ${evacuationResult.recommendedExit?.name || evacuationResult.recommendedAssembly?.name || "Safe Assembly Area"}`}
                </div>
                <p className="text-[11px] text-slate-300 leading-snug">
                  {evacuationResult.safetyGuidance || "Follow the illuminated green safety path."}
                </p>
              </div>
            ) : (
              <div className="bg-slate-900/90 border border-slate-800 p-3 rounded-2xl space-y-2">
                <div className="flex items-center justify-between text-xs">
                  <span className="font-black text-slate-300 text-[11px]">🎯 Destination:</span>
                  <span className="text-[10px] text-indigo-400 font-mono">{activeRoute?.totalDistance}m distance</span>
                </div>
                <select
                  value={destinationNodeId}
                  onChange={(e) => setDestinationNodeId(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 text-white text-xs font-bold rounded-xl p-2.5 outline-none focus:border-indigo-500"
                >
                  <optgroup label="College Campus & Blocks">
                    {bData.nodes.filter(n => ['room', 'entrance', 'assembly'].includes(n.type)).map(n => (
                      <option key={n.id} value={n.id}>{n.name} (Floor {n.floor})</option>
                    ))}
                  </optgroup>
                </select>
              </div>
            )}
          </div>

          {/* Turn-by-Turn Card */}
          <div className="px-3.5 pt-2">
            <div className="bg-slate-900 border border-indigo-500/30 p-3 rounded-2xl flex items-center justify-between gap-3 shadow-lg">
              <div className="flex items-center gap-2.5">
                <div className="w-7 h-7 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-xs font-black shrink-0">
                  {activeStepIdx + 1}
                </div>
                <div className="space-y-0.5">
                  <div className="text-xs font-black text-white">{currentStep.title}</div>
                  <div className="text-[10px] text-slate-400 line-clamp-1">{currentStep.description}</div>
                </div>
              </div>

              <div className="flex items-center gap-1">
                <button
                  disabled={activeStepIdx === 0}
                  onClick={() => setActiveStepIdx(prev => Math.max(0, prev - 1))}
                  className="px-2 py-1 bg-slate-800 disabled:opacity-30 rounded-lg text-xs font-bold"
                >
                  ‹
                </button>
                <button
                  disabled={activeStepIdx >= stepsList.length - 1}
                  onClick={() => setActiveStepIdx(prev => Math.min(stepsList.length - 1, prev + 1))}
                  className="px-2 py-1 bg-indigo-600 disabled:opacity-30 rounded-lg text-xs font-bold text-white"
                >
                  ›
                </button>
              </div>
            </div>
          </div>

          {/* Interactive Mobile Map Screen */}
          <main className="flex-1 px-3.5 py-2.5 flex flex-col justify-center relative min-h-[340px]">
            <div className="w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-3 shadow-2xl relative overflow-hidden flex flex-col items-center">
              <svg viewBox="0 0 1000 650" className="w-full h-full max-h-[360px] rounded-2xl bg-slate-950 border border-slate-800">
                {/* Campus Image Layout */}
                <image href="/assets/college-campus-layout.jpeg" x="0" y="0" width="1000" height="650" preserveAspectRatio="xMidYMid meet" opacity="0.85" />

                {/* Safe Places */}
                <g transform="translate(535,65)">
                  <circle r="28" fill="#059669" fillOpacity="0.9" stroke="#ffffff" strokeWidth="2.5" />
                  <text y="4" textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="900">SAFE AREA</text>
                </g>
                <g transform="translate(90,145)">
                  <circle r="28" fill="#059669" fillOpacity="0.9" stroke="#ffffff" strokeWidth="2.5" />
                  <text y="4" textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="900">SAFE AREA</text>
                </g>

                {/* Dynamic Hazard Fire Zones */}
                {bData.zones.map(zone => {
                  const h = liveState.hazards[zone.id] || "none";
                  if (h === "none") return null;
                  const zNodes = bData.nodes.filter(n => zone.nodeIds.includes(n.id));
                  if (zNodes.length === 0) return null;
                  const minX = Math.min(...zNodes.map(n => n.x)) - 30;
                  const maxX = Math.max(...zNodes.map(n => n.x)) + 30;
                  const minY = Math.min(...zNodes.map(n => n.y)) - 30;
                  const maxY = Math.max(...zNodes.map(n => n.y)) + 30;
                  return (
                    <g key={zone.id} className="animate-pulse">
                      <rect x={minX} y={minY} width={maxX - minX} height={maxY - minY} rx="16" fill="rgba(239,68,68,0.4)" stroke="#ef4444" strokeWidth="3" strokeDasharray="6 3" />
                      <text x={(minX + maxX)/2} y={(minY + maxY)/2} textAnchor="middle" fill="#ffffff" fontSize="12" fontWeight="900">🔥 FIRE HAZARD</text>
                    </g>
                  );
                })}

                {/* Route Path Polyline */}
                {routePoints.length > 1 && (
                  <g>
                    <polyline
                      points={routePoints.map(p => p.join(",")).join(" ")}
                      fill="none"
                      stroke={isEmergency ? "#10b981" : "#6366f1"}
                      strokeWidth="10"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      opacity="0.9"
                    />
                    <polyline
                      points={routePoints.map(p => p.join(",")).join(" ")}
                      fill="none"
                      stroke="#ffffff"
                      strokeWidth="3.5"
                      strokeDasharray="9 6"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      className="route-glow-dash"
                    />
                  </g>
                )}

                {/* Live User Pointer with Compass Heading Needle */}
                <g transform={`translate(${liveUserCoords[0]}, ${liveUserCoords[1]})`}>
                  <circle r="36" fill="#0ea5e9" fillOpacity="0.3" className="mobile-radar-pulse" />
                  <circle r="14" fill="#0284c7" stroke="#ffffff" strokeWidth="4" />
                  
                  {/* Rotating Compass Needle */}
                  <g transform={`rotate(${compassHeading || 0})`}>
                    <polygon points="0,-26 -7,-11 7,-11" fill="#ef4444" stroke="#ffffff" strokeWidth="1.5" />
                  </g>
                  <circle r="4" fill="#ffffff" />
                  
                  <g transform="translate(0, 26)">
                    <rect x="-44" y="-9" width="88" height="18" rx="8" fill="#0284c7" stroke="#ffffff" strokeWidth="1.5" />
                    <text y="4" textAnchor="middle" fill="#ffffff" fontSize="8" fontWeight="900">
                      {stepCount > 0 ? `👣 ${stepCount} STEPS` : "YOU ARE HERE"}
                    </text>
                  </g>
                </g>
              </svg>

              {/* Real-time Telemetry HUD overlay */}
              <div className="absolute top-5 left-5 bg-slate-950/90 border border-slate-800 px-3 py-1.5 rounded-xl text-[10px] font-mono text-slate-300 shadow-xl flex items-center gap-2">
                <span>👣 <b>{stepCount}</b> steps</span>
                <span className="text-slate-600">|</span>
                <span>📏 <b>{traveledDistance.toFixed(1)}</b>m</span>
                <span className="text-slate-600">|</span>
                <span>🧭 <b>{compassHeading}°</b></span>
              </div>
            </div>
          </main>

          {/* Bottom Thumb Control Bar */}
          <footer className="p-3 bg-slate-900 border-t border-slate-800 sticky bottom-0 z-30 space-y-2">
            <div className="grid grid-cols-4 gap-1.5">
              {/* Scan QR */}
              <button
                onClick={() => { setIsQrModalOpen(true); setScannerActive(true); }}
                className="py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-black text-[11px] shadow-lg shadow-indigo-600/30 flex flex-col items-center justify-center gap-0.5"
              >
                <span>📷 QR Scan</span>
              </button>

              {/* Step Simulator */}
              <button
                onClick={() => tracker?.simulateStep(0.85)}
                className="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-2xl font-black text-[11px] border border-slate-700 flex flex-col items-center justify-center gap-0.5"
              >
                <span>🚶 Step (+1)</span>
              </button>

              {/* Auto-Walk Demo */}
              <button
                onClick={() => setAutoWalkActive(!autoWalkActive)}
                className={`py-2.5 rounded-2xl font-black text-[11px] border transition flex flex-col items-center justify-center gap-0.5 ${
                  autoWalkActive ? "bg-amber-600/30 text-amber-300 border-amber-500/50 animate-pulse" : "bg-slate-800 text-slate-300 border-slate-700"
                }`}
              >
                <span>{autoWalkActive ? "⏸ Pause" : "▶ Auto-Walk"}</span>
              </button>

              {/* Emergency SOS */}
              <button
                onClick={() => setIsSosModalOpen(true)}
                className="py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-2xl font-black text-[11px] shadow-lg shadow-red-600/40 flex flex-col items-center justify-center gap-0.5"
              >
                <span>🆘 SOS</span>
              </button>
            </div>

            {/* Sensors Toggle Strip */}
            <div className="flex items-center justify-between px-1 text-[10px] text-slate-400">
              <button
                onClick={toggleSensors}
                className={`px-2.5 py-1 rounded-xl font-bold border transition ${
                  isMotionTracking ? "bg-emerald-600/30 text-emerald-300 border-emerald-500/40" : "bg-slate-800 text-slate-400 border-slate-700"
                }`}
              >
                {isMotionTracking ? "🟢 Phone Sensors: ACTIVE" : "📱 Enable Physical Phone Sensors"}
              </button>

              <button
                onClick={() => tracker?.resetToOrigin()}
                className="text-slate-500 hover:text-slate-300 font-mono"
              >
                ↺ Reset Drift
              </button>
            </div>
          </footer>

          {/* QR Camera Waypoint Scanner Modal */}
          {isQrModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-2xl">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl max-w-sm w-full space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <h3 className="text-sm font-black text-white flex items-center gap-2">
                    <Icon name="qr-code" className="w-4 h-4 text-indigo-400" />
                    Indoor QR Waypoint Check-In
                  </h3>
                  <button onClick={() => { setIsQrModalOpen(false); setScannerActive(false); }} className="text-slate-400 hover:text-white font-black text-sm p-1">✕</button>
                </div>

                {/* Camera Viewport */}
                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-slate-300">📷 Real Camera:</span>
                    <button
                      type="button"
                      onClick={() => setScannerActive(!scannerActive)}
                      className={`px-2.5 py-1 text-xs font-bold rounded-xl border transition ${scannerActive ? "bg-red-600/30 text-red-300 border-red-500/50" : "bg-indigo-600 text-white border-indigo-500"}`}
                    >
                      {scannerActive ? "Stop Camera" : "Open Camera"}
                    </button>
                  </div>

                  {scannerActive && (
                    <div className="bg-black rounded-2xl overflow-hidden border border-indigo-500/50 p-2 text-center">
                      <div id="mobile-qr-reader-video" className="w-full rounded-xl overflow-hidden"></div>
                      <p className="text-[10px] text-slate-400 mt-1">Point at wall code sticker (e.g. SW-ROOM204)</p>
                    </div>
                  )}
                </div>

                {/* Manual Code Input */}
                <form onSubmit={handleQrSubmit} className="space-y-2 pt-2 border-t border-slate-800">
                  <label className="text-[11px] font-bold text-slate-400 block">Or Type Waypoint Code:</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="e.g. SW-ROOM204"
                      value={qrInputText}
                      onChange={(e) => setQrInputText(e.target.value)}
                      className="flex-1 bg-slate-950 border border-slate-700 rounded-2xl p-2.5 text-xs text-white font-mono uppercase"
                    />
                    <button type="submit" className="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl text-xs font-bold">
                      Set
                    </button>
                  </div>
                </form>

                {/* 1-Tap Quick Presets */}
                <div className="space-y-1.5 pt-2 border-t border-slate-800">
                  <div className="text-[11px] font-bold text-slate-400">1-Tap Location Presets:</div>
                  <div className="grid grid-cols-2 gap-1.5 text-[10px]">
                    <button onClick={() => handleQuickCheckin("ent-main", "Main Entrance")} className="p-2 bg-slate-950 border border-slate-800 hover:border-indigo-500 rounded-xl text-left font-bold truncate">🚪 Main Gate</button>
                    <button onClick={() => handleQuickCheckin("room-204", "Room 204 (2F)")} className="p-2 bg-slate-950 border border-slate-800 hover:border-indigo-500 rounded-xl text-left font-bold truncate">🏫 Room 204 (2F)</button>
                    <button onClick={() => handleQuickCheckin("lab-101", "Physics Lab (1F)")} className="p-2 bg-slate-950 border border-slate-800 hover:border-indigo-500 rounded-xl text-left font-bold truncate">🔬 Physics Lab</button>
                    <button onClick={() => handleQuickCheckin("stair-a-1f", "Staircase A")} className="p-2 bg-slate-950 border border-slate-800 hover:border-indigo-500 rounded-xl text-left font-bold truncate">🪜 Staircase A</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* SOS Distress Beacon Confirmation Modal */}
          {isSosModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-red-950/90 backdrop-blur-2xl">
              <div className="bg-slate-900 border-2 border-red-600 rounded-3xl p-6 shadow-2xl max-w-sm w-full space-y-4 text-center">
                <div className="w-14 h-14 rounded-2xl bg-red-600 flex items-center justify-center font-black text-white text-2xl mx-auto animate-bounce shadow-2xl shadow-red-600/60">
                  🆘
                </div>

                <div className="space-y-1">
                  <h3 className="text-lg font-black text-white">Emergency Trapped Signal</h3>
                  <p className="text-xs text-slate-300">
                    Transmitting your location to the Campus Security Command Center:
                  </p>
                  <div className="p-3 bg-slate-950 rounded-2xl border border-red-500/40 text-xs font-mono font-black text-red-400">
                    📍 {userNode.name} (Floor {userNode.floor})
                  </div>
                </div>

                {sosSent ? (
                  <div className="p-3 bg-emerald-950 border border-emerald-500/50 rounded-2xl text-emerald-300 text-xs font-bold flex items-center justify-center gap-2">
                    <Icon name="check" className="w-4 h-4 text-emerald-400" />
                    Distress Beacon Active & Logged!
                  </div>
                ) : (
                  <div className="flex gap-2">
                    <button
                      onClick={() => setIsSosModalOpen(false)}
                      className="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl text-xs font-bold"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={triggerSosDistress}
                      className="flex-1 py-3 bg-red-600 hover:bg-red-500 text-white rounded-2xl text-xs font-black shadow-xl shadow-red-600/40"
                    >
                      SEND HELP
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<MobileApp />);
  </script>
</body>
</html>
