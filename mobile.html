    function selectBestEgressDoor(groundMapId, liveState) {
      const options = BLOCK_EGRESS_OPTIONS[groundMapId] || [];
      if (options.length === 0) {
        return { id: "Exit", label: "MAIN EXIT", point: [250, 590], campusNode: "admin", corridorY: 455, hubX: 500 };
      }

      const viable = options.filter(opt => {
        if (liveState?.exits?.[opt.id]?.isOpen === false) return false;
        if (liveState?.exits?.[opt.key]?.isOpen === false) return false;
        if (liveState?.hazards?.[opt.key] === "high" || liveState?.hazards?.[opt.id] === "high" || liveState?.hazards?.[groundMapId + ":" + opt.id] === "high") return false;
        if (liveState?.blockedEdges?.[opt.key] || liveState?.blockedEdges?.[opt.id]) return false;
        return true;
      });

      if (viable.length === 0) {
        return {
          id: "Area of Refuge",
          label: "SAFE AREA OF REFUGE (ALL EXITS BLOCKED)",
          point: [500, 390],
          campusNode: "admin",
          corridorY: 400,
          hubX: 500,
          isTrapped: true
        };
      }

      viable.sort((a, b) => {
        const crowdA = liveState?.crowds?.[a.id] === "High" ? 50 : (liveState?.crowds?.[a.id] === "Medium" ? 20 : 0);
        const crowdB = liveState?.crowds?.[b.id] === "High" ? 50 : (liveState?.crowds?.[b.id] === "Medium" ? 20 : 0);
        return (crowdA + (a.defaultPriority || 1)) - (crowdB + (b.defaultPriority || 1));
      });

      return viable[0];
    }

        return true;
      });

    function calculatePolylineLength(points) {
      if (!points || points.length < 2) return 1;
      let len = 0;
      for (let i = 0; i < points.length - 1; i++) {
        const dx = points[i+1][0] - points[i][0];
        const dy = points[i+1][1] - points[i][1];
        len += Math.sqrt(dx * dx + dy * dy);
      }
      return len;
    }

    function buildMultiFloorStagePipeline({
      activeOriginLocation,
      activeDestLocation,
      activeCampusRoute,
      liveState,
      accessibilityMode
    }) {
      const stages = [];
      const originMap = activeOriginLocation.mapId;
      const destMap = activeDestLocation.mapId;

      const originBlockPrefix = originMap !== "campus" ? originMap.split("-")[0] : null;
      const destBlockPrefix = destMap !== "campus" ? destMap.split("-")[0] : null;

      const isOriginUpperOrLower = originMap.includes("first") || originMap.includes("basement");
      const isDestUpperOrLower = destMap.includes("first") || destMap.includes("basement");

      // Dynamic Egress Selection
      const chosenStairs = isOriginUpperOrLower ? selectBestStairs(originMap, liveState) : null;
      const groundMapId = originBlockPrefix ? (originBlockPrefix + "-ground") : "campus";
      const chosenEgressDoor = selectBestEgressDoor(groundMapId, liveState);

      // SCENARIO 1: Origin is on 1F or Basement -> Route Down to Ground Floor first
      if (isOriginUpperOrLower) {
        const roomPt = activeOriginLocation.point || [500, 325];
        const stairsPt = chosenStairs?.point || [800, 235];
        const corridorY = chosenStairs?.corridorY || 325;
        const hubX = chosenStairs?.hubX || 520;

        const p1 = [
          roomPt,
          [roomPt[0], corridorY],
          [hubX, corridorY],
          [stairsPt[0], corridorY],
          stairsPt
        ];

        stages.push({
          stageKey: "origin-upper",
          mapId: originMap,
          title: "Step 1: Depart " + (activeOriginLocation.name.split('—')[1] || "Room"),
          description: "Walk along corridor to " + (chosenStairs?.label || "Stairs") + ".",
          targetBadge: "STAIRS",
          targetBadgeColor: "#f59e0b",
          targetLabel: chosenStairs?.label || "STAIRS",
          startPoint: roomPt,
          endPoint: stairsPt,
          points: p1,
          d: "M " + p1.map(p => p.join(" ")).join(" L "),
          pixelLength: calculatePolylineLength(p1),
          nextMapId: groundMapId,
          switchPrompt: "Descend to Ground Floor ➔",
          voiceAnnouncement: "Descended to " + originBlockPrefix + " Ground Floor. Showing path to " + chosenEgressDoor.label + "."
        });

        // Stage 2: Ground Floor of Origin Block (Stairs to Dynamic Egress Door)
        const gStairsPt = chosenStairs?.groundStairs || [760, 250];
        const gExitPt = chosenEgressDoor.point || [250, 590];
        const gCorridorY = chosenEgressDoor.corridorY || 455;
        const gHubX = chosenEgressDoor.hubX || 500;

        const p2 = [
          gStairsPt,
          [gStairsPt[0], gCorridorY],
          [gHubX, gCorridorY],
          [gExitPt[0], gCorridorY],
          gExitPt
        ];

        stages.push({
          stageKey: "origin-ground",
          mapId: groundMapId,
          title: chosenEgressDoor.isTrapped ? "Emergency: Safe Refuge Zone" : "Step 2: Ground Floor Egress",
          description: chosenEgressDoor.isTrapped ? "All exits compromised. Proceed to designated Safe Refuge Zone." : ("Walk from stairwell to " + chosenEgressDoor.label + "."),
          targetBadge: chosenEgressDoor.isTrapped ? "REFUGE" : "EXIT",
          targetBadgeColor: chosenEgressDoor.isTrapped ? "#ef4444" : "#10b981",
          targetLabel: chosenEgressDoor.label,
          startPoint: gStairsPt,
          endPoint: gExitPt,
          points: p2,
          d: "M " + p2.map(p => p.join(" ")).join(" L "),
          pixelLength: calculatePolylineLength(p2),
          nextMapId: (destMap === groundMapId) ? groundMapId : "campus",
          switchPrompt: chosenEgressDoor.isTrapped ? null : "Exit to Campus Ground ➔",
          voiceAnnouncement: "Exited " + originBlockPrefix + " Block via " + chosenEgressDoor.label + ". Showing outdoor campus map."
        });
      } else if (originMap.includes("ground")) {
        // Origin is on Ground Floor
        const roomPt = activeOriginLocation.point || [350, 455];
        const gExitPt = (destMap === originMap) ? (activeDestLocation.point || [830, 455]) : (chosenEgressDoor.point || [250, 590]);
        const gCorridorY = chosenEgressDoor.corridorY || 455;
        const gHubX = chosenEgressDoor.hubX || 500;

        const p = [
          roomPt,
          [roomPt[0], gCorridorY],
          [gHubX, gCorridorY],
          [gExitPt[0], gCorridorY],
          gExitPt
        ];

        stages.push({
          stageKey: "origin-ground",
          mapId: originMap,
          title: (destMap === originMap) ? ("Walk to " + (activeDestLocation.room || "Destination")) : ("Exit " + activeOriginLocation.name.split('—')[0] + " via " + chosenEgressDoor.label),
          description: (destMap === originMap) ? "Follow corridor to destination room." : ("Walk along hallway to " + chosenEgressDoor.label + "."),
          targetBadge: (destMap === originMap) ? "TARGET" : "EXIT",
          targetBadgeColor: (destMap === originMap) ? "#2563eb" : "#10b981",
          targetLabel: (destMap === originMap) ? (activeDestLocation.room || "ROOM") : chosenEgressDoor.label,
          startPoint: roomPt,
          endPoint: gExitPt,
          points: p,
          d: "M " + p.map(p => p.join(" ")).join(" L "),
          pixelLength: calculatePolylineLength(p),
          nextMapId: (destMap === originMap) ? originMap : "campus",
          switchPrompt: (destMap === originMap) ? null : "Exit to Campus Ground ➔",
          voiceAnnouncement: "Exited " + originBlockPrefix + " Block. Showing campus route."
        });
      }

      // SCENARIO 2: Campus Circulation Stage
      if (!chosenEgressDoor.isTrapped && (destMap === "campus" || destBlockPrefix !== originBlockPrefix)) {
        const campusPts = activeCampusRoute?.pathNodes?.map(n => [n.x, n.y]) || [[355, 206], [760, 490]];
        const targetBlockName = activeDestLocation.name.split('—')[0];

        stages.push({
          stageKey: "campus-walk",
          mapId: "campus",
          title: "Campus Walkway: Approach " + (destMap === "campus" ? activeDestLocation.name : targetBlockName),
          description: "Follow illuminated pathway across campus grounds.",
          targetBadge: destMap === "campus" ? "DESTINATION" : "GATE",
          targetBadgeColor: destMap === "campus" ? "#059669" : "#6366f1",
          targetLabel: destMap === "campus" ? activeDestLocation.name : (targetBlockName + " ENTRANCE"),
          startPoint: campusPts[0],
          endPoint: campusPts[campusPts.length - 1],
          points: campusPts,
          d: "M " + campusPts.map(p => p.join(" ")).join(" L "),
          pixelLength: calculatePolylineLength(campusPts),
          nextMapId: destMap !== "campus" ? (destBlockPrefix + "-ground") : "campus",
          switchPrompt: destMap !== "campus" ? ("Enter " + targetBlockName + " ➔") : null,
          voiceAnnouncement: destMap !== "campus" ? ("Arrived at " + targetBlockName + " entrance. Showing Ground Floor plan.") : ("Arrived at " + activeDestLocation.name + "!")
        });
      }

      // SCENARIO 3: Target Block Ingress (Ground Floor -> Target Room / Stairs)
      if (!chosenEgressDoor.isTrapped && destMap !== "campus" && (destBlockPrefix !== originBlockPrefix || (originMap === "campus"))) {
        const targetGroundMapId = destBlockPrefix + "-ground";
        const targetChosenDoor = selectBestEgressDoor(targetGroundMapId, liveState);
        const entryPt = targetChosenDoor.point || [250, 590];
        const targetEndPt = isDestUpperOrLower ? (selectBestStairs(destMap, liveState)?.groundStairs || [760, 250]) : (activeDestLocation.point || [830, 455]);
        const tCorridorY = targetChosenDoor.corridorY || 455;
        const tHubX = targetChosenDoor.hubX || 500;

        const pInGround = [
          entryPt,
          [entryPt[0], tCorridorY],
          [tHubX, tCorridorY],
          [targetEndPt[0], tCorridorY],
          targetEndPt
        ];

        stages.push({
          stageKey: "target-ground",
          mapId: targetGroundMapId,
          title: isDestUpperOrLower ? "Enter Ground Floor & Head to Stairs" : ("Enter Ground Floor to " + (activeDestLocation.room || "Room")),
          description: isDestUpperOrLower ? "Walk through ground lobby to stairwell." : "Follow corridor to room doorway.",
          targetBadge: isDestUpperOrLower ? "STAIRS" : "TARGET",
          targetBadgeColor: isDestUpperOrLower ? "#f59e0b" : "#2563eb",
          targetLabel: isDestUpperOrLower ? "STAIRS" : (activeDestLocation.room || "ROOM"),
          startPoint: entryPt,
          endPoint: targetEndPt,
          points: pInGround,
          d: "M " + pInGround.map(p => p.join(" ")).join(" L "),
          pixelLength: calculatePolylineLength(pInGround),
          nextMapId: destMap,
          switchPrompt: isDestUpperOrLower ? ("Ascend to " + activeDestLocation.name.split('—')[1] + " ➔") : null,
          voiceAnnouncement: isDestUpperOrLower ? ("Ascended to " + activeDestLocation.name.split('—')[1] + ". Showing final floor route.") : ("Arrived at " + activeDestLocation.room + "!")
        });

        if (isDestUpperOrLower) {
          const targetStairs = selectBestStairs(destMap, liveState);
          const tStairsPt = targetStairs?.point || [800, 235];
          const tRoomPt = activeDestLocation.point || [500, 325];
          const finalCorridorY = targetStairs?.corridorY || 325;
          const finalHubX = targetStairs?.hubX || 520;

          const pFinal = [
            tStairsPt,
            [tStairsPt[0], finalCorridorY],
            [finalHubX, finalCorridorY],
            [tRoomPt[0], finalCorridorY],
            tRoomPt
          ];

          stages.push({
            stageKey: "target-final",
            mapId: destMap,
            title: "Final Approach: " + (activeDestLocation.room || activeDestLocation.name),
            description: "Walk along corridor to room entrance.",
            targetBadge: "DESTINATION",
            targetBadgeColor: "#059669",
            targetLabel: activeDestLocation.room || "TARGET ROOM",
            startPoint: tStairsPt,
            endPoint: tRoomPt,
            points: pFinal,
            d: "M " + pFinal.map(p => p.join(" ")).join(" L "),
            pixelLength: calculatePolylineLength(pFinal),
            nextMapId: destMap,
            switchPrompt: null,
            voiceAnnouncement: "Arrived at destination: " + activeDestLocation.room + "!"
          });
        }
      }

      return stages.length > 0 ? stages : [
        {
          stageKey: "fallback",
          mapId: originMap,
          title: "Navigate to " + activeDestLocation.name,
          description: "Follow guidance path.",
          targetBadge: "TARGET",
          targetBadgeColor: "#2563eb",
          targetLabel: activeDestLocation.name,
          startPoint: [440, 565],
          endPoint: [760, 490],
          points: [[440, 565], [760, 490]],
          d: "M 440 565 L 760 490",
          pixelLength: 300,
          nextMapId: destMap
        }
      ];
    }

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playEmergencySirenPulse() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(960, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(560, ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 1.05;
          utterance.pitch = 1.0;
          window.speechSynthesis.speak(utterance);
        } catch (e) {}
      }
    }

    function MobileApp() {

          document.documentElement.classList.add('dark');

      }, [theme]);

      const toggleTheme = () => {

      };

      // Walking Speed Selection (Natural 1.4s vs Brisk 0.7s)
      const [walkSpeedMode, setWalkSpeedMode] = useState("1x");

      // Multi-Floor Stage Index State
      const [activeStageIndex, setActiveStageIndex] = useState(0);
      const [stageStepCount, setStageStepCount] = useState(0);
      const [totalStepCount, setTotalStepCount] = useState(0);
      const [compassHeading, setCompassHeading] = useState(0);
      const [isMotionTracking, setIsMotionTracking] = useState(false);
      const [autoWalkActive, setAutoWalkActive] = useState(false);

      // SOS state
      const [isSosModalOpen, setIsSosModalOpen] = useState(false);

      const [statusNotification, setStatusNotification] = useState("");

      const activeMapPlan = MAP_PLANS.find(p => p.id === selectedMapId) || MAP_PLANS[0];

      // Subscribe Realtime Sync
      useEffect(() => {
        if (window.SafeWay?.subscribeToRealtimeData) {
          const unsub = window.SafeWay.subscribeToRealtimeData(state => setLiveState(state));
          return () => { if (unsub) unsub(); };
        }
      }, []);

      const notify = (msg) => {
        setStatusNotification(msg);
        setTimeout(() => setStatusNotification(""), 3500);
      };

      const isEmergency = liveState.emergencyActive;

      // Sound Siren & Vocalization during Emergency
      useEffect(() => {
        let intervalId = null;
        if (isEmergency && soundEnabled) {
          speakText("Attention! Critical emergency evacuation active. Follow the illuminated green route immediately.");
          playEmergencySirenPulse();
          intervalId = setInterval(() => playEmergencySirenPulse(), 850);
        }
        return () => {
          if (intervalId) clearInterval(intervalId);
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        };
      }, [isEmergency, soundEnabled]);

      // Find active origin location object
      const activeOriginLocation = useMemo(() => {
        for (const group of ALL_CAMPUS_LOCATIONS_HIERARCHY) {
          const found = group.items.find(i => i.key === originLocationKey);
          if (found) return found;
        }
        return ALL_CAMPUS_LOCATIONS_HIERARCHY[0].items[0];
      }, [originLocationKey]);

      // Find active destination location object
      const activeDestLocation = useMemo(() => {
        for (const group of ALL_CAMPUS_LOCATIONS_HIERARCHY) {
          const found = group.items.find(i => i.key === destinationLocationKey);
          if (found) return found;
        }
        return ALL_CAMPUS_LOCATIONS_HIERARCHY[0].items[5]; // Garden
      }, [destinationLocationKey]);

      // Dynamic Egress Selection for Campus Handoff
      const originGroundMapId = activeOriginLocation.mapId !== "campus" ? (activeOriginLocation.mapId.split("-")[0] + "-ground") : "campus";

      };

      // Handler for Destination Selection
      const handleDestinationChange = (key) => {
        setDestinationLocationKey(key);
        for (const group of ALL_CAMPUS_LOCATIONS_HIERARCHY) {
          const item = group.items.find(i => i.key === key);
          if (item) {
            setStageStepCount(0);
            setActiveStageIndex(0);
            notify("🎯 Target: " + item.name);
            speakText("Route plotted to " + item.name);
            break;
          }
        }
      };

      if (!bData) {
        return (
          <div className="flex h-screen items-center justify-center text-indigo-400 font-bold">
            Loading AegisPath System...
          </div>
        );
      }

      // Campus Dijkstra Graph Path calculation
      const effectiveEdges = bData.edges.map(e => ({
        ...e,
        blocked: liveState.blockedEdges[e.id] !== undefined ? liveState.blockedEdges[e.id] : e.blocked
      }));

      const effectiveExits = bData.exits.map(ex => ({
        ...ex,
        isOpen: liveState.exits[ex.id]?.isOpen !== false,
        crowdLevel: liveState.crowds[ex.id] || ex.crowdLevel
      }));

      const crowdInput = {
        exits: liveState.crowds,
        edges: liveState.corridorCrowds,
        zones: liveState.crowds
      };

      // Campus start node dynamically anchored to the chosen egress door!
      const campusOriginNodeId = activeOriginLocation.mapId === "campus" 
        ? activeOriginLocation.nodeId 
        : (dynamicEgressDoor?.campusNode || BLOCK_CAMPUS_ENTRANCE_NODES[activeOriginLocation.mapId] || "admin");
      const campusDestNodeId = targetBlockEntranceNodeId || "admin";

      const normalRoute = !isEmergency && window.SafeWay?.findShortestPath ? window.SafeWay.findShortestPath(
        campusOriginNodeId,
        campusDestNodeId,
        bData.nodes,
        effectiveEdges,
        { isEmergency: false, accessibilityMode },
        crowdInput,
        liveState.hazards,
        liveState.emergencyPolicies
      ) : null;

      const evacuationResult = isEmergency && window.SafeWay?.findSafestEvacuationPath ? window.SafeWay.findSafestEvacuationPath(
        campusOriginNodeId,
        bData.nodes,
        effectiveEdges,
        effectiveExits,
        bData.assemblyAreas,
        { isEmergency: true, accessibilityMode, nearestEmergencyDestination: true },
        crowdInput,
        liveState.hazards,
        liveState.emergencyPolicies
      ) : null;

      const activeCampusRoute = isEmergency ? evacuationResult?.bestRoute : normalRoute;

      // Build True Multi-Floor Dynamic Egress Pipeline
      const multiFloorPipeline = useMemo(() => {
        return buildMultiFloorStagePipeline({
          activeOriginLocation,
          activeDestLocation,
          activeCampusRoute,
          liveState,
          accessibilityMode
        });
      }, [activeOriginLocation, activeDestLocation, activeCampusRoute, liveState, accessibilityMode]);

      // Current active stage object in pipeline
      const currentActiveStage = multiFloorPipeline[activeStageIndex] || multiFloorPipeline[0];

      // Keep selectedMapId synced with currentActiveStage map
      useEffect(() => {
        if (currentActiveStage?.mapId && selectedMapId !== currentActiveStage.mapId) {
          setSelectedMapId(currentActiveStage.mapId);
        }
      }, [activeStageIndex, currentActiveStage]);

      // Stage steps required for current sub-stage
      const stageTargetSteps = useMemo(() => {
        if (currentActiveStage?.mapId === "campus") {
          const dist = activeCampusRoute?.totalDistance || 45;
          return Math.max(15, Math.round(dist / 1.5));
        }
        return 18;
      }, [currentActiveStage, activeCampusRoute]);

      // Stage progress ratio (0.0 to 1.0)
      const stageProgress = Math.min(1.0, stageStepCount / (stageTargetSteps || 18));

      // Live Position Coordinate on Active Map
      const liveUserCoords = useMemo(() => {
        try {
          if (currentActiveStage?.points && stageStepCount > 0) {
            const pt = window.SafeWay?.interpolatePositionOnRoute?.(currentActiveStage.points, stageProgress * (currentActiveStage.pixelLength || 350));
            if (pt && Array.isArray(pt) && pt.length >= 2) return pt;
          }
          return currentActiveStage?.startPoint || [440, 565];
        } catch(e) {
          return currentActiveStage?.startPoint || [440, 565];
        }
      }, [currentActiveStage, stageStepCount, stageProgress]);

      // Advance to Next Stage in Pipeline
      const advanceToStage = (targetIndex) => {
        if (targetIndex < multiFloorPipeline.length) {
          setActiveStageIndex(targetIndex);
          setStageStepCount(0);
          const nextStage = multiFloorPipeline[targetIndex];
          setSelectedMapId(nextStage.mapId);
          if (nextStage.voiceAnnouncement) speakText(nextStage.voiceAnnouncement);
          notify("⚡ Stage " + (targetIndex + 1) + ": " + nextStage.title);
        }
      };

      // Step Execution & Automatic Multi-Floor Handoff
      const takeStep = () => {
        setTotalStepCount(prev => prev + 1);
        const nextSteps = stageStepCount + 1;
        setStageStepCount(nextSteps);

        if (nextSteps >= stageTargetSteps) {
          if (activeStageIndex < multiFloorPipeline.length - 1) {
            advanceToStage(activeStageIndex + 1);
          } else {
            notify("🎯 Arrived at " + activeDestLocation.name + "!");
            speakText("You have arrived at your destination: " + activeDestLocation.name + ".");
            setAutoWalkActive(false);
          }
        }
      };

      // Auto-Walk presentation with Natural 1.4s Stride
      useEffect(() => {
        let timer = null;
        if (autoWalkActive) {
          const stepInterval = walkSpeedMode === "2x" ? 700 : 1400;
          timer = setInterval(() => {
            takeStep();
          }, stepInterval);
        }
        return () => { if (timer) clearInterval(timer); };
      }, [autoWalkActive, walkSpeedMode, stageStepCount, activeStageIndex, stageTargetSteps, multiFloorPipeline]);

      const toggleSensors = async () => {
        if (isMotionTracking) {
          setIsMotionTracking(false);
          notify("Sensors paused");
        } else {
          if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
              const res = await DeviceOrientationEvent.requestPermission();
              if (res === 'granted') {
                setIsMotionTracking(true);
                window.addEventListener('deviceorientation', (e) => {
                  if (e.alpha !== null) setCompassHeading(Math.round(e.alpha));
                });
                notify("🟢 Physical Sensors Active!");
              }
            } catch(e) {}
          } else {
            setIsMotionTracking(true);
            window.addEventListener('deviceorientation', (e) => {
              if (e.alpha !== null) setCompassHeading(Math.round(e.alpha));
            });
            notify("🟢 Physical Sensors Active!");
          }
        }
      };

      const triggerSosDistress = () => {
        if (window.SafeWay?.sendDistressSignal) {
          window.SafeWay.sendDistressSignal({
            userId: "aegispath-user-mobile",
            locationName: (activeOriginLocation?.name || "Campus") + " (" + activeMapPlan.label + ")",
            nodeId: "mobile-node",
            floor: activeMapPlan.floor || 1,
            zone: activeMapPlan.group
          });
        }
        setSosSent(true);
        notify("🆘 Trapped Distress Beacon Sent!");
        speakText("Distress beacon transmitted to emergency operations console.");
      };

      const campusNodes = bData.nodes.filter(n => n.floor === 1);
      const campusEdges = bData.edges.filter(e => e.floor === 1);

      const totalEstimatedMeters = (activeCampusRoute?.totalDistance || 35) + (multiFloorPipeline.length * 15);
      const totalEstimatedSeconds = Math.ceil(totalEstimatedMeters / 1.2);

      const isLight = theme === 'light';

      return (
        <div className={"min-h-screen flex flex-col justify-between max-w-md mx-auto relative shadow-2xl pb-4 transition-colors duration-300 " + (isLight ? "bg-slate-100 text-slate-900" : "bg-slate-950 text-slate-100")}>
          {/* Top Header */}
          <header className={"p-3.5 border-b flex items-center justify-between sticky top-0 z-40 backdrop-blur-xl transition-colors " + (
            isEmergency 
              ? "bg-red-950/95 border-red-600 text-white shadow-xl shadow-red-600/30 animate-pulse"
              : (isLight ? "bg-white/95 border-slate-200 shadow-sm text-slate-900" : "bg-slate-900/95 border-slate-800 text-white")
          )}>
            <div className="flex items-center gap-2.5">
              <div className={"w-8 h-8 rounded-xl flex items-center justify-center font-black text-white shadow-lg " + (isEmergency ? "bg-red-600 animate-bounce" : "bg-indigo-600")}>
                <Icon name={isEmergency ? "siren" : "navigation"} className="w-4 h-4 text-white" />
              </div>
              <div>
                <h1 className={"text-xs font-black flex items-center gap-1.5 " + (isEmergency ? "text-white" : (isLight ? "text-slate-900" : "text-white"))}>
                  AegisPath
                  <span className={"text-[9px] font-black px-2 py-0.5 rounded-full " + (isEmergency ? "bg-red-600 text-white border border-red-400 animate-pulse" : "bg-emerald-500/20 text-emerald-700 dark:text-emerald-400 border border-emerald-500/30")}>
                    {isEmergency ? "🚨 EVACUATION ACTIVE" : ("STAGE " + (activeStageIndex + 1) + "/" + multiFloorPipeline.length)}
                  </span>
                </h1>
                <p className={"text-[10px] font-medium truncate max-w-[140px] " + (isEmergency ? "text-red-200" : (isLight ? "text-slate-600" : "text-slate-400"))}>

                </p>

            <div className="flex items-center gap-1.5">

              <a
                href="/admin/login.html"

                    ? "bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border-indigo-200 shadow-sm"

                    : (isLight ? "bg-slate-100 text-slate-400 border-slate-300" : "bg-slate-800 text-slate-500 border-slate-700")
                )}
                title={soundEnabled ? "Mute Siren Alerts" : "Enable Siren Alerts"}
              >
                <Icon name="volume-2" className="w-4 h-4" />

              <button
                onClick={() => setAccessibilityMode(!accessibilityMode)}
                className={"px-2.5 py-1.5 rounded-xl border text-[11px] font-black transition flex items-center gap-1 " + (
                  accessibilityMode
                    ? "bg-emerald-600 text-white border-emerald-400 shadow-sm"
                    : (isLight ? "bg-slate-100 text-slate-700 border-slate-300" : "bg-slate-800 text-slate-300 border-slate-700")

                <span>♿</span>
              </button>
            </div>

          {statusNotification && (
            <div className="fixed top-14 left-1/2 -translate-x-1/2 z-50 bg-indigo-600 text-white font-black text-xs px-4 py-2 rounded-full shadow-2xl border border-indigo-400 animate-bounce">
              {statusNotification}

          {isEmergency && (
            <div className="w-full bg-red-950 border-b-4 border-red-600 shadow-2xl p-3.5 text-white space-y-2.5 animate-pulse">
              <div className="flex items-center justify-between pb-2 border-b border-red-800">
                <div className="flex items-center gap-2.5">
                  <div className="w-10 h-10 rounded-2xl bg-red-600 flex items-center justify-center font-black text-white text-xl shadow-2xl shadow-red-600/70 animate-bounce shrink-0">
                    🚨
                  </div>
                  <div>
                    <div className="flex items-center gap-1.5">
                      <span className="bg-red-600 text-white text-[9px] font-black uppercase px-2 py-0.5 rounded tracking-wider">
                        CRITICAL EVACUATION
                      </span>
                      <span className="text-red-300 text-[10px] font-mono">DYNAMIC RE-ROUTING</span>
                    </div>
                    <h2 className="text-xs font-black text-white mt-0.5">
                      Follow Illuminated Safe Green Evacuation Route
                    </h2>
                  </div>
                </div>
                <button
                  onClick={() => window.SafeWay?.resetAllToNormal?.()}
                  className="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 text-slate-200 rounded-xl text-[9px] font-bold uppercase tracking-wider border border-slate-700 shrink-0"
                >
                  Stand Down
                </button>
              </div>

              {/* Dynamic Evacuation Destination Card */}
              {evacuationResult && (
                <div className="bg-slate-950 rounded-2xl p-3 border-2 border-emerald-400 shadow-xl space-y-1.5">
                  <div className="flex items-center justify-between text-xs font-black text-emerald-400">
                    <span className="flex items-center gap-1">
                      <Icon name="shield" className="w-3.5 h-3.5 text-emerald-400" />
                      {evacuationResult.isRefugeRoute ? "FIRE POLICY: SAFE REFUGE ASSIGNED" : "NEAREST SAFE DESTINATION"}
                    </span>
                    <span className="font-mono text-emerald-300 font-bold">~{(evacuationResult.bestRoute?.totalDistance || 25) + "m"}</span>
                  </div>
                  <div className="text-sm font-black text-emerald-300 leading-snug">
                    {"Proceed to " + (evacuationResult.recommendedExit?.name || evacuationResult.recommendedAssembly?.name || evacuationResult.refugeNode?.name || "Designated Safe Zone")}
                  </div>
                  <p className="text-[11px] text-slate-300 font-medium">
                    {evacuationResult.safetyGuidance || "Follow green route markings. Avoid elevators and proceed calmly."}
                  </p>
                </div>
              )}
            </div>
          )}

          {/* Navigation Controls */}
          <div className="px-3.5 pt-2.5 space-y-2.5">
            {/* 1. CURRENT POSITION */}
            <div className={"border rounded-2xl p-2.5 flex items-center justify-between shadow-lg transition-colors " + (
              isLight ? "bg-white border-slate-300 shadow-slate-200" : "bg-slate-900 border-slate-800"
            )}>
              <div className="flex items-center gap-2 flex-1 min-w-0">
                <span className="w-6 h-6 rounded-lg bg-indigo-600/20 text-indigo-700 dark:text-indigo-400 flex items-center justify-center font-black text-xs shrink-0">📍</span>
                <div className="flex-1 min-w-0">
                  <span className={"text-[10px] font-black block " + (isLight ? "text-slate-700" : "text-slate-400")}>1. CURRENT POSITION:</span>
                  <select
                    value={originLocationKey}
                    onChange={(e) => handleOriginChange(e.target.value)}
                    className={"w-full bg-transparent text-xs font-black outline-none cursor-pointer truncate " + (isLight ? "text-slate-900" : "text-white")}
                  >
                    {ALL_CAMPUS_LOCATIONS_HIERARCHY.map(group => (
                      <optgroup key={group.group} label={group.group} className={isLight ? "bg-white text-indigo-800 font-bold" : "bg-slate-900 text-indigo-300 font-bold"}>
                        {group.items.map(item => (
                          <option key={item.key} value={item.key} className={isLight ? "bg-white text-slate-900 font-semibold" : "bg-slate-950 text-white font-medium"}>
                            {"📍 " + item.name}
                          </option>
                        ))}
                      </optgroup>
                    ))}
                  </select>
                </div>
              </div>
            </div>

            {/* 2. TARGET DESTINATION */}
            {!isEmergency && (
              <div className={"border rounded-2xl p-2.5 shadow-lg transition-colors " + (
                isLight ? "bg-white border-emerald-400 shadow-slate-200" : "bg-slate-900 border-emerald-500/50"
              )}>
                <div className="flex items-center justify-between pb-1">
                  <span className={"text-[10px] font-black flex items-center gap-1 " + (isLight ? "text-emerald-800" : "text-emerald-400")}>
                    🎯 2. TARGET DESTINATION:
                  </span>
                  <div className="flex items-center gap-1">
                    {activeStageIndex > 0 && (
                      <button
                        onClick={() => advanceToStage(activeStageIndex - 1)}
                        className={"text-[10px] font-bold px-1.5 py-0.5 rounded-lg border transition " + (isLight ? "bg-slate-100 text-slate-700 border-slate-300" : "bg-slate-800 text-slate-400 border-slate-700")}
                      >
                        ‹ Prev Floor
                      </button>
                    )}
                    {activeStageIndex < multiFloorPipeline.length - 1 && (
                      <button
                        onClick={() => advanceToStage(activeStageIndex + 1)}
                        className={"text-[10px] font-bold px-1.5 py-0.5 rounded-lg border transition " + (isLight ? "bg-indigo-50 text-indigo-700 border-indigo-300" : "bg-indigo-950 text-indigo-300 border-indigo-500/30")}
                      >
                        Next Floor ›
                      </button>
                    )}
                  </div>
                </div>
                <select
                  value={destinationLocationKey}
                  onChange={(e) => handleDestinationChange(e.target.value)}
                  className={"w-full border text-xs font-black rounded-xl p-2 outline-none focus:border-emerald-400 transition-colors " + (
                    isLight ? "bg-slate-50 border-slate-300 text-emerald-900" : "bg-slate-950 border-slate-700 text-emerald-300"
                  )}
                >
                  {ALL_CAMPUS_LOCATIONS_HIERARCHY.map(group => (
                    <optgroup key={group.group} label={group.group} className={isLight ? "bg-white text-indigo-800 font-bold" : "bg-slate-900 text-indigo-300 font-bold"}>
                      {group.items.map(item => (
                        <option key={item.key} value={item.key} className={isLight ? "bg-white text-slate-900 font-semibold" : "bg-slate-950 text-white font-medium"}>
                          {"🎯 " + item.name}
                        </option>
                      ))}
                    </optgroup>
                  ))}
                </select>
              </div>
            )}

            {/* Live Stage Guidance Header Banner */}
            <div className={"border rounded-2xl p-3 text-xs space-y-1.5 shadow-xl transition-colors " + (
              isEmergency
                ? "bg-red-950/80 border-red-600 text-white shadow-red-900/30"
                : (isLight ? "bg-indigo-50 border-indigo-300 text-indigo-950 shadow-slate-200" : "bg-indigo-950/80 border-indigo-500/50")
            )}>
              <div className="font-black flex items-center justify-between">
                <span className={"flex items-center gap-1.5 " + (isLight && !isEmergency ? "text-indigo-900" : "text-indigo-200")}>
                  <span className={"w-2 h-2 rounded-full " + (isEmergency ? "bg-red-500 animate-ping" : "bg-indigo-500 animate-ping")}></span>
                  {"Stage " + (activeStageIndex + 1) + " of " + multiFloorPipeline.length + ": " + currentActiveStage.title}
                </span>
                <span className={"text-[10px] font-mono font-bold px-2 py-0.5 rounded-md border " + (
                  isLight && !isEmergency
                    ? "bg-white text-emerald-800 border-emerald-300" 
                    : "bg-emerald-950/80 text-emerald-400 border-emerald-500/30"
                )}>
                  {activeMapPlan.label}
                </span>
              </div>
              <p className={"text-[11px] font-semibold " + (isLight && !isEmergency ? "text-slate-700" : "text-slate-300")}>
                {currentActiveStage.description}
              </p>
              {currentActiveStage.switchPrompt && (
                <div className={"flex items-center justify-between pt-1 border-t " + (isLight && !isEmergency ? "border-indigo-200" : "border-indigo-900/60")}>
                  <span className={"text-[10px] font-mono font-bold " + (isLight && !isEmergency ? "text-amber-800" : "text-amber-400")}>
                    ⚡ Auto-switches on arrival at target mark
                  </span>
                  <button
                    onClick={() => advanceToStage(activeStageIndex + 1)}
                    className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-md text-[9px] font-black shadow transition"
                  >
                    {currentActiveStage.switchPrompt}
                  </button>
                </div>
              )}
            </div>
          </div>

          {/* SVG Map Canvas */}
          <main className="flex-1 px-3.5 py-2 flex flex-col justify-center relative min-h-[310px]">
            <div className={"w-full border-2 rounded-3xl p-3 shadow-2xl relative overflow-hidden flex flex-col items-center transition-colors " + (
              isEmergency
                ? "border-red-600 bg-red-950/40 shadow-red-600/50 animate-pulse"
                : (isLight ? "bg-white border-slate-300 shadow-slate-300" : "bg-slate-900/90 border-slate-800")
            )}>
              <svg viewBox="0 0 1000 650" className={"w-full h-full max-h-[330px] rounded-2xl border " + (isLight ? "bg-white border-slate-300" : "bg-white border-slate-800")}>
                {/* Background Floor Plan Image */}
                <image
                  href={activeMapPlan.src || "/assets/college-campus-layout.jpeg"}
                  x="0"
                  y="0"
                  width="1000"
                  height="650"
                  preserveAspectRatio="xMidYMid meet"
                />

                {/* CAMPUS VIEW: Render Graph Routes & Waypoints */}
                {selectedMapId === "campus" && (
                  <>
                    {/* Safe Assembly Places */}
                    <g transform="translate(535,65)" onClick={() => notify("Playground Safe Area")} style={{ cursor: "pointer" }}>
                      <circle r="28" fill="#059669" fillOpacity="0.9" stroke="#ffffff" strokeWidth="2.5" />
                      <text y="4" textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="900">PLAYGROUND</text>
                    </g>
                    <g transform="translate(90,145)" onClick={() => notify("Back Yard Safe Area")} style={{ cursor: "pointer" }}>
                      <circle r="28" fill="#059669" fillOpacity="0.9" stroke="#ffffff" strokeWidth="2.5" />
                      <text y="4" textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="900">BACK YARD</text>
                    </g>

                    {/* Campus Graph Edges */}
                    <g id="campus-edges">
                      {campusEdges.map(edge => {
                        const u = bData.nodes.find(n => n.id === edge.from);
                        const v = bData.nodes.find(n => n.id === edge.to);
                        if (!u || !v) return null;
                        return (
                          <line
                            key={edge.id}
                            x1={u.x}
                            y1={u.y}
                            x2={v.x}
                            y2={v.y}
                            stroke="transparent"
                            strokeWidth="8"
                          />
                        );
                      })}
                    </g>

                    {/* Active Dijkstra Calculated Campus Route */}
                    {activeCampusRoute?.pathNodes?.length > 1 && (
                      <g id="active-campus-route">
                        {activeCampusRoute.pathNodes.slice(0, -1).map((node, idx) => {
                          const nextNode = activeCampusRoute.pathNodes[idx + 1];
                          return (
                            <g key={"route-seg-" + idx}>
                              <line
                                x1={node.x}
                                y1={node.y}
                                x2={nextNode.x}
                                y2={nextNode.y}
                                stroke={isEmergency ? "#10b981" : "#6366f1"}
                                strokeWidth="9"
                                strokeLinecap="round"
                                opacity="0.9"

                              <line

                                y1={node.y}
                                x2={nextNode.x}
                                y2={nextNode.y}

                                strokeWidth="3.5"
                                strokeDasharray="8 6"
                                strokeLinecap="round"
                                className="route-glow-dash"

                            key={node.id}
                            transform={"translate(" + node.x + ", " + node.y + ")"}
                            onClick={() => {
                              handleOriginChange("campus:" + node.id);
                            }}
                            style={{ cursor: "pointer" }}
                          >
                            <circle
                              r={isUserHere || isDest ? "16" : "9"}
                              fill={isUserHere ? "#0284c7" : isDest ? "#059669" : "#1e293b"}
                              stroke={isUserHere ? "#ffffff" : isDest ? "#ffffff" : "#64748b"}
                              strokeWidth={isUserHere || isDest ? "3" : "1.5"}
                            />
                            {isDest && (
                              <circle r="24" fill="#059669" fillOpacity="0.3" className="mobile-radar-pulse" />
                            )}
                          </g>
                        );
                      })}
                    </g>
                  </>
                )}

                {/* INDOOR BLOCK VIEW: Render Blue Dashed Path, Direction Arrow & Badges */}
                {selectedMapId !== "campus" && currentActiveStage && (
                  <>
                    <rect x="20" y="10" width="960" height="38" rx="10" fill="#0f172a" />
                    <text x="500" y="34" textAnchor="middle" fill="#ffffff" fontSize="15" fontWeight="900">
                      {activeMapPlan.group + " — " + activeMapPlan.label}
                    </text>

                    {currentActiveStage.d && (
                      <g>
                        <path
                          d={currentActiveStage.d}
                          fill="none"
                          stroke="#ffffff"
                          strokeWidth="11"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                          opacity="0.95"
                        />
                        <path
                          d={currentActiveStage.d}
                          fill="none"
                          stroke={isEmergency ? "#10b981" : "#2563eb"}
                          strokeWidth="6"
                          strokeDasharray="12 8"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                          className="route-glow-dash"
                        />

                        {/* Target End Point Badge (Stairs / Exit / Room) */}
                        {currentActiveStage.endPoint && (
                          <g transform={"translate(" + currentActiveStage.endPoint[0] + ", " + currentActiveStage.endPoint[1] + ")"}>
                            <circle r="18" fill={isEmergency ? "#10b981" : (currentActiveStage.targetBadgeColor || "#f59e0b")} stroke="#ffffff" strokeWidth="3" />
                            <text y="4" textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="900">
                              {isEmergency ? "EXIT" : (currentActiveStage.targetBadge || "TARGET")}
                            </text>
                            <g transform="translate(0, 24)">
                              <rect x="-70" y="-10" width="140" height="20" rx="7" fill="#0f172a" stroke="#ffffff" strokeWidth="1" />
                              <text y="4" textAnchor="middle" fill="#ffffff" fontSize="8.5" fontWeight="900">
                                {currentActiveStage.targetLabel || "DESTINATION"}
                              </text>
                            </g>
                          </g>
                        )}

                        {/* Bottom Status Banner */}
                        <g transform="translate(500, 615)">
                          <rect x="-175" y="-15" width="350" height="30" rx="10" fill="#0f172a" stroke={isEmergency ? "#10b981" : "#6366f1"} strokeWidth="2" />
                          <text y="5" textAnchor="middle" fill="#ffffff" fontSize="10.5" fontWeight="900" letterSpacing="0.5">
                            {currentActiveStage.title.toUpperCase()}
                          </text>
                        </g>
                      </g>
                    )}
                  </>
                )}

                {/* Live User Position Indicator */}
                <g transform={"translate(" + liveUserCoords[0] + ", " + liveUserCoords[1] + ")"}>
                  <circle r="36" fill="#0ea5e9" fillOpacity="0.3" className="mobile-radar-pulse" />
                  <circle r="14" fill="#0284c7" stroke="#ffffff" strokeWidth="4" />
                  
                  {/* Compass Needle */}
                  <g transform={"rotate(" + (compassHeading || 0) + ")"}>
                    <polygon points="0,-26 -7,-11 7,-11" fill="#ef4444" stroke="#ffffff" strokeWidth="1.5" />
                  </g>
                  <circle r="4" fill="#ffffff" />

                  <g transform="translate(0, 26)">
                    <rect x="-46" y="-9" width="92" height="18" rx="8" fill="#0284c7" stroke="#ffffff" strokeWidth="1.5" />
                    <text y="4" textAnchor="middle" fill="#ffffff" fontSize="8" fontWeight="900">
                      {stageStepCount > 0 ? ("👣 " + stageStepCount + " STEPS") : "YOU ARE HERE"}
                    </text>
                  </g>
                </g>
              </svg>

              {/* Telemetry HUD */}
              <div className={"absolute top-5 left-5 px-3 py-1.5 rounded-xl text-[10px] font-mono shadow-xl flex items-center gap-2 border transition-colors " + (
                isLight ? "bg-white/95 border-slate-300 text-slate-800 shadow-slate-300" : "bg-slate-950/90 border-slate-800 text-slate-300"
              )}>
                <span>👣 <b>{stageStepCount}</b> stage steps</span>
                <span className="opacity-40">|</span>
                <span>🧭 <b>{compassHeading}°</b></span>
              </div>
            </div>
          </main>

          {/* Turn-by-Turn Sequential Guidance Module */}
          <section className="px-3.5 pt-1 space-y-2">
            <div className={"border rounded-2xl p-3 shadow-xl space-y-2.5 transition-colors " + (
              isLight ? "bg-white border-slate-300 shadow-slate-200" : "bg-slate-900 border-slate-800"
            )}>
              <div className={"flex items-center justify-between pb-2 border-b " + (isLight ? "border-slate-200" : "border-slate-800")}>
                <button
                  onClick={() => setShowDirectionsDrawer(!showDirectionsDrawer)}
                  className={"flex items-center gap-2 text-xs font-black transition " + (
                    isLight ? "text-slate-900 hover:text-indigo-600" : "text-white hover:text-indigo-400"
                  )}
                >
                  <Icon name="list-ordered" className="w-4 h-4 text-emerald-600 dark:text-emerald-400" />
                  <span>Turn-by-Turn Sequential Guidance</span>
                  <Icon name={showDirectionsDrawer ? "chevron-up" : "chevron-down"} className="w-3.5 h-3.5 opacity-50" />
                </button>

                <span className={"text-[11px] font-mono font-bold px-2 py-0.5 rounded-lg border " + (
                  isLight ? "bg-emerald-50 text-emerald-800 border-emerald-300" : "bg-emerald-950/60 text-emerald-400 border-emerald-500/30"
                )}>
                  {"~" + totalEstimatedMeters + "m (" + totalEstimatedSeconds + "s)"}
                </span>
              </div>

              {showDirectionsDrawer && (
                <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
                  {multiFloorPipeline.map((stage, idx) => {
                    const isActive = idx === activeStageIndex;
                    const isPassed = idx < activeStageIndex;
                    return (
                      <div
                        key={idx}
                        onClick={() => advanceToStage(idx)}
                        className={"p-2.5 rounded-xl border flex items-start gap-2.5 transition cursor-pointer " + (
                          isActive
                            ? (isLight ? "bg-indigo-50 border-indigo-400 shadow-md ring-1 ring-indigo-400/40" : "bg-indigo-950/80 border-indigo-500/60 shadow-lg ring-1 ring-indigo-500/40")
                            : isPassed
                            ? (isLight ? "bg-emerald-50/60 border-emerald-300 opacity-90" : "bg-emerald-950/20 border-emerald-800/30 opacity-70")
                            : (isLight ? "bg-slate-50 border-slate-200" : "bg-slate-950/50 border-slate-800/70")
                        )}
                      >
                        <div
                          className={"w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-black shrink-0 mt-0.5 " + (
                            isActive
                              ? "bg-indigo-600 text-white shadow"
                              : isPassed
                              ? "bg-emerald-600 text-white"
                              : (isLight ? "bg-slate-200 text-slate-700" : "bg-slate-800 text-slate-400")
                          )}
                        >
                          {isPassed ? "✓" : (idx + 1)}
                        </div>

                        <div className="space-y-0.5 text-xs flex-1 min-w-0">
                          <div className={"font-bold flex items-center justify-between " + (isLight ? "text-slate-900" : "text-slate-100")}>
                            <span className="truncate pr-1">{stage.title}</span>
                            {isActive && (
                              <span className={"text-[9px] font-black px-1.5 py-0.2 rounded border shrink-0 " + (
                                isLight ? "bg-indigo-100 text-indigo-800 border-indigo-300" : "bg-indigo-950 text-indigo-300 border-indigo-500/40"
                              )}>
                                ACTIVE
                              </span>
                            )}
                          </div>
                          <div className={"text-[11px] leading-tight font-medium " + (isLight ? "text-slate-700" : "text-slate-400")}>{stage.description}</div>
                          
                          {stage.mapId !== selectedMapId && (
                            <button
                              type="button"
                              onClick={(e) => {
                                e.stopPropagation();
                                advanceToStage(idx);
                              }}
                              className="mt-1 px-2 py-0.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-md text-[9px] font-black transition"
                            >
                              View Floor Plan ➔
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </section>

          {/* Footer Controls */}
          <footer className={"p-3 border-t sticky bottom-0 z-30 space-y-2 mt-2 transition-colors " + (
            isLight ? "bg-white border-slate-300 shadow-lg" : "bg-slate-900 border-slate-800"
          )}>
            <div className="grid grid-cols-3 gap-2">
              <button
                onClick={takeStep}
                className={"py-3 rounded-2xl font-black text-xs border flex items-center justify-center gap-1 transition " + (
                  isLight ? "bg-slate-100 hover:bg-slate-200 text-slate-900 border-slate-300 shadow-sm" : "bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700"
                )}
              >
                <span>🚶 Step (+1)</span>
              </button>

              {/* Auto-Walk with Speed Toggle */}
              <div className="flex flex-col gap-0.5">
                <button
                  onClick={() => setAutoWalkActive(!autoWalkActive)}
                  className={"py-2 rounded-2xl font-black text-xs border transition flex items-center justify-center gap-1 " + (
                    autoWalkActive
                      ? "bg-amber-600/30 text-amber-600 dark:text-amber-300 border-amber-500/50 animate-pulse"
                      : (isLight ? "bg-slate-100 text-slate-900 border-slate-300 shadow-sm" : "bg-slate-800 text-slate-300 border-slate-700")
                  )}
                >
                  <span>{autoWalkActive ? "⏸ Pause" : "▶ Auto-Walk"}</span>
                </button>
                <button
                  onClick={() => setWalkSpeedMode(prev => prev === "1x" ? "2x" : "1x")}
                  className={"text-[9px] font-black py-0.5 rounded-lg border transition " + (
                    isLight ? "bg-slate-100 text-slate-700 border-slate-300" : "bg-slate-900 text-slate-400 border-slate-800"
                  )}
                >
                  Speed: <b>{walkSpeedMode === "1x" ? "1.4s (Normal)" : "0.7s (Fast)"}</b>
                </button>
              </div>

              <button
                onClick={() => setIsSosModalOpen(true)}
                className="py-3 bg-red-600 hover:bg-red-500 text-white rounded-2xl font-black text-xs shadow-lg shadow-red-600/40 flex items-center justify-center gap-1 animate-pulse"
              >
                <span>🆘 SOS</span>
              </button>
            </div>

            {/* Sensors Toggle Strip */}
            <div className={"flex items-center justify-between px-1 text-[10px] " + (isLight ? "text-slate-700 font-medium" : "text-slate-400")}>
              <button
                onClick={toggleSensors}
                className={"px-2.5 py-1 rounded-xl font-black border transition " + (
                  isMotionTracking
                    ? "bg-emerald-600/20 text-emerald-700 dark:text-emerald-300 border-emerald-500/40"
                    : (isLight ? "bg-slate-100 text-slate-700 border-slate-300" : "bg-slate-800 text-slate-400 border-slate-700")
                )}
              >
                {isMotionTracking ? "🟢 Sensors: ACTIVE" : "📱 Enable Physical Sensors"}
              </button>

              <button
                onClick={() => {
                  setStageStepCount(0);
                  setActiveStageIndex(0);
                  notify("↺ Navigation restarted at Stage 1");
                }}
                className={"font-mono font-bold transition " + (isLight ? "text-slate-600 hover:text-slate-900" : "text-slate-500 hover:text-slate-300")}
              >
                ↺ Restart Route
              </button>
            </div>
          </footer>

          {/* SOS Distress Modal */}
          {isSosModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-red-950/90 backdrop-blur-2xl">
              <div className={"border-2 border-red-600 rounded-3xl p-6 shadow-2xl max-w-sm w-full space-y-4 text-center relative " + (isLight ? "bg-white text-slate-900" : "bg-slate-900 text-white")}>
                <button
                  onClick={() => { setIsSosModalOpen(false); setSosSent(false); }}
                  className={"absolute top-4 right-4 p-1.5 rounded-xl text-xs font-black " + (isLight ? "text-slate-500 hover:text-slate-900" : "text-slate-400 hover:text-white")}
                  title="Close"
                >
                  ✕
                </button>

                <div className="w-14 h-14 rounded-2xl bg-red-600 flex items-center justify-center font-black text-white text-2xl mx-auto animate-bounce shadow-2xl shadow-red-600/60">
                  🆘
                </div>

                <div className="space-y-1">
                  <h3 className={"text-lg font-black " + (isLight ? "text-slate-900" : "text-white")}>Emergency Trapped Signal</h3>
                  <p className={"text-xs " + (isLight ? "text-slate-700" : "text-slate-300")}>
                    Transmitting your location to the Campus Security Command Center:
                  </p>
                  <div className="p-3 bg-red-50 dark:bg-slate-950 rounded-2xl border border-red-500/40 text-xs font-mono font-black text-red-600 dark:text-red-400">
                    {"📍 " + (activeOriginLocation?.name || "Campus") + " • " + activeMapPlan.label}
                  </div>
                </div>

                {sosSent ? (
                  <div className="space-y-2.5">
                    <div className="p-3 bg-emerald-50 dark:bg-emerald-950 border border-emerald-500/50 rounded-2xl text-emerald-700 dark:text-emerald-300 text-xs font-bold flex items-center justify-center gap-2">
                      <Icon name="check" className="w-4 h-4 text-emerald-500" />
                      Distress Beacon Active & Logged!
                    </div>
                    <button
                      onClick={() => { setIsSosModalOpen(false); setSosSent(false); }}
                      className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-2xl text-xs font-black transition border border-slate-700 shadow-lg flex items-center justify-center gap-1.5"
                    >
                      <span>‹ Back to Navigation Map</span>
                    </button>
                  </div>
                ) : (
                  <div className="flex gap-2">
                    <button
                      onClick={() => setIsSosModalOpen(false)}
                      className={"flex-1 py-3 rounded-2xl text-xs font-bold " + (isLight ? "bg-slate-200 hover:bg-slate-300 text-slate-800" : "bg-slate-800 hover:bg-slate-700 text-slate-300")}
                    >
                      Cancel
                    </button>
                    <button
                      onClick={triggerSosDistress}
                      className="flex-1 py-3 bg-red-600 hover:bg-red-500 text-white rounded-2xl text-xs font-black shadow-xl shadow-red-600/40"
                    >
                      SEND HELP
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<MobileApp />);
  </script>
</body>
</html>
