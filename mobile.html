<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SafeWay V3 Mobile — Smart Indoor Evacuation</title>

  <!-- PWA & Mobile Metadata -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- HTML5 QR Code Scanner CDN -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background: #020617;
      color: #f8fafc;
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.15); }
    }
    .mobile-pulse { animation: pulseGlow 1.8s infinite; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between select-none">
  <div id="root"></div>

  <script type="module">
    import { INITIAL_BUILDING_DATA } from './data/buildingGraph.js?v=campus-layout-5';
    import { findShortestPath, findSafestEvacuationPath } from './utils/pathfinder.js?v=campus-layout-7';
    import { INDOOR_ROUTE_NETWORKS } from './data/indoorRouteNetworks.js?v=guided-shortest-1';
    import { resolveQrCode, getQrPresets } from './services/qrLocation.js';
    import { subscribeToRealtimeData, setEmergencyActive, resetAllToNormal, registerActiveRoute } from './services/realtime.js';
    import { MotionTracker, interpolatePositionOnRoute } from './utils/motionTracker.js';

    window.SafeWayData = {
      INITIAL_BUILDING_DATA,
      findShortestPath,
      findSafestEvacuationPath,
      resolveQrCode,
      getQrPresets,
      subscribeToRealtimeData,
      setEmergencyActive,
      resetAllToNormal,
      registerActiveRoute,
      INDOOR_ROUTE_NETWORKS,
      MotionTracker,
      interpolatePositionOnRoute
    };
    window.dispatchEvent(new CustomEvent('safeway-ready'));
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function MobileApp() {
      const [bData, setBData] = useState(null);
      const [liveState, setLiveState] = useState(null);
      const [userLocationNodeId, setUserLocationNodeId] = useState("ent-main");
      const [destinationNodeId, setDestinationNodeId] = useState("lobby");
      const [stepCount, setStepCount] = useState(0);
      const [traveledDistance, setTraveledDistance] = useState(0);
      const [compassHeading, setCompassHeading] = useState(0);
      const [isMotionTracking, setIsMotionTracking] = useState(false);
      const [isQrModalOpen, setIsQrModalOpen] = useState(false);
      const [scannerActive, setScannerActive] = useState(false);
      const [qrInputText, setQrInputText] = useState("");
      const [soundEnabled, setSoundEnabled] = useState(true);

      const [tracker, setTracker] = useState(() => (window.SafeWayData?.MotionTracker ? new window.SafeWayData.MotionTracker() : null));

      useEffect(() => {
        if (!tracker && window.SafeWayData?.MotionTracker) {
          setTracker(new window.SafeWayData.MotionTracker());
        }
      }, [tracker]);

      useEffect(() => {
        let unsub = null;
        const initializeSafeWay = () => {
          if (window.SafeWayData && !bData) {
            setBData(window.SafeWayData.INITIAL_BUILDING_DATA);
            unsub = window.SafeWayData.subscribeToRealtimeData(state => setLiveState(state));
          }
        };

        initializeSafeWay();
        window.addEventListener('safeway-ready', initializeSafeWay);
        const interval = setInterval(initializeSafeWay, 60);

        return () => {
          clearInterval(interval);
          window.removeEventListener('safeway-ready', initializeSafeWay);
          if (unsub) unsub();
        };
      }, [bData]);

      useEffect(() => {
        if (!tracker) return;
        const unsub = tracker.subscribe(e => {
          if (e.type === 'STEP') {
            setStepCount(e.stepCount);
            setTraveledDistance(e.distance);
          } else if (e.type === 'ORIENTATION') {
            setCompassHeading(e.heading);
          } else if (e.type === 'RESET') {
            setStepCount(0);
            setTraveledDistance(0);
          }
        });
        return () => unsub();
      }, [tracker]);

      const isEmergency = liveState?.emergencyActive;
      const userNode = bData?.nodes?.find(n => n.id === userLocationNodeId);

      const handleQrSubmit = (e) => {
        if (e) e.preventDefault();
        const res = window.SafeWayData?.resolveQrCode(qrInputText);
        if (res && res.nodeId) {
          setUserLocationNodeId(res.nodeId);
          if (tracker) tracker.resetToOrigin();
          setIsQrModalOpen(false);
          setQrInputText("");
        }
      };

      const toggleSensors = async () => {
        if (!tracker) return;
        if (isMotionTracking) {
          tracker.stop();
          setIsMotionTracking(false);
        } else {
          const granted = await tracker.requestPermission();
          if (granted) {
            tracker.start();
            setIsMotionTracking(true);
          }
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between bg-slate-950">
          {/* Top Mobile Bar */}
          <header className="p-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between sticky top-0 z-30 shadow-xl">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-white shadow-lg">S</div>
              <div>
                <h1 className="text-sm font-black text-white flex items-center gap-1.5">
                  SafeWay V3 <span className="text-[9px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full font-bold">MOBILE</span>
                </h1>
                <p className="text-[10px] text-slate-400">Position: <b className="text-indigo-400">{userNode?.name || "Locating…"}</b></p>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <a href="/index.html" className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-bold rounded-xl border border-slate-700">
                🖥️ Desktop
              </a>
              <a href="/admin/login.html" className="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-bold rounded-xl shadow-md">
                🛡️ Admin
              </a>
            </div>
          </header>

          {/* Emergency Alert Header (if active) */}
          {isEmergency && (
            <div className="bg-red-600 text-white p-3 text-center text-xs font-black tracking-wide animate-pulse flex items-center justify-center gap-2 shadow-lg">
              <span>🚨 ACTIVE EVACUATION ALARM</span>
              <span>•</span>
              <span>FOLLOW GREEN PATH</span>
            </div>
          )}

          {/* Main Visual Map Area */}
          <main className="flex-1 p-4 flex flex-col items-center justify-center relative">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-2xl space-y-4 text-center">
              <div className="relative rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 aspect-[4/3] flex items-center justify-center">
                <img src="/assets/college-campus-layout.jpeg" className="w-full h-full object-cover opacity-80" alt="Campus Map" />
                
                {/* User Pin with Compass Needle */}
                <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                  <div className="relative flex items-center justify-center">
                    <div className="w-12 h-12 rounded-full bg-indigo-500/30 mobile-pulse absolute"></div>
                    <div className="w-6 h-6 rounded-full bg-blue-500 border-2 border-white shadow-xl flex items-center justify-center z-10">
                      <div className="w-2 h-2 rounded-full bg-white"></div>
                    </div>
                    {/* Compass needle */}
                    <div className="absolute w-1 h-10 -top-5 flex flex-col items-center transition-transform duration-300" style={{ transform: `rotate(${compassHeading}deg)` }}>
                      <div className="w-0 h-0 border-l-[4px] border-l-transparent border-r-[4px] border-r-transparent border-b-[10px] border-b-red-500"></div>
                    </div>
                  </div>
                </div>

                <div className="absolute top-2 left-2 bg-slate-950/90 border border-slate-800 px-2.5 py-1 rounded-xl text-[10px] font-mono text-slate-300">
                  🧭 {compassHeading}° Heading
                </div>
              </div>

              {/* Real-time Status Card */}
              <div className="grid grid-cols-3 gap-2 text-center text-xs font-mono">
                <div className="bg-slate-950 border border-slate-800 p-2.5 rounded-2xl">
                  <div className="text-[10px] text-slate-500 font-bold">STEPS</div>
                  <div className="text-sm font-black text-indigo-400">{stepCount}</div>
                </div>
                <div className="bg-slate-950 border border-slate-800 p-2.5 rounded-2xl">
                  <div className="text-[10px] text-slate-500 font-bold">DISTANCE</div>
                  <div className="text-sm font-black text-emerald-400">{traveledDistance.toFixed(1)}m</div>
                </div>
                <div className="bg-slate-950 border border-slate-800 p-2.5 rounded-2xl">
                  <div className="text-[10px] text-slate-500 font-bold">STATUS</div>
                  <div className="text-[11px] font-black text-sky-400">{isEmergency ? "EVACUATION" : "NORMAL"}</div>
                </div>
              </div>
            </div>
          </main>

          {/* Bottom Thumb Navigation Bar */}
          <footer className="p-4 bg-slate-900 border-t border-slate-800 sticky bottom-0 z-30">
            <div className="max-w-md mx-auto grid grid-cols-3 gap-2">
              <button
                onClick={() => setIsQrModalOpen(true)}
                className="py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-black text-xs shadow-lg shadow-indigo-600/30 flex flex-col items-center justify-center gap-1"
              >
                <span>📷 Scan QR</span>
              </button>

              <button
                onClick={() => tracker?.simulateStep(0.85)}
                className="py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-2xl font-black text-xs border border-slate-700 flex flex-col items-center justify-center gap-1"
              >
                <span>🚶 Step (+1)</span>
              </button>

              <button
                onClick={toggleSensors}
                className={`py-3 rounded-2xl font-black text-xs border transition flex flex-col items-center justify-center gap-1 ${
                  isMotionTracking
                    ? "bg-emerald-600 text-white border-emerald-500 shadow-lg"
                    : "bg-slate-800 text-slate-400 border-slate-700"
                }`}
              >
                <span>{isMotionTracking ? "🟢 Sensors ON" : "📱 Sensors"}</span>
              </button>
            </div>
          </footer>

          {/* QR Modal */}
          {isQrModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-2xl">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl max-w-sm w-full space-y-4">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <h3 className="text-sm font-black text-white">📷 Scan QR Waypoint</h3>
                  <button onClick={() => setIsQrModalOpen(false)} className="text-slate-400 hover:text-white font-black text-sm p-1">✕</button>
                </div>

                <form onSubmit={handleQrSubmit} className="space-y-3">
                  <input
                    type="text"
                    placeholder="e.g. SW-ROOM204 or SW-LAB101"
                    value={qrInputText}
                    onChange={(e) => setQrInputText(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-2xl p-3 text-xs text-white font-mono uppercase text-center"
                    autoFocus
                  />
                  <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl text-xs font-black shadow-lg">
                    Snap Location
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<MobileApp />);
  </script>
</body>
</html>
