    function selectBestEgressDoor(groundMapId, liveState) {
      const options = BLOCK_EGRESS_OPTIONS[groundMapId] || [];
      if (options.length === 0) {
        return { id: "Exit", label: "MAIN EXIT", point: [250, 590], campusNode: "admin", corridorY: 455, hubX: 500 };
      }

      const viable = options.filter(opt => {
        const doorKey = getControlId("door", groundMapId, opt.id);
        const areaKey = getControlId("area", groundMapId, opt.id);

        if (liveState?.exits?.[doorKey]?.isOpen === false) return false;
        if (liveState?.exits?.[opt.id]?.isOpen === false) return false;

        if (liveState?.hazards?.[doorKey] === "high" || liveState?.hazards?.[areaKey] === "high") return false;
        if (liveState?.hazards?.[opt.id] === "high") return false;

        if (liveState?.blockedEdges?.[doorKey] || liveState?.blockedEdges?.[opt.id]) return false;

        return true;
      });

      if (viable.length === 0) {
        return {
          id: "Area of Refuge",
          label: "SAFE AREA OF REFUGE (ALL EXITS BLOCKED)",
          point: [500, 390],
          campusNode: "admin",
          corridorY: 400,
          hubX: 500,
          isTrapped: true
        };
      }

      viable.sort((a, b) => {
        const doorKeyA = getControlId("door", groundMapId, a.id);
        const doorKeyB = getControlId("door", groundMapId, b.id);

        const crowdValA = liveState?.crowds?.[doorKeyA] || liveState?.crowds?.[a.id] || "Low";
        const crowdValB = liveState?.crowds?.[doorKeyB] || liveState?.crowds?.[b.id] || "Low";

        const crowdPenaltyA = crowdValA === "High" ? 80 : (crowdValA === "Medium" ? 30 : 0);
        const crowdPenaltyB = crowdValB === "High" ? 80 : (crowdValB === "Medium" ? 30 : 0);

        return (crowdPenaltyA + (a.defaultPriority || 1)) - (crowdPenaltyB + (b.defaultPriority || 1));
      });

      return viable[0];
    }

    function selectBestStairs(upperMapId, liveState) {

      if (options.length === 0) {
        return { id: "Stairs", label: "STAIRS", point: [800, 235], corridorY: 325, hubX: 520, groundStairs: [760, 250] };

        if (liveState?.blockedEdges?.[doorKey] || liveState?.blockedEdges?.[opt.id]) return false;
        return true;
      });

      return viable.length > 0 ? viable[0] : options[0];
    }

    function computeFloorPath(startPt, endPt, corridorY = 455, hubX = 500) {
      if (!startPt || !endPt) return [startPt || [500, 500], endPt || [500, 500]];
      const [x1, y1] = startPt;
      const [x2, y2] = endPt;

      if (Math.abs(x1 - x2) < 30) {
        return [
          [x1, y1],
          [x1, corridorY],
          [x2, y2]
        ];
      }

      if (Math.abs(y1 - y2) < 30) {
        return [
          [x1, y1],
          [x2, y2]
        ];
      }

      return [
        [x1, y1],
        [x1, corridorY],
        [hubX, corridorY],
        [x2, corridorY],
        [x2, y2]
      ];
    }

    function calculatePolylineLength(points) {
      if (!points || points.length < 2) return 1;
      let len = 0;
      for (let i = 0; i < points.length - 1; i++) {
        const dx = points[i+1][0] - points[i][0];
        const dy = points[i+1][1] - points[i][1];
        len += Math.sqrt(dx * dx + dy * dy);
      }
      return len;
    }

    function buildMultiFloorStagePipeline({
      activeOriginLocation,
      activeDestLocation,
      activeCampusRoute,
      liveState,
      accessibilityMode
    }) {
      const stages = [];
      const originMap = activeOriginLocation.mapId;
      const destMap = activeDestLocation.mapId;

      const originBlockPrefix = originMap !== "campus" ? originMap.split("-")[0] : null;
      const destBlockPrefix = destMap !== "campus" ? destMap.split("-")[0] : null;

      const isOriginUpperOrLower = originMap.includes("first") || originMap.includes("basement");
      const isDestUpperOrLower = destMap.includes("first") || destMap.includes("basement");

      // Dynamic Egress & Stairs Selection based on liveState
      const chosenStairs = isOriginUpperOrLower ? selectBestStairs(originMap, liveState) : null;
      const groundMapId = originBlockPrefix ? (originBlockPrefix + "-ground") : "campus";
      const chosenEgressDoor = selectBestEgressDoor(groundMapId, liveState);

      // SCENARIO 1: Origin is on 1F or Basement -> Route Down to Ground Floor first
      if (isOriginUpperOrLower) {
        const roomPt = activeOriginLocation.point || [500, 325];
        const stairsPt = chosenStairs?.point || [800, 235];
        const corridorY = chosenStairs?.corridorY || 325;
        const hubX = chosenStairs?.hubX || 520;

        const p1 = computeFloorPath(roomPt, stairsPt, corridorY, hubX);

        stages.push({
          stageKey: "origin-upper",
          mapId: originMap,
          title: "Step 1: Depart " + (activeOriginLocation.name.split('—')[1] || "Room"),
          description: "Walk along corridor to " + (chosenStairs?.label || "Stairs") + ".",
          targetBadge: "STAIRS",
          targetBadgeColor: "#f59e0b",
          targetLabel: chosenStairs?.label || "STAIRS",
          startPoint: roomPt,
          endPoint: stairsPt,
          points: p1,
          d: "M " + p1.map(p => p.join(" ")).join(" L "),
          pixelLength: calculatePolylineLength(p1),
          nextMapId: groundMapId,
          switchPrompt: "Descend to Ground Floor ➔",
          voiceAnnouncement: "Descended to " + originBlockPrefix + " Ground Floor. Showing path to " + chosenEgressDoor.label + "."
        });

        // Stage 2: Ground Floor of Origin Block (Stairs to Dynamic Egress Door)
        const gStairsPt = chosenStairs?.groundStairs || [760, 250];
        const gExitPt = chosenEgressDoor.point || [250, 590];
        const gCorridorY = chosenEgressDoor.corridorY || 455;
        const gHubX = chosenEgressDoor.hubX || 500;

        const p2 = computeFloorPath(gStairsPt, gExitPt, gCorridorY, gHubX);

        stages.push({
          stageKey: "origin-ground",
          mapId: groundMapId,
          title: chosenEgressDoor.isTrapped ? "Emergency: Safe Refuge Zone" : "Step 2: Ground Floor Egress",
          description: chosenEgressDoor.isTrapped ? "All exits compromised. Proceed to designated Safe Refuge Zone." : ("Walk from stairwell to " + chosenEgressDoor.label + "."),
          targetBadge: chosenEgressDoor.isTrapped ? "REFUGE" : "EXIT",
          targetBadgeColor: chosenEgressDoor.isTrapped ? "#ef4444" : "#10b981",
          targetLabel: chosenEgressDoor.label,
          startPoint: gStairsPt,
          endPoint: gExitPt,
          points: p2,
          d: "M " + p2.map(p => p.join(" ")).join(" L "),
          pixelLength: calculatePolylineLength(p2),
          nextMapId: (destMap === groundMapId) ? groundMapId : "campus",
          switchPrompt: chosenEgressDoor.isTrapped ? null : "Exit to Campus Ground ➔",
          voiceAnnouncement: "Exited " + originBlockPrefix + " Block via " + chosenEgressDoor.label + ". Showing outdoor campus map."
        });
      } else if (originMap.includes("ground")) {
        // Origin is on Ground Floor
        const roomPt = activeOriginLocation.point || [350, 455];
        const gExitPt = (destMap === originMap) ? (activeDestLocation.point || [830, 455]) : (chosenEgressDoor.point || [250, 590]);
        const gCorridorY = chosenEgressDoor.corridorY || 455;
        const gHubX = chosenEgressDoor.hubX || 500;

        const p = computeFloorPath(roomPt, gExitPt, gCorridorY, gHubX);

        stages.push({
          stageKey: "origin-ground",
          mapId: originMap,
          title: (destMap === originMap) ? ("Walk to " + (activeDestLocation.room || "Destination")) : ("Exit " + activeOriginLocation.name.split('—')[0] + " via " + chosenEgressDoor.label),
          description: (destMap === originMap) ? "Follow corridor to destination room." : ("Walk along hallway to " + chosenEgressDoor.label + "."),
          targetBadge: (destMap === originMap) ? "TARGET" : "EXIT",
          targetBadgeColor: (destMap === originMap) ? "#2563eb" : "#10b981",
          targetLabel: (destMap === originMap) ? (activeDestLocation.room || "ROOM") : chosenEgressDoor.label,
          startPoint: roomPt,
          endPoint: gExitPt,
          points: p,
          d: "M " + p.map(p => p.join(" ")).join(" L "),
          pixelLength: calculatePolylineLength(p),
          nextMapId: (destMap === originMap) ? originMap : "campus",
          switchPrompt: (destMap === originMap) ? null : "Exit to Campus Ground ➔",
          voiceAnnouncement: "Exited " + originBlockPrefix + " Block. Showing campus route."
        });
      }

      // SCENARIO 2: Campus Circulation Stage
      if (!chosenEgressDoor.isTrapped && (destMap === "campus" || destBlockPrefix !== originBlockPrefix)) {
        const campusPts = activeCampusRoute?.pathNodes?.map(n => [n.x, n.y]) || [[355, 206], [760, 490]];
        const targetBlockName = activeDestLocation.name.split('—')[0];

        stages.push({
          stageKey: "campus-walk",
          mapId: "campus",
          title: "Campus Walkway: Approach " + (destMap === "campus" ? activeDestLocation.name : targetBlockName),
          description: "Follow illuminated pathway across campus grounds.",
          targetBadge: destMap === "campus" ? "DESTINATION" : "GATE",
          targetBadgeColor: destMap === "campus" ? "#059669" : "#6366f1",
          targetLabel: destMap === "campus" ? activeDestLocation.name : (targetBlockName + " ENTRANCE"),
          startPoint: campusPts[0],
          endPoint: campusPts[campusPts.length - 1],
          points: campusPts,
          d: "M " + campusPts.map(p => p.join(" ")).join(" L "),
          pixelLength: calculatePolylineLength(campusPts),
          nextMapId: destMap !== "campus" ? (destBlockPrefix + "-ground") : "campus",
          switchPrompt: destMap !== "campus" ? ("Enter " + targetBlockName + " ➔") : null,
          voiceAnnouncement: destMap !== "campus" ? ("Arrived at " + targetBlockName + " entrance. Showing Ground Floor plan.") : ("Arrived at " + activeDestLocation.name + "!")
        });
      }

      // SCENARIO 3: Target Block Ingress (Ground Floor -> Target Room / Stairs)
      if (!chosenEgressDoor.isTrapped && destMap !== "campus" && (destBlockPrefix !== originBlockPrefix || (originMap === "campus"))) {
        const targetGroundMapId = destBlockPrefix + "-ground";
        const targetChosenDoor = selectBestEgressDoor(targetGroundMapId, liveState);
        const entryPt = targetChosenDoor.point || [250, 590];
        const targetEndPt = isDestUpperOrLower ? (selectBestStairs(destMap, liveState)?.groundStairs || [760, 250]) : (activeDestLocation.point || [830, 455]);
        const tCorridorY = targetChosenDoor.corridorY || 455;
        const tHubX = targetChosenDoor.hubX || 500;

        const pInGround = computeFloorPath(entryPt, targetEndPt, tCorridorY, tHubX);

        stages.push({
          stageKey: "target-ground",
          mapId: targetGroundMapId,
          title: isDestUpperOrLower ? "Enter Ground Floor & Head to Stairs" : ("Enter Ground Floor to " + (activeDestLocation.room || "Room")),
          description: isDestUpperOrLower ? "Walk through ground lobby to stairwell." : "Follow corridor to room doorway.",
          targetBadge: isDestUpperOrLower ? "STAIRS" : "TARGET",
          targetBadgeColor: isDestUpperOrLower ? "#f59e0b" : "#2563eb",
          targetLabel: isDestUpperOrLower ? "STAIRS" : (activeDestLocation.room || "ROOM"),
          startPoint: entryPt,
          endPoint: targetEndPt,
          points: pInGround,
          d: "M " + pInGround.map(p => p.join(" ")).join(" L "),
          pixelLength: calculatePolylineLength(pInGround),
          nextMapId: destMap,
          switchPrompt: isDestUpperOrLower ? ("Ascend to " + activeDestLocation.name.split('—')[1] + " ➔") : null,
          voiceAnnouncement: isDestUpperOrLower ? ("Ascended to " + activeDestLocation.name.split('—')[1] + ". Showing final floor route.") : ("Arrived at " + activeDestLocation.room + "!")
        });

        if (isDestUpperOrLower) {
          const targetStairs = selectBestStairs(destMap, liveState);
          const tStairsPt = targetStairs?.point || [800, 235];
          const tRoomPt = activeDestLocation.point || [500, 325];
          const finalCorridorY = targetStairs?.corridorY || 325;
          const finalHubX = targetStairs?.hubX || 520;

          const pFinal = computeFloorPath(tStairsPt, tRoomPt, finalCorridorY, finalHubX);

          stages.push({
            stageKey: "target-final",
            mapId: destMap,
            title: "Final Approach: " + (activeDestLocation.room || activeDestLocation.name),
            description: "Walk along corridor to room entrance.",
            targetBadge: "DESTINATION",
            targetBadgeColor: "#059669",
            targetLabel: activeDestLocation.room || "TARGET ROOM",
            startPoint: tStairsPt,
            endPoint: tRoomPt,
            points: pFinal,
            d: "M " + pFinal.map(p => p.join(" ")).join(" L "),
            pixelLength: calculatePolylineLength(pFinal),
            nextMapId: destMap,
            switchPrompt: null,
            voiceAnnouncement: "Arrived at destination: " + activeDestLocation.room + "!"
          });
        }
      }

      return stages.length > 0 ? stages : [
        {
          stageKey: "fallback",
          mapId: originMap,
          title: "Navigate to " + activeDestLocation.name,
          description: "Follow guidance path.",
          targetBadge: "TARGET",
          targetBadgeColor: "#2563eb",
          targetLabel: activeDestLocation.name,
          startPoint: [440, 565],
          endPoint: [760, 490],
          points: [[440, 565], [760, 490]],
          d: "M 440 565 L 760 490",
          pixelLength: 300,
          nextMapId: destMap
        }
      ];
    }

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playEmergencySirenPulse() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(960, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(560, ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 1.05;
          utterance.pitch = 1.0;
          window.speechSynthesis.speak(utterance);
        } catch (e) {}
      }
    }

    function getLocationDetails(key) {
      if (!key) return { block: "Campus Ground", floor: "Ground", room: "Select location", icon: "📍" };
      if (key.startsWith("campus:")) {
        const id = key.replace("campus:", "");

        return {
          block: "Main Campus Grounds",
          floor: "Ground",
          room: node?.name || id,
          icon: "🏫"
        };
      }
      const [mapId, roomName] = key.split(":");

      return {
        block: plan?.group || "College Block",
        floor: plan?.label || "Floor",
        room: roomName || "Room",

      };

    /**

    function CascadingLocationPicker({ isOpen, onClose, title, selectedKey, onSelectLocation, isLight }) {
      const [searchQuery, setSearchQuery] = useState("");

          list.push({

            floor: "Ground",
            room: n.name,
            mapId: "campus"
          });
        });
        MAP_PLANS.filter(p => p.id !== "campus").forEach(p => {
          (p.rooms || []).forEach(r => {
            list.push({
              key: p.id + ":" + r,
              name: p.group + " (" + p.label + ") — " + r,
              block: p.group,
              floor: p.label,
              room: r,
              mapId: p.id

        return list;

      const filteredPlaces = useMemo(() => {

        return allPlaces.filter(p => p.name.toLowerCase().includes(q) || p.room.toLowerCase().includes(q) || p.block.toLowerCase().includes(q));
      }, [searchQuery, allPlaces]);

      const blocks = [
        { id: "Main Campus Grounds", name: "Main Campus Grounds", icon: "🏫", desc: "Gates, Garden, Pond, Mandir, Canteen, Parking" },
        { id: "Ramanujan Block", name: "Ramanujan Block", icon: "🏢", desc: "Drawing Lab, Classrooms, Badminton Court, Labs" },
        { id: "Kalpana Chawla Block", name: "Kalpana Chawla Block", icon: "💻", desc: "Computer Labs, Training Halls, HOD CSE" },
        { id: "Raman Block", name: "Raman Block", icon: "🎭", desc: "Auditorium, Clubs (Samvaad & Kalakrit), Medical" },
        { id: "Aryabhatta Block", name: "Aryabhatta Block", icon: "📐", desc: "Classrooms, Labs, Temple, Large Rooms" },
        { id: "Bhabha Block", name: "Bhabha Block", icon: "📚", desc: "Digital & Main Library, ECE Lab, Director Office" }
      ];

      const availableFloors = useMemo(() => {
        if (!activeBlock) return [];
        if (activeBlock === "Main Campus Grounds") return [MAP_PLANS.find(p => p.id === "campus")];
        return MAP_PLANS.filter(p => p.group === activeBlock);
      }, [activeBlock]);

      const handleSelect = (key) => {
        onSelectLocation(key);
        onClose();
        setSearchQuery("");
        setActiveBlock(null);
        setActiveFloor(null);
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/80 backdrop-blur-md p-0 sm:p-4">
          <div className={"w-full max-w-lg rounded-t-3xl sm:rounded-3xl border shadow-2xl flex flex-col max-h-[85vh] transition-all " + (isLight ? "bg-white border-slate-200 text-slate-900" : "bg-slate-900 border-slate-700 text-white")}>
            <div className="p-4 border-b flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white text-sm shadow">
                  📍
                </div>
                <div>
                  <h3 className="font-black text-sm">{title}</h3>
                  <p className="text-[11px] text-slate-400">Drill down: Block ➔ Floor ➔ Room</p>
                </div>
              </div>
              <button
                onClick={() => { onClose(); setSearchQuery(""); setActiveBlock(null); setActiveFloor(null); }}
                className="p-1.5 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-white text-xs font-black"
              >
                ✕
              </button>
            </div>

            <div className="p-3 border-b border-slate-800/60 bg-slate-950/40">
              <div className="relative">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="🔍 Quick search room, lab, library, gate..."
                  className={"w-full py-2.5 pl-3 pr-8 rounded-xl text-xs font-bold outline-none border " + (isLight ? "bg-slate-100 border-slate-300 text-slate-900 focus:border-indigo-500" : "bg-slate-950 border-slate-700 text-white focus:border-indigo-400")}
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery("")} className="absolute right-2.5 top-2.5 text-xs text-slate-400">✕</button>
                )}
              </div>
            </div>

            {!searchQuery && (
              <div className="px-4 py-2 border-b border-slate-800/40 flex items-center gap-1.5 text-xs font-bold overflow-x-auto">
                <button
                  onClick={() => { setActiveBlock(null); setActiveFloor(null); }}
                  className={"px-2.5 py-1 rounded-lg transition " + (!activeBlock ? "bg-indigo-600 text-white" : "text-slate-400 hover:text-white")}
                >
                  🏫 1. Blocks
                </button>
                {activeBlock && (
                  <>
                    <span className="text-slate-600">›</span>
                    <button
                      onClick={() => setActiveFloor(null)}
                      className={"px-2.5 py-1 rounded-lg transition " + (activeBlock && !activeFloor ? "bg-indigo-600 text-white" : "text-slate-400 hover:text-white")}
                    >
                      {activeBlock}
                    </button>
                  </>
                )}
                {activeFloor && (
                  <>
                    <span className="text-slate-600">›</span>
                    <span className="px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-bold">
                      {activeFloor.label} (Rooms)
                    </span>
                  </>
                )}
              </div>
            )}

            <div className="p-4 overflow-y-auto flex-1 space-y-3">
              {searchQuery ? (
                <div className="space-y-2">
                  <div className="text-[11px] font-bold text-slate-400">Search Results ({filteredPlaces.length}):</div>
                  {filteredPlaces.length === 0 ? (
                    <div className="p-6 text-center text-xs text-slate-400">No rooms matching "{searchQuery}"</div>
                  ) : (
                    filteredPlaces.map(p => (
                      <button
                        key={p.key}
                        onClick={() => handleSelect(p.key)}
                        className={"w-full p-3 rounded-2xl border text-left flex items-center justify-between transition " + (
                          selectedKey === p.key
                            ? "bg-indigo-600/20 border-indigo-500 text-indigo-400"
                            : (isLight ? "bg-slate-50 hover:bg-indigo-50 border-slate-200" : "bg-slate-950/60 hover:bg-slate-800 border-slate-800")
                        )}
                      >
                        <div>
                          <div className="font-bold text-xs">{p.room}</div>
                          <div className="text-[10px] text-slate-400 font-mono">{p.block} • {p.floor}</div>
                        </div>
                        <span className="text-indigo-400 font-bold text-xs">Select ➔</span>
                      </button>
                    ))
                  )}
                </div>
              ) : !activeBlock ? (
                <div className="space-y-2">
                  <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Step 1: Choose Building / Block</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    {blocks.map(b => (
                      <button
                        key={b.id}
                        onClick={() => {
                          if (b.id === "Main Campus Grounds") {
                            setActiveBlock("Main Campus Grounds");
                            setActiveFloor(MAP_PLANS[0]);
                          } else {
                            setActiveBlock(b.id);
                          }
                        }}
                        className={"p-3.5 rounded-2xl border text-left transition flex items-start gap-3 " + (
                          isLight
                            ? "bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 border-slate-200"
                            : "bg-slate-950/70 hover:bg-slate-800 hover:border-indigo-500/50 border-slate-800"
                        )}
                      >
                        <span className="text-2xl">{b.icon}</span>
                        <div className="flex-1 min-w-0">
                          <div className="font-black text-xs">{b.name}</div>
                          <div className="text-[10px] text-slate-400 line-clamp-1 mt-0.5">{b.desc}</div>
                        </div>
                        <span className="text-slate-500 text-xs mt-1">›</span>
                      </button>
                    ))}
                  </div>
                </div>
              ) : !activeFloor ? (
                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Step 2: Choose Floor in {activeBlock}</div>
                    <button onClick={() => setActiveBlock(null)} className="text-[11px] text-indigo-400 font-bold">‹ Back to Blocks</button>
                  </div>
                  <div className="grid grid-cols-1 gap-2.5">
                    {availableFloors.map(f => (
                      <button
                        key={f.id}
                        onClick={() => setActiveFloor(f)}
                        className={"p-3.5 rounded-2xl border text-left transition flex items-center justify-between " + (
                          isLight
                            ? "bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 border-slate-200"
                            : "bg-slate-950/70 hover:bg-slate-800 hover:border-indigo-500/50 border-slate-800"
                        )}
                      >
                        <div className="flex items-center gap-3">
                          <span className="w-8 h-8 rounded-xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center font-bold text-xs">
                            {f.floor === 0 ? "B" : f.floor === 1 ? "G" : "1F"}
                          </span>
                          <div>
                            <div className="font-bold text-xs">{f.label}</div>
                            <div className="text-[10px] text-slate-400 font-mono">{(f.rooms || []).length} Mapped Rooms & Facilities</div>
                          </div>
                        </div>
                        <span className="text-indigo-400 text-xs font-bold">View Rooms ›</span>
                      </button>
                    ))}
                  </div>
                </div>
              ) : (
                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                      Step 3: Select Room ({activeFloor.group} • {activeFloor.label})
                    </div>
                    <button onClick={() => setActiveFloor(null)} className="text-[11px] text-indigo-400 font-bold">‹ Back to Floors</button>
                  </div>

                  {activeFloor.id === "campus" ? (
                    <div className="grid grid-cols-2 gap-2">
                      {(SafeWay.INITIAL_BUILDING_DATA?.nodes || []).filter(n => n.floor === 1 && ["room", "entrance", "assembly"].includes(n.type)).map(n => {
                        const k = "campus:" + n.id;
                        return (
                          <button
                            key={k}
                            onClick={() => handleSelect(k)}
                            className={"p-2.5 rounded-xl border text-left text-xs font-bold transition flex items-center justify-between " + (
                              selectedKey === k
                                ? "bg-indigo-600 text-white border-indigo-500 shadow"
                                : (isLight ? "bg-slate-50 hover:bg-indigo-50 border-slate-200" : "bg-slate-950/70 hover:bg-slate-800 border-slate-800")
                            )}
                          >
                            <span className="truncate">{n.name}</span>
                          </button>
                        );
                      })}
                    </div>
                  ) : (
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                      {(activeFloor.rooms || []).map(r => {
                        const k = activeFloor.id + ":" + r;
                        return (
                          <button
                            key={k}
                            onClick={() => handleSelect(k)}
                            className={"p-2.5 rounded-xl border text-left text-xs font-bold transition flex items-center justify-between " + (
                              selectedKey === k
                                ? "bg-indigo-600 text-white border-indigo-500 shadow"
                                : (isLight ? "bg-slate-50 hover:bg-indigo-50 border-slate-200" : "bg-slate-950/70 hover:bg-slate-800 border-slate-800")
                            )}
                          >
                            <span className="truncate">{r}</span>
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function MobileApp() {
      const [bData, setBData] = useState(() => window.SafeWay?.INITIAL_BUILDING_DATA);
      const [liveState, setLiveState] = useState(() => ({
        emergencyActive: false,
        hazards: {},
        crowds: {},
        corridorCrowds: {},
        exits: {},
        blockedEdges: {},
        distressSignals: {},
        emergencyPolicies: { allowElevatorsInFire: false, accessibleEvacuationStrategy: "refuge_zone" }
      }));

      // Selected Origin & Destination location keys
      const [originLocationKey, setOriginLocationKey] = useState("ramanujan-first:Drawing Lab");
      const [destinationLocationKey, setDestinationLocationKey] = useState("campus:auditorium");
      const [selectedMapId, setSelectedMapId] = useState("ramanujan-first");
      const [accessibilityMode, setAccessibilityMode] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [showDirectionsDrawer, setShowDirectionsDrawer] = useState(true);

      // Cascading Location Picker & Fullscreen Focus Mode Modals
      const [isOriginPickerOpen, setIsOriginPickerOpen] = useState(false);
      const [isDestPickerOpen, setIsDestPickerOpen] = useState(false);
      const [isMapFocusOpen, setIsMapFocusOpen] = useState(false);

      // Theme Management (Light / Dark)
      const [theme, setTheme] = useState(() => localStorage.getItem('aegispath_theme') || 'dark');

      useEffect(() => {
        localStorage.setItem('aegispath_theme', theme);
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
          document.body.style.backgroundColor = '#f1f5f9';
          document.body.style.color = '#0f172a';
        } else {
          document.documentElement.classList.add('dark');
          document.body.style.backgroundColor = '#020617';
          document.body.style.color = '#f8fafc';
        }
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

      // Walking Speed Selection (Natural 1.4s vs Brisk 0.7s)
      const [walkSpeedMode, setWalkSpeedMode] = useState("1x");

      // Multi-Floor Stage Index State
      const [activeStageIndex, setActiveStageIndex] = useState(0);
      const [stageStepCount, setStageStepCount] = useState(0);
      const [totalStepCount, setTotalStepCount] = useState(0);
      const [compassHeading, setCompassHeading] = useState(0);
      const [isMotionTracking, setIsMotionTracking] = useState(false);
      const [autoWalkActive, setAutoWalkActive] = useState(false);

      // SOS state
      const [isSosModalOpen, setIsSosModalOpen] = useState(false);
      const [sosReason, setSosReason] = useState("🔥 Trapped by Smoke / Fire");
      const [sosSent, setSosSent] = useState(false);
      const [audioClipData, setAudioClipData] = useState(null);
      const [isRecordingAudio, setIsRecordingAudio] = useState(false);
      const [recordingSecondsLeft, setRecordingSecondsLeft] = useState(10);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);
      const timerIntervalRef = useRef(null);
      const [statusNotification, setStatusNotification] = useState("");

      const startAudioRecording = async () => {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            notify("⚠️ Audio recording not supported on this browser");
            return;
          }
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunksRef.current = [];
          const recorder = new MediaRecorder(stream);
          mediaRecorderRef.current = recorder;

          recorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) {
              audioChunksRef.current.push(e.data);
            }
          };

          recorder.onstop = () => {
            const audioBlob = new Blob(audioChunksRef.current, { type: recorder.mimeType || 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = () => {
              setAudioClipData(reader.result);
            };
            reader.readAsDataURL(audioBlob);
            stream.getTracks().forEach(track => track.stop());
            setIsRecordingAudio(false);
          };

          recorder.start();
          setIsRecordingAudio(true);
          setRecordingSecondsLeft(10);

          let timeLeft = 10;
          if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
          timerIntervalRef.current = setInterval(() => {
            timeLeft -= 1;
            setRecordingSecondsLeft(timeLeft);
            if (timeLeft <= 0) {
              clearInterval(timerIntervalRef.current);
              if (recorder.state === 'recording') {
                recorder.stop();
              }
            }
          }, 1000);
        } catch (err) {
          console.error(err);
          notify("⚠️ Microphone access required to record voice message");
        }
      };

      const stopAudioRecording = () => {
        if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
          mediaRecorderRef.current.stop();
        }
        setIsRecordingAudio(false);
      };

      const clearAudioRecording = () => {
        if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
          mediaRecorderRef.current.stop();
        }
        setAudioClipData(null);
        setIsRecordingAudio(false);
        setRecordingSecondsLeft(10);
      };

      const activeMapPlan = MAP_PLANS.find(p => p.id === selectedMapId) || MAP_PLANS[0];

      // Live Presence Heartbeat
      useEffect(() => {
        if (window.SafeWay?.reportDevicePresence && activeOriginLocation) {
          window.SafeWay.reportDevicePresence({
            mapId: activeOriginLocation.mapId || "campus",
            roomName: activeOriginLocation.room || (activeOriginLocation.name ? activeOriginLocation.name.split('—')[1]?.trim() : "Campus"),
            name: activeOriginLocation.name || "Campus",
            floor: activeMapPlan?.floor ?? 1
          });
        }
        const interval = setInterval(() => {
          if (window.SafeWay?.reportDevicePresence && activeOriginLocation) {
            window.SafeWay.reportDevicePresence({
              mapId: activeOriginLocation.mapId || "campus",
              roomName: activeOriginLocation.room || (activeOriginLocation.name ? activeOriginLocation.name.split('—')[1]?.trim() : "Campus"),
              name: activeOriginLocation.name || "Campus",
              floor: activeMapPlan?.floor ?? 1
            });
          }
        }, 8000);
        return () => clearInterval(interval);
      }, [activeOriginLocation, activeMapPlan]);

      // Subscribe Realtime Sync
      useEffect(() => {
        if (window.SafeWay?.subscribeToRealtimeData) {
          const unsub = window.SafeWay.subscribeToRealtimeData(state => setLiveState(state));
          return () => { if (unsub) unsub(); };
        }
      }, []);

      const notify = (msg) => {
        setStatusNotification(msg);
        setTimeout(() => setStatusNotification(""), 3500);
      };

      const isEmergency = liveState.emergencyActive;

      // Sound Siren & Vocalization during Emergency
      useEffect(() => {
        let intervalId = null;
        if (isEmergency && soundEnabled) {
          speakText("Attention! Critical emergency evacuation active. Follow the illuminated green route immediately.");
          playEmergencySirenPulse();
          intervalId = setInterval(() => playEmergencySirenPulse(), 850);
        }
        return () => {
          if (intervalId) clearInterval(intervalId);
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        };
      }, [isEmergency, soundEnabled]);

      // Find active origin location object
      const activeOriginLocation = useMemo(() => {
        for (const group of ALL_CAMPUS_LOCATIONS_HIERARCHY) {
          const found = group.items.find(i => i.key === originLocationKey);
          if (found) return found;
        }
        return ALL_CAMPUS_LOCATIONS_HIERARCHY[0].items[0];
      }, [originLocationKey]);

      // Find active destination location object
      const activeDestLocation = useMemo(() => {
        for (const group of ALL_CAMPUS_LOCATIONS_HIERARCHY) {
          const found = group.items.find(i => i.key === destinationLocationKey);
          if (found) return found;
        }
        return ALL_CAMPUS_LOCATIONS_HIERARCHY[0].items[5]; // Garden
      }, [destinationLocationKey]);

      // Dynamic Egress Selection for Campus Handoff
      const originGroundMapId = activeOriginLocation.mapId !== "campus" ? (activeOriginLocation.mapId.split("-")[0] + "-ground") : "campus";
      const dynamicEgressDoor = useMemo(() => {
        return selectBestEgressDoor(originGroundMapId, liveState);
      }, [originGroundMapId, liveState]);

      // Determine Target Block Entrance Node on Campus Map
      const targetBlockEntranceNodeId = useMemo(() => {
        if (!activeDestLocation) return null;
        if (activeDestLocation.mapId === "campus") return activeDestLocation.nodeId;
        return BLOCK_CAMPUS_ENTRANCE_NODES[activeDestLocation.mapId] || null;
      }, [activeDestLocation]);

      // Handler for Origin Selection
      const handleOriginChange = (key) => {
        setOriginLocationKey(key);
        for (const group of ALL_CAMPUS_LOCATIONS_HIERARCHY) {
          const item = group.items.find(i => i.key === key);
          if (item) {
            setStageStepCount(0);
            setActiveStageIndex(0);
            if (item.mapId) setSelectedMapId(item.mapId);
            notify("📍 Origin: " + item.name);
            speakText("Current position: " + item.name);
            break;
          }
        }
      };

      // Handler for Destination Selection
      const handleDestinationChange = (key) => {
        setDestinationLocationKey(key);
        for (const group of ALL_CAMPUS_LOCATIONS_HIERARCHY) {
          const item = group.items.find(i => i.key === key);
          if (item) {
            setStageStepCount(0);
            setActiveStageIndex(0);
            notify("🎯 Target: " + item.name);
            speakText("Route plotted to " + item.name);
            break;
          }
        }
      };

      if (!bData) {
        return (
          <div className="flex h-screen items-center justify-center text-indigo-400 font-bold">
            Loading AegisPath System...
          </div>
        );
      }

      // Campus Dijkstra Graph Path calculation
      const effectiveEdges = bData.edges.map(e => ({
        ...e,
        blocked: liveState.blockedEdges[e.id] !== undefined ? liveState.blockedEdges[e.id] : e.blocked
      }));

      const effectiveExits = bData.exits.map(ex => ({
        ...ex,
        isOpen: liveState.exits[ex.id]?.isOpen !== false,
        crowdLevel: liveState.crowds[ex.id] || ex.crowdLevel
      }));

      const crowdInput = {
        exits: liveState.crowds,
        edges: liveState.corridorCrowds,
        zones: liveState.crowds
      };

      // Campus start node dynamically anchored to the chosen egress door!
      const campusOriginNodeId = activeOriginLocation.mapId === "campus" 
        ? activeOriginLocation.nodeId 
        : (dynamicEgressDoor?.campusNode || BLOCK_CAMPUS_ENTRANCE_NODES[activeOriginLocation.mapId] || "admin");
      const campusDestNodeId = targetBlockEntranceNodeId || "admin";

      const normalRoute = !isEmergency && window.SafeWay?.findShortestPath ? window.SafeWay.findShortestPath(
        campusOriginNodeId,
        campusDestNodeId,
        bData.nodes,
        effectiveEdges,
        { isEmergency: false, accessibilityMode },
        crowdInput,
        liveState.hazards,
        liveState.emergencyPolicies
      ) : null;

      const evacuationResult = isEmergency && window.SafeWay?.findSafestEvacuationPath ? window.SafeWay.findSafestEvacuationPath(
        campusOriginNodeId,
        bData.nodes,
        effectiveEdges,
        effectiveExits,
        bData.assemblyAreas,
        { isEmergency: true, accessibilityMode, nearestEmergencyDestination: true },
        crowdInput,
        liveState.hazards,
        liveState.emergencyPolicies
      ) : null;

      const activeCampusRoute = isEmergency ? evacuationResult?.bestRoute : normalRoute;

      // Build True Multi-Floor Dynamic Egress Pipeline (Reacts dynamically to liveState changes!)
      const multiFloorPipeline = useMemo(() => {
        return buildMultiFloorStagePipeline({
          activeOriginLocation,
          activeDestLocation,
          activeCampusRoute,
          liveState,
          accessibilityMode
        });
      }, [activeOriginLocation, activeDestLocation, activeCampusRoute, liveState, accessibilityMode]);

      // Current active stage object in pipeline
      const currentActiveStage = multiFloorPipeline[activeStageIndex] || multiFloorPipeline[0];

      // Keep selectedMapId synced with currentActiveStage map
      useEffect(() => {
        if (currentActiveStage?.mapId && selectedMapId !== currentActiveStage.mapId) {
          setSelectedMapId(currentActiveStage.mapId);
        }
      }, [activeStageIndex, currentActiveStage]);

      // Stage steps required for current sub-stage
      const stageTargetSteps = useMemo(() => {
        if (currentActiveStage?.mapId === "campus") {
          const dist = activeCampusRoute?.totalDistance || 45;
          return Math.max(15, Math.round(dist / 1.5));
        }
        return 18;
      }, [currentActiveStage, activeCampusRoute]);

      // Stage progress ratio (0.0 to 1.0)
      const stageProgress = Math.min(1.0, stageStepCount / (stageTargetSteps || 18));

      // Live Position Coordinate on Active Map
      const liveUserCoords = useMemo(() => {
        try {
          if (currentActiveStage?.points && stageStepCount > 0) {
            const pt = window.SafeWay?.interpolatePositionOnRoute?.(currentActiveStage.points, stageProgress * (currentActiveStage.pixelLength || 350));
            if (pt && Array.isArray(pt) && pt.length >= 2) return pt;
          }
          return currentActiveStage?.startPoint || [440, 565];
        } catch(e) {
          return currentActiveStage?.startPoint || [440, 565];
        }
      }, [currentActiveStage, stageStepCount, stageProgress]);

      // Advance to Next Stage in Pipeline
      const advanceToStage = (targetIndex) => {
        if (targetIndex < multiFloorPipeline.length) {
          setActiveStageIndex(targetIndex);
          setStageStepCount(0);
          const nextStage = multiFloorPipeline[targetIndex];
          setSelectedMapId(nextStage.mapId);
          if (nextStage.voiceAnnouncement) speakText(nextStage.voiceAnnouncement);
          notify("⚡ Stage " + (targetIndex + 1) + ": " + nextStage.title);
        }
      };

      // Step Execution & Automatic Multi-Floor Handoff
      const takeStep = () => {
        setTotalStepCount(prev => prev + 1);
        const nextSteps = stageStepCount + 1;

                  <circle r="36" fill="#0ea5e9" fillOpacity="0.3" className="mobile-radar-pulse" />
                  <circle r="14" fill="#0284c7" stroke="#ffffff" strokeWidth="4" />
                  
                  {/* Compass Needle */}
                  <g transform={"rotate(" + (compassHeading || 0) + ")"}>
                    <polygon points="0,-26 -7,-11 7,-11" fill="#ef4444" stroke="#ffffff" strokeWidth="1.5" />
                  </g>
                  <circle r="4" fill="#ffffff" />

                  <g transform="translate(0, 26)">
                    <rect x="-46" y="-9" width="92" height="18" rx="8" fill="#0284c7" stroke="#ffffff" strokeWidth="1.5" />
                    <text y="4" textAnchor="middle" fill="#ffffff" fontSize="8" fontWeight="900">
                      {stageStepCount > 0 ? ("👣 " + stageStepCount + " STEPS") : "YOU ARE HERE"}
                    </text>
                  </g>
                </g>
              </svg>

              {/* Telemetry HUD & Focus Map Button */}
              <div className="absolute top-5 left-5 right-5 flex items-center justify-between pointer-events-none">
                <div className={"px-3 py-1.5 rounded-xl text-[10px] font-mono shadow-xl flex items-center gap-2 border pointer-events-auto transition-colors " + (
                  isLight ? "bg-white/95 border-slate-300 text-slate-800 shadow-slate-300" : "bg-slate-950/90 border-slate-800 text-slate-300"
                )}>
                  <span>👣 <b>{stageStepCount}</b> steps</span>
                  <span className="opacity-40">|</span>
                  <span>🧭 <b>{compassHeading}°</b></span>
                </div>

                <button
                  onClick={() => setIsMapFocusOpen(true)}
                  className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-[10px] font-black shadow-xl flex items-center gap-1.5 pointer-events-auto transition active:scale-95 border border-indigo-400"
                  title="Open Fullscreen Focus Mode"
                >
                  <Icon name="maximize-2" className="w-3.5 h-3.5" />
                  <span>⛶ Focus Map</span>
                </button>
              </div>
            </div>
          </main>

          {/* Turn-by-Turn Sequential Guidance Module */}
          <section className="px-3.5 pt-1 space-y-2">
            <div className={"border rounded-2xl p-3 shadow-xl space-y-2.5 transition-colors " + (
              isLight ? "bg-white border-slate-300 shadow-slate-200" : "bg-slate-900 border-slate-800"
            )}>
              <div className={"flex items-center justify-between pb-2 border-b " + (isLight ? "border-slate-200" : "border-slate-800")}>
                <button
                  onClick={() => setShowDirectionsDrawer(!showDirectionsDrawer)}
                  className={"flex items-center gap-2 text-xs font-black transition " + (
                    isLight ? "text-slate-900 hover:text-indigo-600" : "text-white hover:text-indigo-400"
                  )}
                >
                  <Icon name="list-ordered" className="w-4 h-4 text-emerald-600 dark:text-emerald-400" />
                  <span>Turn-by-Turn Sequential Guidance</span>
                  <Icon name={showDirectionsDrawer ? "chevron-up" : "chevron-down"} className="w-3.5 h-3.5 opacity-50" />
                </button>

                <span className={"text-[11px] font-mono font-bold px-2 py-0.5 rounded-lg border " + (
                  isLight ? "bg-emerald-50 text-emerald-800 border-emerald-300" : "bg-emerald-950/60 text-emerald-400 border-emerald-500/30"
                )}>
                  {"~" + totalEstimatedMeters + "m (" + totalEstimatedSeconds + "s)"}
                </span>
              </div>

              {showDirectionsDrawer && (
                <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
                  {multiFloorPipeline.map((stage, idx) => {
                    const isActive = idx === activeStageIndex;
                    const isPassed = idx < activeStageIndex;
                    return (
                      <div
                        key={idx}
                        onClick={() => advanceToStage(idx)}
                        className={"p-2.5 rounded-xl border flex items-start gap-2.5 transition cursor-pointer " + (
                          isActive
                            ? (isLight ? "bg-indigo-50 border-indigo-400 shadow-md ring-1 ring-indigo-400/40" : "bg-indigo-950/80 border-indigo-500/60 shadow-lg ring-1 ring-indigo-500/40")
                            : isPassed
                            ? (isLight ? "bg-emerald-50/60 border-emerald-300 opacity-90" : "bg-emerald-950/20 border-emerald-800/30 opacity-70")
                            : (isLight ? "bg-slate-50 border-slate-200" : "bg-slate-950/50 border-slate-800/70")
                        )}
                      >
                        <div
                          className={"w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-black shrink-0 mt-0.5 " + (
                            isActive
                              ? "bg-indigo-600 text-white shadow"
                              : isPassed
                              ? "bg-emerald-600 text-white"
                              : (isLight ? "bg-slate-200 text-slate-700" : "bg-slate-800 text-slate-400")
                          )}
                        >
                          {isPassed ? "✓" : (idx + 1)}
                        </div>

                        <div className="space-y-0.5 text-xs flex-1 min-w-0">
                          <div className={"font-bold flex items-center justify-between " + (isLight ? "text-slate-900" : "text-slate-100")}>
                            <span className="truncate pr-1">{stage.title}</span>
                            {isActive && (
                              <span className={"text-[9px] font-black px-1.5 py-0.2 rounded border shrink-0 " + (
                                isLight ? "bg-indigo-100 text-indigo-800 border-indigo-300" : "bg-indigo-950 text-indigo-300 border-indigo-500/40"
                              )}>
                                ACTIVE
                              </span>
                            )}
                          </div>
                          <div className={"text-[11px] leading-tight font-medium " + (isLight ? "text-slate-700" : "text-slate-400")}>{stage.description}</div>
                          
                          {stage.mapId !== selectedMapId && (
                            <button
                              type="button"
                              onClick={(e) => {
                                e.stopPropagation();
                                advanceToStage(idx);
                              }}
                              className="mt-1 px-2 py-0.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-md text-[9px] font-black transition"
                            >
                              View Floor Plan ➔
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </section>

          {/* Footer Controls */}
          <footer className={"p-3 border-t sticky bottom-0 z-30 space-y-2 mt-2 transition-colors " + (
            isLight ? "bg-white border-slate-300 shadow-lg" : "bg-slate-900 border-slate-800"
          )}>
            <div className="grid grid-cols-3 gap-2">
              <button
                onClick={takeStep}
                className={"py-3 rounded-2xl font-black text-xs border flex items-center justify-center gap-1 transition " + (
                  isLight ? "bg-slate-100 hover:bg-slate-200 text-slate-900 border-slate-300 shadow-sm" : "bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700"
                )}
              >
                <span>🚶 Step (+1)</span>
              </button>

              {/* Auto-Walk with Speed Toggle */}
              <div className="flex flex-col gap-0.5">
                <button
                  onClick={() => setAutoWalkActive(!autoWalkActive)}
                  className={"py-2 rounded-2xl font-black text-xs border transition flex items-center justify-center gap-1 " + (
                    autoWalkActive
                      ? "bg-amber-600/30 text-amber-600 dark:text-amber-300 border-amber-500/50 animate-pulse"
                      : (isLight ? "bg-slate-100 text-slate-900 border-slate-300 shadow-sm" : "bg-slate-800 text-slate-300 border-slate-700")
                  )}
                >
                  <span>{autoWalkActive ? "⏸ Pause" : "▶ Auto-Walk"}</span>
                </button>
                <button
                  onClick={() => setWalkSpeedMode(prev => prev === "1x" ? "2x" : "1x")}
                  className={"text-[9px] font-black py-0.5 rounded-lg border transition " + (
                    isLight ? "bg-slate-100 text-slate-700 border-slate-300" : "bg-slate-900 text-slate-400 border-slate-800"
                  )}
                >
                  Speed: <b>{walkSpeedMode === "1x" ? "1.4s (Normal)" : "0.7s (Fast)"}</b>
                </button>
              </div>

              <button
                onClick={() => setIsSosModalOpen(true)}
                className="py-3 bg-red-600 hover:bg-red-500 text-white rounded-2xl font-black text-xs shadow-lg shadow-red-600/40 flex items-center justify-center gap-1 animate-pulse"
              >
                <span>🆘 SOS</span>
              </button>
            </div>

            {/* Sensors Toggle Strip */}
            <div className={"flex items-center justify-between px-1 text-[10px] " + (isLight ? "text-slate-700 font-medium" : "text-slate-400")}>
              <button
                onClick={toggleSensors}
                className={"px-2.5 py-1 rounded-xl font-black border transition " + (
                  isMotionTracking
                    ? "bg-emerald-600/20 text-emerald-700 dark:text-emerald-300 border-emerald-500/40"
                    : (isLight ? "bg-slate-100 text-slate-700 border-slate-300" : "bg-slate-800 text-slate-400 border-slate-700")
                )}
              >
                {isMotionTracking ? "🟢 Sensors: ACTIVE" : "📱 Enable Physical Sensors"}
              </button>

              <button
                onClick={() => {
                  setStageStepCount(0);
                  setActiveStageIndex(0);
                  notify("↺ Navigation restarted at Stage 1");
                }}
                className={"font-mono font-bold transition " + (isLight ? "text-slate-600 hover:text-slate-900" : "text-slate-500 hover:text-slate-300")}
              >
                ↺ Restart Route
              </button>
            </div>
          </footer>

          {/* SOS Distress Modal */}
          {isSosModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-red-950/90 backdrop-blur-2xl">
              <div className={"border-2 border-red-600 rounded-3xl p-6 shadow-2xl max-w-sm w-full space-y-4 text-center relative " + (isLight ? "bg-white text-slate-900" : "bg-slate-900 text-white")}>
                <button
                  onClick={() => { setIsSosModalOpen(false); setSosSent(false); }}
                  className={"absolute top-4 right-4 p-1.5 rounded-xl text-xs font-black " + (isLight ? "text-slate-500 hover:text-slate-900" : "text-slate-400 hover:text-white")}
                  title="Close"
                >
                  ✕
                </button>

                <div className="w-14 h-14 rounded-2xl bg-red-600 flex items-center justify-center font-black text-white text-2xl mx-auto animate-bounce shadow-2xl shadow-red-600/60">
                  🆘
                </div>

                <div className="space-y-2">
                  <h3 className={"text-lg font-black " + (isLight ? "text-slate-900" : "text-white")}>Emergency Trapped Signal</h3>
                  <p className={"text-xs " + (isLight ? "text-slate-700" : "text-slate-300")}>
                    Transmitting your location & situation to the Security Command Center:
                  </p>
                  <div className="p-2.5 bg-red-50 dark:bg-slate-950 rounded-2xl border border-red-500/40 text-xs font-mono font-black text-red-600 dark:text-red-400">
                    {"📍 " + (activeOriginLocation?.name || "Campus") + " • " + activeMapPlan.label}
                  </div>

                  {/* Distress Reason Selector */}
                  <div className="text-left space-y-1 pt-1">
                    <label className={"text-[10px] font-bold uppercase tracking-wider block " + (isLight ? "text-slate-600" : "text-slate-400")}>
                      Distress Reason / Situation:
                    </label>
                    <select
                      value={sosReason}
                      onChange={(e) => setSosReason(e.target.value)}
                      className={"w-full p-2.5 rounded-xl border text-xs font-bold outline-none " + (
                        isLight
                          ? "bg-slate-50 border-red-300 text-slate-900 focus:border-red-500"
                          : "bg-slate-950 border-red-500/50 text-white focus:border-red-400"
                      )}
                    >
                      <option value="🔥 Trapped by Smoke / Fire">🔥 Trapped by Smoke / Fire</option>
                      <option value="🚪 Blocked Stairway / Corridor Exit">🚪 Blocked Stairway / Corridor Exit</option>
                      <option value="🚑 Injured / Medical Emergency">🚑 Injured / Medical Emergency</option>
                      <option value="♿ Mobility Impairment / Assistance Needed">♿ Mobility Impairment / Assistance Needed</option>
                      <option value="⚠️ Structural Damage / Debris Obstruction">⚠️ Structural Damage / Debris Obstruction</option>
                    </select>
                  </div>

                  {/* 10-Second Voice Message Section */}
                  <div className="text-left space-y-1.5 pt-1">
                    <label className={"text-[10px] font-bold uppercase tracking-wider block " + (isLight ? "text-slate-600" : "text-slate-400")}>
                      🎙️ 10-Second Voice Distress Note (Optional):
                    </label>
                    
                    {isRecordingAudio ? (
                      <div className="p-3 bg-red-500/20 border border-red-500 rounded-2xl flex items-center justify-between animate-pulse">
                        <div className="flex items-center gap-2">
                          <span className="w-3 h-3 rounded-full bg-red-600 animate-ping"></span>
                          <span className="text-xs font-black text-red-500 dark:text-red-400">
                            Recording... ({recordingSecondsLeft}s left)
                          </span>
                        </div>
                        <button
                          onClick={stopAudioRecording}
                          className="px-3 py-1 bg-red-600 hover:bg-red-500 text-white rounded-xl text-[11px] font-black"
                        >
                          Done / Stop ⏹
                        </button>
                      </div>
                    ) : audioClipData ? (
                      <div className={"p-2.5 rounded-2xl border space-y-2 " + (isLight ? "bg-slate-50 border-emerald-500/50" : "bg-slate-950 border-emerald-500/50")}>
                        <div className="flex items-center justify-between text-[11px] font-bold text-emerald-600 dark:text-emerald-400">
                          <span>✅ 10s Voice Note Recorded</span>
                          <button
                            onClick={clearAudioRecording}
                            className="text-red-500 hover:text-red-400 text-[10px] font-bold flex items-center gap-1"
                          >
                            🗑️ Retake
                          </button>
                        </div>
                        <audio controls src={audioClipData} className="w-full h-8 rounded-lg" />
                      </div>
                    ) : (
                      <button
                        onClick={startAudioRecording}
                        className={"w-full py-2.5 px-3 rounded-2xl border text-xs font-bold transition flex items-center justify-center gap-2 " + (
                          isLight
                            ? "bg-slate-100 hover:bg-slate-200 text-slate-800 border-slate-300"
                            : "bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700"
                        )}
                      >
                        <span>🎙️ Tap to Record 10s Voice Note</span>
                      </button>
                    )}
                  </div>
                </div>

                {sosSent ? (
                  <div className="space-y-2.5">
                    <div className="p-3 bg-emerald-50 dark:bg-emerald-950 border border-emerald-500/50 rounded-2xl text-emerald-700 dark:text-emerald-300 text-xs font-bold flex items-center justify-center gap-2">
                      <Icon name="check" className="w-4 h-4 text-emerald-500" />
                      Distress Beacon Active & Logged!
                    </div>
                    <button
                      onClick={() => { setIsSosModalOpen(false); setSosSent(false); }}
                      className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-2xl text-xs font-black transition border border-slate-700 shadow-lg flex items-center justify-center gap-1.5"
                    >
                      <span>‹ Back to Navigation Map</span>
                    </button>
                  </div>
                ) : (
                  <div className="flex gap-2">
                    <button
                      onClick={() => setIsSosModalOpen(false)}
                      className={"flex-1 py-3 rounded-2xl text-xs font-bold " + (isLight ? "bg-slate-200 hover:bg-slate-300 text-slate-800" : "bg-slate-800 hover:bg-slate-700 text-slate-300")}
                    >
                      Cancel
                    </button>
                    <button
                      onClick={triggerSosDistress}
                      className="flex-1 py-3 bg-red-600 hover:bg-red-500 text-white rounded-2xl text-xs font-black shadow-xl shadow-red-600/40"
                    >
                      SEND HELP
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
          {/* Fullscreen Map Focus Mode Overlay */}
          {isMapFocusOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-2xl flex flex-col p-3 sm:p-6 animate-in fade-in duration-200">
              {/* Focus Top Bar */}
              <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                  <span className="text-xs font-black text-white uppercase tracking-wider">
                    🗺️ Immersive Map Focus • {activeMapPlan.label}
                  </span>
                </div>
                <button
                  onClick={() => setIsMapFocusOpen(false)}
                  className="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 rounded-xl text-xs font-black flex items-center gap-1.5 transition active:scale-95 shadow-lg"
                >
                  <Icon name="minimize-2" className="w-3.5 h-3.5 text-slate-400" />
                  <span>✕ Exit Focus</span>
                </button>
              </div>

              {/* Stage Instruction HUD Pill */}
              <div className="py-2 flex items-center justify-between gap-2">
                <div className="px-3 py-1.5 bg-indigo-950/80 border border-indigo-500/50 rounded-xl text-indigo-300 text-xs font-bold truncate flex-1 shadow">
                  {"Stage " + (activeStageIndex + 1) + ": " + currentActiveStage.title}
                </div>
                <div className="px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-300 text-xs font-mono shrink-0 shadow">
                  {"🧭 " + (compassHeading || 0) + "° • 👣 " + stageStepCount + " Steps"}
                </div>
              </div>

              {/* SVG Map Canvas (Immersive Full Screen) */}
              <div className="flex-1 rounded-3xl border-2 border-indigo-500/40 overflow-hidden flex items-center justify-center bg-white relative p-2 shadow-2xl">
                <svg viewBox="0 0 1000 650" className="w-full h-full object-contain">
                  <image
                    href={activeMapPlan.src || "/assets/college-campus-layout.jpeg"}
                    x="0"
                    y="0"
                    width="1000"
                    height="650"
                    preserveAspectRatio="xMidYMid meet"
                  />

                  {selectedMapId === "campus" && (
                    <>
                      <g transform="translate(535,65)" onClick={() => notify("Playground Safe Area")} style={{ cursor: "pointer" }}>
                        <circle r="28" fill="#059669" fillOpacity="0.9" stroke="#ffffff" strokeWidth="2.5" />
                        <text y="4" textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="900">PLAYGROUND</text>
                      </g>
                      <g transform="translate(90,145)" onClick={() => notify("Back Yard Safe Area")} style={{ cursor: "pointer" }}>
                        <circle r="28" fill="#059669" fillOpacity="0.9" stroke="#ffffff" strokeWidth="2.5" />
                        <text y="4" textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="900">BACK YARD</text>
                      </g>

                      {activeCampusRoute?.pathNodes?.length > 1 && (
                        <g id="focus-campus-route">
                          {activeCampusRoute.pathNodes.slice(0, -1).map((node, idx) => {
                            const nextNode = activeCampusRoute.pathNodes[idx + 1];
                            return (
                              <g key={"focus-seg-" + idx}>
                                <line
                                  x1={node.x}
                                  y1={node.y}
                                  x2={nextNode.x}
                                  y2={nextNode.y}
                                  stroke={isEmergency ? "#10b981" : "#6366f1"}
                                  strokeWidth="9"
                                  strokeLinecap="round"
                                  opacity="0.9"
                                />
                                <line
                                  x1={node.x}
                                  y1={node.y}
                                  x2={nextNode.x}
                                  y2={nextNode.y}
                                  stroke="#ffffff"
                                  strokeWidth="3.5"
                                  strokeDasharray="8 6"
                                  strokeLinecap="round"
                                  className="route-glow-dash"
                                />
                              </g>
                            );
                          })}
                        </g>
                      )}

                      {campusNodes.filter(n => ['entrance', 'room', 'lift', 'exit'].includes(n.type)).map(node => {
                        const isUserHere = campusOriginNodeId === node.id;
                        const isDest = campusDestNodeId === node.id;
                        return (
                          <g key={node.id} transform={"translate(" + node.x + "," + node.y + ")"}>
                            <circle
                              r={isUserHere || isDest ? 14 : 7}
                              fill={isDest ? "#10b981" : isUserHere ? "#3b82f6" : "#64748b"}
                              stroke="#ffffff"
                              strokeWidth={isUserHere || isDest ? 3 : 1.5}
                            />
                          </g>
                        );
                      })}
                    </>
                  )}

                  {selectedMapId !== "campus" && (
                    <>
                      {currentActiveStage?.d && (
                        <g id="focus-indoor-route">
                          <path
                            d={currentActiveStage.d}
                            fill="none"
                            stroke="#ffffff"
                            strokeWidth="11"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            opacity="0.95"
                          />
                          <path
                            d={currentActiveStage.d}
                            fill="none"
                            stroke={isEmergency ? "#10b981" : "#2563eb"}
                            strokeWidth="6"
                            strokeDasharray="12 8"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            className="route-glow-dash"
                          />

                          {currentActiveStage.endPoint && (
                            <g transform={"translate(" + currentActiveStage.endPoint[0] + ", " + currentActiveStage.endPoint[1] + ")"}>
                              <circle r="18" fill={isEmergency ? "#10b981" : (currentActiveStage.targetBadgeColor || "#f59e0b")} stroke="#ffffff" strokeWidth="3" />
                              <text y="4" textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="900">
                                {isEmergency ? "EXIT" : (currentActiveStage.targetBadge || "TARGET")}
                              </text>
                            </g>
                          )}
                        </g>
                      )}
                    </>
                  )}

                  {/* Live User Position Indicator */}
                  <g transform={"translate(" + liveUserCoords[0] + ", " + liveUserCoords[1] + ")"}>
                    <circle r="36" fill="#0ea5e9" fillOpacity="0.3" className="mobile-radar-pulse" />
                    <circle r="14" fill="#0284c7" stroke="#ffffff" strokeWidth="4" />
                    <g transform={"rotate(" + (compassHeading || 0) + ")"}>
                      <polygon points="0,-26 -7,-11 7,-11" fill="#ef4444" stroke="#ffffff" strokeWidth="1.5" />
                    </g>
                    <circle r="4" fill="#ffffff" />
                  </g>
                </svg>
              </div>

              {/* Floating Bottom Step Bar */}
              <div className="pt-3 flex items-center justify-between gap-3">
                <button
                  onClick={takeStep}
                  className="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-black text-xs shadow-xl shadow-indigo-600/40 flex items-center justify-center gap-1.5 transition active:scale-95"
                >
                  <span>🚶 Next Step (+1)</span>
                </button>
                <button
                  onClick={() => setAutoWalkActive(!autoWalkActive)}
                  className={"px-5 py-3.5 rounded-2xl font-black text-xs border transition flex items-center justify-center gap-1.5 " + (
                    autoWalkActive ? "bg-amber-600 text-white border-amber-400 animate-pulse shadow-lg shadow-amber-600/40" : "bg-slate-800 text-slate-200 border-slate-700"
                  )}
                >
                  <span>{autoWalkActive ? "⏸ Pause" : "▶ Auto-Walk"}</span>
                </button>
              </div>
            </div>
          )}

          {/* Cascading 3-Tier Location Pickers */}
          <CascadingLocationPicker
            isOpen={isOriginPickerOpen}
            onClose={() => setIsOriginPickerOpen(false)}
            title="Choose Starting Point"
            selectedKey={originLocationKey}
            onSelectLocation={handleOriginChange}
            isLight={isLight}
          />
          <CascadingLocationPicker
            isOpen={isDestPickerOpen}
            onClose={() => setIsDestPickerOpen(false)}
            title="Choose Target Destination"
            selectedKey={destinationLocationKey}
            onSelectLocation={handleDestinationChange}
            isLight={isLight}
          />
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<MobileApp />);
  </script>
</body>
</html>
